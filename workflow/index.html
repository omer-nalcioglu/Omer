<title>Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* ==========================================================================
   Workflow tasarım dili v2 · sahada kullanım için
   Layout: telefon genişliğinde tek sütun (en fazla 520px); üstte başlık, altta sabit menü, ayrıntılar alttan açılan pencerede.
   Kurallar: gövde 16px · en küçük 12px · her kontrol ≥48px, ana eylem 56px · renk yalnızca anlam taşır
   (mavi = dokunulabilir, yeşil = bitti/iyi, sarı = bekliyor/dikkat, kırmızı = durdu/gecikti) · tek ikon seti · 4px ızgara
   ========================================================================== */
:root {
  /* zemin ve yüzey: soğuk, hafif mavi eğilimli griler; güneşte parlamasın diye saf beyaz yalnızca kartlarda */
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --sunk: #e3e7ed;
  --ink: #0f1419;
  --ink-2: #3f4854;
  --ink-3: #59626e;
  --line: #d9dee5;
  --line-2: #c3cad4;
  /* tek vurgu: iş mavisi, yalnızca dokunulabilir öğelerde */
  --accent: #1d4ed8;
  --accent-2: #1a3fae;
  --on-accent: #ffffff;
  --accent-soft: #e5ecfd;
  /* durum renkleri: metin olarak beyaz zeminde en az 4.5:1 */
  --ok: #0b7a4b;
  --ok-soft: #dff3e8;
  --warn: #965a00;
  --warn-soft: #fcefd6;
  --bad: #c0291b;
  --bad-soft: #fde6e3;
  --info: var(--accent);
  --info-soft: var(--accent-soft);
  --band: #14181e;
  --band-ink: #dfe3ea;
  --shadow: 0 1px 2px rgba(15, 20, 25, .06);
  --shadow-lg: 0 10px 30px rgba(15, 20, 25, .16);
  /* ölçüler */
  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 24px;
  --tap: 48px; --tap-lg: 56px;
  --t-xs: .75rem; --t-sm: .875rem; --t-md: 1rem; --t-lg: 1.125rem; --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.25rem;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11; --surface: #161a1f; --surface-2: #1d2228; --sunk: #0a0c0e; --ink: #eef1f4; --ink-2: #b7bec8; --ink-3: #8a93a0; --line: #2a3038; --line-2: #3a424d;
    --accent: #8cadff; --accent-2: #a9c2ff; --on-accent: #0a1022; --accent-soft: #1a2442;
    --ok: #4fd39c; --ok-soft: #0f2a1e; --warn: #f2b65c; --warn-soft: #2d2311; --bad: #ff8b7c; --bad-soft: #361915;
    --band: #050607; --band-ink: #c9ced8; --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11; --surface: #161a1f; --surface-2: #1d2228; --sunk: #0a0c0e; --ink: #eef1f4; --ink-2: #b7bec8; --ink-3: #8a93a0; --line: #2a3038; --line-2: #3a424d;
  --accent: #8cadff; --accent-2: #a9c2ff; --on-accent: #0a1022; --accent-soft: #1a2442;
  --ok: #4fd39c; --ok-soft: #0f2a1e; --warn: #f2b65c; --warn-soft: #2d2311; --bad: #ff8b7c; --bad-soft: #361915;
  --band: #050607; --band-ink: #c9ced8; --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark;
}

/* ---------- temel ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: var(--t-md); line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "cv11", "ss03"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.sm { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

/* ---------- prototip bandı: uygulamanın parçası değil, koyu ve ayrık ---------- */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; }
.band-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 6px; font-size: var(--t-xs); }
.band-in span { opacity: .7; white-space: nowrap; font-weight: 500; letter-spacing: .02em; }
.band select { flex: 1; min-width: 0; height: 36px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); color: var(--band-ink); border-radius: var(--r-sm); padding: 0 10px; font-size: var(--t-sm); font-weight: 600; }
.band select option { color: #0f1419; background: #fff; }
.band button { color: var(--band-ink); opacity: .8; font-size: var(--t-xs); font-weight: 600; height: 36px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- sayfa iskeleti ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: calc(100% - 48px); display: flex; flex-direction: column; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { padding-block: 24px 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top > div { min-width: 0; }
.eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-family: var(--display); font-weight: 700; font-size: var(--t-2xl); letter-spacing: -.025em; margin: 4px 0 0; line-height: 1.15; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 650; font-size: var(--t-lg); margin: 0; letter-spacing: -.015em; line-height: 1.3; }
h3 { margin: 0; }
.bell { position: relative; width: var(--tap); height: var(--tap); border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); flex: none; }
.bell svg { width: 22px; height: 22px; }
.bell b { position: absolute; top: -5px; right: -5px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--bad); color: #fff; font-size: var(--t-xs); font-weight: 700; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--bg); }
main { display: flex; flex-direction: column; gap: 24px; padding-block: 16px 32px; }
section { display: flex; flex-direction: column; gap: 12px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.link { color: var(--accent); font-weight: 600; font-size: var(--t-sm); min-height: 44px; padding: 0 4px; }
.sec-h .pill::before { display: none; }
.sec-h .pill { padding-left: 10px; }
.track .ts { font-size: 0; gap: 0; }

/* ---------- durum özeti (patron paneli başı) ---------- */
.hero { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.hero .hic { width: 44px; height: 44px; border-radius: var(--r); display: grid; place-items: center; }
.hero .hic svg { width: 24px; height: 24px; }
.hero b { display: block; font-size: var(--t-lg); font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
.hero span { display: block; font-size: var(--t-sm); color: var(--ink-2); }
.hero.ok .hic { background: var(--ok-soft); color: var(--ok); }
.hero.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); } .hero.warn .hic { background: var(--warn-soft); color: var(--warn); }
.hero.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); } .hero.bad .hic { background: var(--bad-soft); color: var(--bad); }

/* ---------- sayı kutuları ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; text-align: left; min-height: 88px; display: grid; align-content: space-between; gap: 6px; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: var(--t-3xl); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: var(--t-sm); color: var(--ink-2); font-weight: 500; }
.kpi .num { font-size: var(--t-lg); }
.kpi.bad .v { color: var(--bad); }
.kpi.ok .v { color: var(--ok); }

/* ---------- dikkat listesi ---------- */
.att { display: grid; grid-template-columns: 36px minmax(0, 1fr) 20px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 16px; min-height: 64px; border-bottom: 1px solid var(--line); }
div.att { grid-template-columns: 36px minmax(0, 1fr); }
.att:last-child { border-bottom: 0; }
.att .aic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.att .aic svg { width: 20px; height: 20px; }
.aic.bad { background: var(--bad-soft); color: var(--bad); } .aic.warn { background: var(--warn-soft); color: var(--warn); } .aic.info { background: var(--accent-soft); color: var(--accent); } .aic.ok { background: var(--ok-soft); color: var(--ok); }
.atx { display: grid; gap: 1px; min-width: 0; }
.atx b { font-weight: 600; overflow-wrap: anywhere; }
.atx span { font-size: var(--t-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.chev { color: var(--ink-3); display: grid; } .chev svg { width: 20px; height: 20px; }
.allok { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); background: var(--ok-soft); }
.allok svg { width: 24px; height: 24px; color: var(--ok); justify-self: center; }
.allok b { display: block; } .allok span { font-size: var(--t-sm); color: var(--ink-2); }

/* eski uyarı kartı (raporlarda kullanılıyor) */
.ai { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 8px; }
.ai-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.spark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; flex: none; }
.ai ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: var(--t-sm); }

/* ---------- listeler ve iş satırı ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.jr { display: grid; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-height: 72px; }
.jr:last-child { border-bottom: 0; }
.jr:active, .att:active, .pr:active, .cr:active { background: var(--surface-2); }
.jr-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.jr .t { font-weight: 600; font-size: var(--t-md); overflow-wrap: anywhere; line-height: 1.35; }
.jr-h .mono { color: var(--ink-3); flex: none; }
.jr-m { font-size: var(--t-sm); color: var(--ink-2); }
.jr-m b { font-weight: 600; }
.jr .st { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.jr .pct { margin-left: auto; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.prog.ok i { background: var(--ok); }
.prog.bad i { background: var(--bad); }

/* ---------- durum etiketi ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; font-size: var(--t-xs); font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.2; }
.pill.bad, .pill.warn, .pill.ok { padding-left: 8px; }
.pill.bad::before, .pill.warn::before, .pill.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--accent-soft); color: var(--accent-2); }
.pill.mute { background: var(--sunk); color: var(--ink-2); }
.pill.acc { background: var(--accent); color: var(--on-accent); }

/* ---------- canlı akış ---------- */
.feed { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 16px; }
.fi { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); font-size: var(--t-sm); align-items: start; line-height: 1.45; }
.fi:last-child { border-bottom: 0; }
.fic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.fic svg { width: 16px; height: 16px; }
.fic.bad { background: var(--bad-soft); color: var(--bad); } .fic.ok { background: var(--ok-soft); color: var(--ok); } .fic.warn { background: var(--warn-soft); color: var(--warn); } .fic.info { background: var(--accent-soft); color: var(--accent); }
.fi time { font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }

/* ---------- düğmeler ---------- */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 10px 18px; border-radius: var(--r); font-weight: 600; font-size: var(--t-md); background: var(--accent); color: var(--on-accent); text-align: center; line-height: 1.25; }
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.line { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad-soft); color: var(--bad); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.block { width: 100%; }
.btn.xl { min-height: var(--tap-lg); padding-block: 14px; font-size: var(--t-lg); border-radius: var(--r-lg); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 72px; padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); font-weight: 600; font-size: var(--t-sm); text-align: center; position: relative; color: var(--ink); }
.tool .i { display: grid; place-items: center; line-height: 1; font-size: 1.3rem; }
.tool .i svg { width: 24px; height: 24px; }
.tool[data-issue] { color: var(--bad); }
.tool input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- görev kartı: çalışanın tek ekranı ---------- */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.task::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--warn); }
.task.working::before { background: var(--accent); }
.task.blocked::before { background: var(--bad); }
.task.working { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.task.blocked { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wo { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .04em; color: var(--ink-3); font-weight: 500; }
.task h3 { font-family: var(--display); font-size: var(--t-xl); line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.task p { margin: 0; color: var(--ink-2); }
.facts { display: grid; gap: 8px; font-weight: 500; font-size: var(--t-md); }
.facts > span { display: flex; align-items: center; gap: 10px; min-width: 0; }
.facts svg, .tic-i svg { width: 20px; height: 20px; color: var(--ink-3); }
.file { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent-2); font-weight: 600; text-align: left; width: 100%; }
.file svg { width: 20px; height: 20px; }
.timer { font-family: var(--mono); font-size: 2.25rem; font-weight: 500; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding-block: 4px; }
.attach { display: flex; gap: 8px; flex-wrap: wrap; }
.attach img { width: 64px; height: 64px; border-radius: var(--r-sm); object-fit: cover; border: 1px solid var(--line); }
.vn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-sm); font-weight: 500; }
.issue { background: var(--bad-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: var(--t-sm); display: grid; gap: 2px; }
.issue b { color: var(--bad); }
.scan { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.scan:last-child { border-bottom: 0; }
.scan .bx { width: 32px; height: 32px; border-radius: var(--r-sm); border: 2px solid var(--line-2); display: grid; place-items: center; font-weight: 800; color: transparent; }
.scan.on .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.scanrow { display: flex; gap: 8px; }
.scanrow input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-family: var(--mono); }
.sig { width: 100%; height: 170px; border-radius: var(--r); border: 2px dashed var(--line-2); background: var(--surface-2); touch-action: none; display: block; }
.map { border-radius: var(--r); overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.map svg { display: block; width: 100%; height: auto; }
ul.cl { margin: 8px 0 0; padding: 0; list-style: none; color: var(--ink-2); display: grid; gap: 6px; }
ul.cl li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; }
ul.cl li::before { content: ""; width: 14px; height: 14px; margin-top: 4px; border-radius: 4px; border: 2px solid var(--line-2); }

/* ---------- kişi satırı ---------- */
.pr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.pr:last-child { border-bottom: 0; }
.pr b { font-weight: 600; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: var(--t-sm); color: #fff; flex: none; letter-spacing: .02em; }
.load { height: 6px; border-radius: 3px; background: var(--sunk); margin-top: 6px; overflow: hidden; }
.load i { display: block; height: 100%; background: var(--accent); }

/* ---------- raporlar ---------- */
.bars { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.bar { display: grid; grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr) 3.5rem; gap: 10px; align-items: center; font-size: var(--t-sm); }
.bar .tr { height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.bar .tr i.hi { background: var(--bad); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* ---------- ayar satırı ve anahtar ---------- */
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 64px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.set b { font-weight: 600; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--line-2); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.flowline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: var(--t-sm); color: var(--ink-3); margin-top: 4px; }
.flowline span.s { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; color: var(--ink); font-weight: 500; }

/* ---------- alt menü ---------- */
nav.tabs { position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { min-height: 64px; padding-block: 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.tab .i { position: relative; width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .i { background: var(--accent-soft); color: var(--accent); }
.tb { position: absolute; top: -3px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.fab { position: fixed; z-index: 6; right: max(16px, calc(50% - 244px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; min-height: var(--tap-lg); padding: 0 20px; border-radius: var(--r-lg); background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--shadow-lg); }

/* ---------- alttan açılan pencere ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; padding-top: 6px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease-out; box-shadow: var(--shadow-lg); }
.sheet.still { animation: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sh-top { position: sticky; top: -6px; z-index: 2; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; background: var(--surface); margin: -6px -16px 8px; padding: 6px 8px 0; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto; grid-column: 2; }
.sx { grid-column: 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--surface-2); }
.sx svg { width: 20px; height: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > .btn.ghost.block:last-child { margin-top: -6px; }
textarea, .in { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); resize: vertical; font-size: var(--t-md); }
.in::placeholder, textarea::placeholder { color: var(--ink-3); }
.in:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
label.sm b, .stack > div > .sm b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); font-size: var(--t-sm); font-weight: 500; text-align: left; color: var(--ink); line-height: 1.25; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.risk[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }

/* ---------- iş detayı: aşama çizelgesi ---------- */
.graph { display: flex; flex-direction: column; }
.gstep { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 12px; }
.gstep::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
.gstep:last-child::before { display: none; }
.gstep.done::before { background: var(--ok); }
.dotn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: var(--t-sm); background: var(--surface); border: 2px solid var(--line-2); color: var(--ink-3); position: relative; }
.gstep.done .dotn { background: var(--ok); border-color: var(--ok); color: #fff; }
.gstep.cur .dotn { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.gstep.blk .dotn { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
.par { display: grid; gap: 8px; }
.pcard { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; }
.gstep.cur .pcard { background: var(--surface); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.pcard .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 600; }
.ptag { font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; color: var(--accent-2); }

/* ---------- yeni iş formu ---------- */
.plan { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; background: var(--surface-2); }
.plan-h { display: grid; gap: 4px; }
.pl { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.pl:last-child { border-bottom: 0; }
.pl > select { grid-column: 2; }
.pl .n { width: 28px; height: 28px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; font-size: var(--t-sm); display: grid; place-items: center; }
.pl select { width: 100%; min-width: 0; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: var(--t-sm); }
.note { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; font-size: var(--t-sm); display: grid; gap: 4px; line-height: 1.45; }
.note b { font-weight: 600; }
.note.info { background: var(--accent-soft); }
.thinking { display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-weight: 600; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.eta-box { border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 6px; font-size: var(--t-sm); border: 1px solid var(--line); }
.eta-box.ok { background: var(--ok-soft); color: var(--ink); border-color: transparent; }
.eta-box.ok .eyebrow { color: var(--ok) !important; }
.eta-box.bad { background: var(--bad-soft); color: var(--ink); border-color: transparent; }
.eta-box.bad .eyebrow { color: var(--bad) !important; }
.eta-big { font-family: var(--display); font-weight: 700; font-size: var(--t-xl); line-height: 1.2; letter-spacing: -.02em; }

/* ---------- müşteri takibi ---------- */
.track { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; display: grid; gap: 16px; }
.tsteps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.ts { display: grid; gap: 6px; text-align: center; font-size: var(--t-xs); font-weight: 500; color: var(--ink-3); line-height: 1.25; overflow-wrap: anywhere; }
.ts i { height: 6px; border-radius: 3px; background: var(--sunk); }
.ts.on i { background: var(--ok); }
.ts.cur i { background: var(--accent); }
.ts.cur { color: var(--ink); font-weight: 600; }
.eta { font-family: var(--display); font-weight: 700; font-size: var(--t-2xl); letter-spacing: -.025em; line-height: 1.15; }

/* ---------- akış düzenleyici ---------- */
.ed-name { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
.ed-name select { min-height: var(--tap); padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-size: 1.2rem; }
.ed-list { display: flex; flex-direction: column; gap: 12px; }
.ed-row { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: grid; gap: 10px; border-left: 4px solid var(--line-2); }
.ed-row.par { border-left-color: var(--accent); margin-left: 16px; }
.ed-top { display: grid; grid-template-columns: 28px minmax(0, 1fr) 44px 44px 44px; gap: 6px; align-items: center; }
.ed-top input, .ed-two input, .ed-two select { width: 100%; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); }
.ed-top input { font-weight: 600; }
.ed-n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: var(--t-sm); font-weight: 600; }
.ed-b { height: 44px; min-width: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); font-weight: 600; }
.ed-b.del { color: var(--bad); }
.ed-b:disabled { opacity: .35; }
.ed-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ed-two label { display: grid; gap: 4px; font-weight: 600; }
.ed-checks { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--t-sm); font-weight: 500; }
.ed-checks label { display: flex; gap: 8px; align-items: center; min-height: 40px; }
.ed-checks input { width: 20px; height: 20px; accent-color: var(--accent); }
.ed-row textarea { min-height: 72px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: var(--t-sm); }
.slarow { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 6px; }
.newdept { display: flex; gap: 8px; }
.newdept .in { flex: 1; min-width: 0; }
.rulebox { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 10px; }
.rulebox label { display: grid; gap: 4px; }
.rulebox select, .rulebox input { width: 100%; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); }
.preview { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; }
.preview .pcard { background: var(--surface); }

/* ---------- şablon kartları ---------- */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 360px) { .tgrid { grid-template-columns: 1fr; } }
.tcard { min-width: 0; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 12px; text-align: left; align-content: start; }
.tcard:hover { border-color: var(--line-2); }
.th { display: flex; gap: 12px; align-items: center; min-width: 0; }
.th > div { min-width: 0; }
.th b { display: block; line-height: 1.25; font-weight: 600; }
.th .sm { font-size: var(--t-xs); line-height: 1.35; }
.tcard .th { align-items: flex-start; flex-direction: column; gap: 8px; }
.tico { width: 40px; height: 40px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
.lane { display: flex; gap: 3px; align-items: center; }
.lane .seg { display: block; height: 6px; flex: 1 1 0; min-width: 0; border-radius: 3px; background: var(--line-2); }
.lane .seg.t-approval { background: var(--warn); }
.lane .seg.t-pack, .lane .seg.t-delivery { background: var(--accent); }
.lane .seg.par { flex-grow: .5; outline: 2px solid var(--surface); transform: translateY(-4px); }
.tmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--t-xs); color: var(--ink-2); font-weight: 500; }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; min-height: 72px; padding: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line-2); width: 100%; }
.choice:hover, .choice.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- darboğaz radarı ve takvim ---------- */
.radar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 16px; }
.rr { display: grid; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.rr:last-child { border-bottom: 0; }
.rh { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.rr .chip { justify-self: start; }
.rbar { height: 8px; border-radius: 4px; background: var(--sunk); display: flex; overflow: hidden; }
.rbar i { display: block; height: 100%; }
.rbar i.ok { background: var(--ok); } .rbar i.warn { background: var(--warn); } .rbar i.bad { background: var(--bad); }
.rbar i.over { background: repeating-linear-gradient(45deg, var(--bad), var(--bad) 4px, var(--bad-soft) 4px, var(--bad-soft) 8px); }
.heat td, .heat th { padding: 10px 6px; }
.hc { display: inline-grid; place-items: center; min-width: 40px; height: 28px; border-radius: var(--r-sm); font-size: var(--t-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.hc.l0 { background: var(--surface-2); color: var(--ink-3); } .hc.l1 { background: var(--surface-2); color: var(--ok); } .hc.l2 { background: var(--ok-soft); color: var(--ok); }
.hc.l3 { background: var(--warn-soft); color: var(--warn); } .hc.l4 { background: var(--bad); color: #fff; }

/* ---------- bildirim baloncuğu ve boş durum ---------- */
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(56px + env(safe-area-inset-top, 0px)); width: min(488px, calc(100% - 32px)); background: var(--ink); color: var(--surface); border-radius: var(--r-lg); padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-lg); animation: drop .25s ease-out; }
@keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } }
.toast b { display: block; font-weight: 600; }
.toast .sm { color: inherit; opacity: .78; }
.tic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .12); flex: none; }
.tic svg { width: 18px; height: 18px; }
.tic.ok { color: #6ee7b0; } .tic.bad { color: #ff9c8f; } .tic.warn { color: #ffcf7a; }
.empty { text-align: center; color: var(--ink-2); padding: 32px 16px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-lg); font-size: var(--t-sm); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.cr { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cr:last-child { border-bottom: 0; }
.cr .av, .cav { width: 42px; height: 42px; border-radius: 50%; }
.cav { display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); flex: none; }
.cav svg { width: 20px; height: 20px; }
.cav.k-announce { background: var(--accent); color: var(--on-accent); border: 0; }
.cav.k-job { background: var(--accent-soft); color: var(--accent); border: 0; }
.cav.k-customer { background: var(--ok-soft); color: var(--ok); border: 0; }
.ct { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ct b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ct time { font-size: .74rem; color: var(--ink-2); flex: none; }
.cp { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.cp .sm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr.unread .cp .sm { color: var(--ink); font-weight: 500; }
.ub { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; background: var(--accent); color: var(--on-accent); font-size: .7rem; font-weight: 700; display: grid; place-items: center; flex: none; }
.kt { display: block; margin-top: 2px; font-size: .66rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.chatview { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); }
.cvh { display: flex; align-items: center; gap: 10px; padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }

.cvh .sm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cvb { width: 36px; height: 36px; border-radius: 10px; font-size: 1.6rem; line-height: 1; color: var(--accent); flex: none; }
.pinbar { padding-block: 8px; background: var(--accent-soft); color: var(--ink); font-size: .84rem; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cvm { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-block: 14px; }
.dsep { align-self: center; font-size: .72rem; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.msys { align-self: center; max-width: 88%; text-align: center; font-size: .76rem; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 5px 10px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 82%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.mby { font-size: .72rem; color: var(--ink-2); font-weight: 600; padding-left: 4px; }
.bub { background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 9px 12px; text-align: left; font-size: .93rem; line-height: 1.4; overflow-wrap: anywhere; color: var(--ink); }

.bub img { display: block; max-width: 200px; border-radius: 10px; }
.men { font-weight: 700; }
.msg.me .men { color: inherit; text-decoration: underline; }
.voice { font-weight: 600; }
.pinmark { margin-right: 4px; }
.mt { font-size: .68rem; color: var(--ink-2); padding-inline: 4px; }
.mact { display: flex; gap: 6px; flex-wrap: wrap; }
.cvc { background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.cvc.ro { text-align: center; }
.qr { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.qr .chip { flex: none; }
.cvrow { display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
.cvrow .in { padding: 11px 12px; border-radius: 22px; }
.cbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); position: relative; cursor: pointer; }
.cbtn svg { width: 21px; height: 21px; }
.cbtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.cbtn.send { width: 44px; height: 44px; background: var(--accent); color: var(--on-accent); }
.mi { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; font-weight: 600; }
.mi svg { width: 20px; height: 20px; }

  // ---------- Modül Deposu ----------
  function recsFor(flows, jobs) {
    const out = {}, st = flows.flatMap(f => f.stages.map(x => ({ ...x, flow: f.name })));
    const hit = (re, type) => st.find(x => (type && x.type === type) || re.test(lower(x.name)));
    let h;
    if ((h = hit(/teslim|nakliye|kargo|yerinde/, "delivery"))) out.fleet = `Akışında “${h.name}” aşaması var`;
    if ((h = hit(/paketleme|sevkiyat|yükleme/, "pack"))) out.scan = `“${h.name}” aşamasında ürünler okutularak sayılabilir`;
    if ((h = hit(/malzeme|depo|stok|toplama|kumaş|parça/))) out.stock = `“${h.name}” aşaması stok bilgisi ister`;
    const longest = flows.reduce((a, f) => f.stages.length > (a?.stages.length || 0) ? f : a, null);
    if (longest && longest.stages.filter(x => !x.par).length >= 6) out.planning = `${longest.stages.length} aşamalı “${longest.name}” akışında termin hesabı en çok fark yaratır`;
    if (st.some(x => x.type === "approval")) out.rules = "Onay adımların var; kurallar onayları otomatik yönetebilir";
    if (jobs.some(j => j.price > 0) || st.some(x => /fiyat|ödeme|hakediş|tahsilat|teklif/.test(lower(x.name)))) out.finance = "İşlerinde tutar ve ödeme adımı var";
    if (st.some(x => x.pub && x.pub !== x.name) || flows.some(f => f.prefs?.custNotify)) out.customers = "Müşteriye gösterilecek aşama adların hazır";
    if ((h = hit(/kalite|kontrol|ölçü|keşif|muayene|test|ekspertiz/))) out.forms = `“${h.name}” aşamasında ölçü ve kontrol değerleri kayıt altına alınabilir`;
    out.chat = "Ekip iletişimi işin içinde kalır, WhatsApp gruplarına gerek kalmaz";
    if (jobs.filter(j => j.done).length >= 3 || (longest && longest.stages.length >= 6)) out.reports = "Aşama sürelerini ölçmeye yetecek iş hacmin var";
    return out;
  }
  function screensByRole(mods) {

    if (mods.fleet) R.push(["Şoför", ["Teslimatlarım", "İmza ve fotoğraf"]]);

    return R;
  }

      $("#nGo").onclick = () => {

        if (!title || !customer || !dvv) { $("#nMsg").textContent = "Ürün / iş, müşteri ve termin gerekli."; (!title ? $("#nTitle") : !customer ? $("#nCust") : $("#nDue")).focus(); return; }
        const owners = {}; layer.querySelectorAll("[data-owner]").forEach(x => owners[x.dataset.owner] = x.value);
        const [y, m, d] = dvv.split("-").map(Number);
        const price = $("#nPrice") ? +($("#nPrice").value || "0").replace(/\D/g, "") : 0;
        const j = mkJob({ flowId: $("#nFlow").value, id: D.nextId++, title, customer, qty: $("#nQty").value.trim() || "1 adet", due: new Date(y, m - 1, d, 17).getTime(), at: 0, waiting: 0,
          price, cost: Math.round(price * .65), createdAt: Date.now(), owners, urgent: $("#nUrgent").checked, address: D.mods.fleet ? $("#nAddr").value.trim() : "" });
        if (!D.mods.fleet) { j.steps = j.steps.filter(s => s.type !== "delivery"); normalize(j); }
        applyCreateRules(j, false);
        const mz = j.steps.find(s => s.key === "malzeme") || j.steps[0];
        warn().filter(x => x.startsWith("Stok")).forEach(x => mz.notes.push({ kind: "text", text: x, by: "selim", at: Date.now() }));
        j.steps.filter(s => s.status === "ready").forEach(s => s.readyAt = Date.now());
        D.jobs.push(j);
        const g0 = j.steps.filter(s => s.g === 0);
        notify(`${first(PAT())} yeni iş açtı: #${j.id} ${title} (${customer}) · ${g0.map(s => first(s.owner)).join(" ve ")} bilgilendirildi`, "🆕", g0.map(s => s.owner));
        save(); closeSheet(); tab = "panel"; render(); window.scrollTo(0, 0);
        toast("🆕", `#${j.id} iş emri dağıtıldı`, `${j.steps.length} aşama · ilk aşama: ${g0.map(s => first(s.owner)).join(" ∥ ")}`);
      };
    });
  }

          <button class="btn ok" data-approve="${j.id}:${s.key}">Onayla</button></div>`).join("")}</div>` : `<div class="empty">Onay bekleyen iş yok.</div>`}</section>
      <section><h2>Ekip yükü</h2><div class="list">${workers.map(p => { const st = personStatus(p.id);

  // ----- worker (production, QC, warehouse) -----
  let tick = null;
  function myTasks(id) {
    return D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => onStep(s, id) && ["ready", "working", "blocked"].includes(s.status)).map(s => ({ j, s })))
      .sort((a, b) => (b.s.status === "working") - (a.s.status === "working") || (a.s.deadline || a.j.due) - (b.s.deadline || b.j.due));
  }
  function renderWorker() {
    setNav(roleNav("Görevlerim"));
    const p = person(me), tasks = myTasks(me);
    const queued = D.jobs.filter(j => !j.done).flatMap(j => j.steps.filter(s => s.owner === me && s.status === "locked").map(s => ({ j, s })));
    $("#app").innerHTML = head(`Çalışan paneli · ${esc(p.title)}`, "Görevlerim", bellCount(me)) + `<main class="gut">
      <p style="margin:0;font-size:1.05rem;font-weight:600">${tasks.length ? `Bugün ${tasks.length} görevin var.` : "Şu an bekleyen görevin yok."}</p>
      ${tasks.map(({ j, s }) => taskCard(j, s)).join("")}
      ${queued.length ? `<section><h2>Sırada gelecek</h2><div class="list">${queued.map(({ j, s }) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="mono sm">#${j.id}</span> <b>${esc(j.title)}</b><div class="sm">${esc(s.name)} · önceki aşama bitince bildirim gelir</div></div><span class="pill mute">Bekliyor</span></div>`).join("")}</div></section>` : ""}
      ${p.role === "depo" && D.mods.stock ? stockHtml() : ""}
    </main>`;
    clearInterval(tick);
    if (tasks.some(x => x.s.status === "working")) tick = setInterval(() => document.querySelectorAll("[data-timer]").forEach(el => el.textContent = clock(+el.dataset.timer)), 1000);
  }
  const clock = t => { const s = Math.max(0, Math.floor((Date.now() - t) / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  function taskCard(j, s) {
    const k = `${j.id}:${s.key}`;

    const facts = `<div class="facts">${s.place ? `<span>${ico("pin")}${esc(s.place)}</span>` : ""}<span>${ico("clock")}Teslim: ${esc(s.deadline ? when(s.deadline) : dayLabel(j.due))}</span><span>${ico("box")}${esc(j.qty)}</span></div>`;
    const attach = s.photos.length || s.notes.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="Eklenen fotoğraf">`).join("")}${s.notes.map(n => `<span class="vn">${n.kind === "voice" ? "🎙 " + esc(n.text) : "📝 " + esc(n.text)}</span>`).join("")}</div>` : "";
    const tools = `<div class="grid3">
        <label class="tool"><span class="i">${ico("camera")}</span>Fotoğraf<input type="file" accept="image/*" data-photo="${k}"></label>
        <button class="tool" data-voice="${k}"><span class="i">${ico("mic")}</span>Sesli not</button>
        <button class="tool" data-issue="${k}"><span class="i">${ico("alert")}</span>Sorun bildir</button></div>`;
    let body = "";
    if (s.status === "blocked") body = `<div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}<div class="sm">Ustabaşı ve patron bilgilendirildi. Çözülünce bildirim gelecek.</div></div>`;
    else if (s.type === "approval") body = `${s.cust && D.mods.customers ? `<div class="note info"><b>Müşteri onayı</b><span>${esc(j.customer)} takip ekranından kendisi onaylayabilir. Telefonda onay aldıysan sen de onaylayabilirsin.</span></div>` : ""}${formHtml(j, s, k, true)}${tools}<div class="${flowOf(j).prefs.sendBack ? "grid2" : ""}"><button class="btn ok xl${flowOf(j).prefs.sendBack ? "" : " block"}" data-approve="${k}"${gate(s).block ? " disabled" : ""}>${gate(s).fails ? "Sapmayla onayla" : s.final ? "Tamamlandı ✓" : "Onayla ✓"}</button>${flowOf(j).prefs.sendBack ? `<button class="btn bad xl" data-back="${k}">Geri gönder</button>` : ""}</div><div class="sm fhint" data-fhint="${k}">${gate(s).hint}</div>`;
    else if (s.type === "pack" && D.mods.scan) {
      const items = s.items || [{ name: j.title, code: `UR-${j.id}`, n: parseInt(j.qty) || 1, scanned: false }]; s.items = items;
      const doneN = items.filter(i => i.scanned).length;
      body = `<div class="list" style="box-shadow:none;background:var(--surface-2);padding:0 12px">${items.map(i => `<div class="scan ${i.scanned ? "on" : ""}"><span class="bx">✓</span><div style="min-width:0"><b>${esc(i.name)}</b><div class="sm mono">${esc(i.code)} · ${i.n} adet</div></div>${i.scanned ? `<span class="pill ok">Okundu</span>` : `<button class="chip" data-scanone="${k}:${esc(i.code)}">Okut</button>`}</div>`).join("")}</div>
        <div class="scanrow"><input class="mono" id="scan-${j.id}" placeholder="Barkod / QR kodu" aria-label="Barkod kodu" autocomplete="off"><button class="btn dark" data-scan="${k}">▣ Okut</button></div>
        <div class="sm">Gerçek uygulamada kamera ile okutulur. Burada kodu yaz ya da satırdaki “Okut”a dokun.</div>
        ${D.mods.fleet ? `<select class="in" data-vehicle="${k}" aria-label="Yüklenecek araç"><option value="">Yüklenecek aracı seç</option>${PEOPLE.filter(p => p.role === "sofor").map(p => `<option value="${p.id}"${s.vehicle === p.id ? " selected" : ""}>${esc(p.vehicle)} · ${esc(first(p.id))}</option>`).join("")}</select>` : ""}
        <button class="btn ok xl block" data-done="${k}"${doneN < items.length || (D.mods.fleet && !s.vehicle) ? " disabled" : ""}>Araca yüklendi ✓ (${doneN}/${items.length})</button>`;
    } else if (s.status === "working") body = `<div class="timer" data-timer="${s.startedAt}">${clock(s.startedAt)}</div>${formHtml(j, s, k, true)}${tools}${(() => { const sp = s.mode === "split" && s.split && s.split[me] && Object.keys(s.split).length > 1 ? s.split[me] : null;
      if (sp && sp.done) return `<button class="btn ok xl block" disabled>Payın bitti · ${Object.entries(s.split).filter(([, v]) => !v.done).map(([id]) => esc(first(id))).join(", ")} bekleniyor</button>`;
      return `<button class="btn ok xl block" data-done="${k}"${gate(s).block ? " disabled" : ""}>${sp ? `Payımı bitirdim ✓ · ${sp.n} ${esc(unitOf(j))}` : "İşi tamamla ✓"}</button>`; })()}<div class="sm fhint" data-fhint="${k}">${gate(s).hint}</div>`;
    else body = `${formHtml(j, s, k, false)}<button class="btn xl block" data-start="${k}">${ico("play")} İşe başla</button>${tools}`;
    return `<article class="task ${s.status}">
      <div class="task-top"><span class="wo">İŞ EMRİ #${j.id}</span>${status}</div>${slaPill(j, s) ? `<div>${slaPill(j, s)}</div>` : ""}
      <div><h3>${esc(s.detail ? s.name.split(" ")[0] + ": " + j.title : `${s.name} · ${j.title}`)}</h3>${s.detail || typeof s.checklist === "string" ? `<p style="margin-top:6px">${esc(s.detail || s.checklist)}</p>` : ""}${Array.isArray(s.checklist) && s.checklist.length && !s.detail ? `<ul class="cl">${s.checklist.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}</div>
      ${facts}
      ${crewOf(s).length > 1 ? `<div class="crew">${s.mode === "split" ? "Bölüşüldü:" : "Birlikte:"} ${crewOf(s).map(id => `<span>${avatar(id, 22)} ${id === me ? "Sen" : esc(first(id))}${s.split?.[id] ? ` · ${s.split[id].n} ${esc(unitOf(j))}${s.split[id].done ? ` <span class="dn">✓</span>` : ""}` : ""}</span>`).join("")}</div>` : ""}
      ${s.final ? `<div class="note info"><b>Tamamlanma onayı</b><span>Bütün aşamalar bitti. Ürün ya da hizmet eksiksizse onayla; eksik varsa istediğin aşamaya geri gönder.</span></div>` : ""}
      ${s.file ? `<button class="file" data-file="${esc(s.file)}">${ico("file")}${esc(s.file)}<span class="sm" style="margin-left:auto">Aç</span></button>` : ""}
      ${s.notes.filter(n => n.text.startsWith("Geri gönderildi") || n.text.startsWith("Stok")).map(n => `<div class="note"><b>Not</b><span>${esc(n.text)}</span></div>`).join("")}
      ${body}${attach}
    </article>`;
  }
  function stockHtml() {
    return `<section><h2>Stok</h2><div class="list">${D.stock.map(s => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(s.name)}</b><div class="sm">Minimum ${s.min} ${esc(s.unit)}</div></div>
      <span class="pill ${s.qty === 0 ? "bad" : s.qty < s.min ? "warn" : "ok"}">${s.qty} ${esc(s.unit)}</span></div>`).join("")}</div></section>`;
  }
  const parseK = k => { const [id, key] = k.split(":"); const j = jobById(+id); return { j, s: j.steps.find(x => x.key === key) }; };
  function afterComplete(j, s, r) {
    save(); render();
    if (r.finished) toast("🏁", `#${j.id} tamamlandı`, "Patrona teslimat, süre ve maliyet raporu gitti");
    else if (r.waitingParallel) toast("✅", "Görev tamamlandı", `Paralel aşama bekleniyor: ${r.waitingParallel.map(x => x.name).join(", ")}`);
    else toast("➡️", "Görev tamamlandı", `Sıradaki: ${r.next.map(x => `${x.name} (${first(x.owner)})`).join(" ∥ ")} · bildirim gönderildi`);
  }
  function openIssue(k) {
    const { j, s } = parseK(k);
    const types = ["Malzeme eksik", "Makine arızası", "Çizim / ölçü hatalı", "İş güvenliği", "Diğer"];
    let pick = types[0];
    sheet(`<div class="stack"><div><div class="eyebrow">#${j.id} · ${esc(s.name)}</div><h2>Sorun bildir</h2><div class="sm">Ustabaşı ve patron anında haberdar olur.</div></div>
      <div class="chips">${types.map((t, i) => `<button class="chip" data-type="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join("")}</div>
      <textarea id="issNote" rows="3" placeholder="Kısaca ne oldu? (ör: 40×40 profil bitti)"></textarea>
      <button class="btn bad xl block" id="issGo" style="background:var(--bad);color:#fff">Sorunu bildir</button>
      <button class="btn ghost block" id="closeS">Vazgeç</button></div>`, () => {
      layer.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { pick = b.dataset.type; layer.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", x === b)); });

      $("#issGo").onclick = () => {

  }
  function openBack(k) {

  // ----- driver -----

  function driverCard(j, s) {
    const k = `${j.id}:${s.key}`, addr = j.address || `${j.customer} adresi`;
    const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
    const route = `<div class="map"><svg viewBox="0 0 360 120" role="img" aria-label="Rota önizlemesi"><rect width="360" height="120" fill="var(--surface-2)"/>

  function initSig(c) {
    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = "round"; x.strokeStyle = getComputedStyle(document.body).color;
    let down = false; c.dataset.inked = "";
    const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); };
    c.onpointermove = e => { if (!down) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); c.dataset.inked = "1"; };
    c.onpointerup = c.onpointercancel = () => { down = false; };
    const cl = $("#sigClear"); if (cl) cl.onclick = () => { x.clearRect(0, 0, c.width, c.height); c.dataset.inked = ""; };
  }

      c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", .7)); }; img.src = r.result; };
    r.readAsDataURL(file);
  }

  });

  if (firstRun) startOb(false); else render();
  setInterval(() => { if (!OB && !drag && !layer.innerHTML && !document.querySelector(".sig") && !document.activeElement?.dataset?.fin) render(); }, 60000);
})();
</script>
