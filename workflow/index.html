<title>Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-width operations app; a slim prototype band on top picks whose eyes you see through; each role gets its own screen; sheets slide up for details */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #12161d;
  --ink-2: #5a6473;
  --line: #dce1e8;
  --accent: #e8611a;
  --accent-soft: #fde6d8;
  --ok: #12845a;
  --ok-soft: #dbf1e6;
  --warn: #a86a0c;
  --warn-soft: #fbefd6;
  --bad: #cc3329;
  --bad-soft: #fbe1de;
  --info: #2a64c9;
  --info-soft: #e0eafb;
  --band: #12161d;
  --band-ink: #e9edf2;
  --shadow: 0 1px 2px #12161d12, 0 6px 18px #12161d0c;
  --display: "Archivo", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e13; --surface: #141920; --surface-2: #1a2029; --ink: #e8ecf1; --ink-2: #97a1b0; --line: #27303c;
    --accent: #ff7b30; --accent-soft: #3b2213; --ok: #3cc58c; --ok-soft: #10301f; --warn: #e9b14f; --warn-soft: #33270e;
    --bad: #ff6e62; --bad-soft: #3b1815; --info: #6ea3ff; --info-soft: #14243f; --band: #000000; --band-ink: #e8ecf1;
    --shadow: 0 1px 2px #0007, 0 6px 18px #0005; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e13; --surface: #141920; --surface-2: #1a2029; --ink: #e8ecf1; --ink-2: #97a1b0; --line: #27303c;
  --accent: #ff7b30; --accent-soft: #3b2213; --ok: #3cc58c; --ok-soft: #10301f; --warn: #e9b14f; --warn-soft: #33270e;
  --bad: #ff6e62; --bad-soft: #3b1815; --info: #6ea3ff; --info-soft: #14243f; --band: #000000; --band-ink: #e8ecf1;
  --shadow: 0 1px 2px #0007, 0 6px 18px #0005; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.42; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sm { font-size: .82rem; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* prototype band */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; }
.band-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-block: 8px; font-size: .78rem; }
.band-in span { opacity: .65; white-space: nowrap; }
.band select { flex: 1; min-width: 0; background: #ffffff14; border: 1px solid #ffffff2a; color: var(--band-ink); border-radius: 8px; padding: 6px 8px; font-size: .85rem; font-weight: 600; }
.band select option { color: #12161d; background: #fff; }
.band button { color: var(--band-ink); opacity: .7; font-size: .78rem; text-decoration: underline; }

.app { max-width: 520px; margin: 0 auto; min-height: calc(100% - 44px); display: flex; flex-direction: column; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { padding-block: 16px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.75rem; letter-spacing: -.02em; margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
.bell { position: relative; width: 44px; height: 44px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.15rem; flex: none; }
.bell b { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font-size: .7rem; display: grid; place-items: center; padding: 0 5px; }
main { display: flex; flex-direction: column; gap: 18px; padding-block: 10px 24px; }
section { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.link { color: var(--accent); font-weight: 600; font-size: .85rem; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); text-align: left; }
.kpi .v { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .8rem; color: var(--ink-2); margin-top: 6px; font-weight: 600; }
.kpi.bad .v { color: var(--bad); }
.kpi.ok .v { color: var(--ok); }

/* AI card */
.ai { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--accent-soft); display: grid; gap: 8px; }
.ai-h { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.spark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: .9rem; flex: none; }
.ai ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: .9rem; }
.ai li b { font-weight: 700; }

/* job rows */
.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.jr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.jr:last-child { border-bottom: 0; }
.jr .t { font-weight: 700; overflow-wrap: anywhere; }
.jr .pct { font-family: var(--display); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; align-self: start; }
.jr .st { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; color: var(--ink-2); }
.prog { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.prog.ok i { background: var(--ok); }
.prog.bad i { background: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--surface-2); color: var(--ink-2); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

/* feed */
.feed { display: grid; gap: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 14px; }
.fi { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: .87rem; align-items: start; }
.fi:last-child { border-bottom: 0; }
.fi .ic { font-size: 1rem; line-height: 1.3; }
.fi time { font-size: .74rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* buttons */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-weight: 700; background: var(--accent); color: #fff; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.line { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad-soft); color: var(--bad); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.block { width: 100%; }
.btn.xl { padding-block: 18px; font-size: 1.1rem; border-radius: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border-radius: 14px; background: var(--surface-2); font-weight: 600; font-size: .84rem; text-align: center; position: relative; }
.tool .i { font-size: 1.35rem; line-height: 1; }
.tool input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* worker task card */
.task { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; border: 2px solid transparent; }
.task.working { border-color: var(--accent); }
.task.blocked { border-color: var(--bad); }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wo { font-family: var(--mono); font-size: .76rem; letter-spacing: .08em; color: var(--ink-2); font-weight: 700; }
.task h3 { font-family: var(--display); font-size: 1.35rem; line-height: 1.15; margin: 0; font-weight: 800; text-wrap: balance; }
.task p { margin: 0; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 16px; font-weight: 600; font-size: .9rem; }
.file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--info-soft); color: var(--info); font-weight: 700; text-align: left; width: 100%; }
.timer { font-family: var(--mono); font-size: 1.8rem; font-weight: 700; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; }
.attach { display: flex; gap: 8px; flex-wrap: wrap; }
.attach img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
.vn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); font-size: .8rem; font-weight: 600; }
.issue { background: var(--bad-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.issue b { color: var(--bad); }
.scan { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.scan:last-child { border-bottom: 0; }
.scan .bx { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: transparent; }
.scan.on .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.scanrow { display: flex; gap: 8px; }
.scanrow input { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-family: var(--mono); }
.sig { width: 100%; height: 150px; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--surface-2); touch-action: none; display: block; }
.map { border-radius: 14px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.map svg { display: block; width: 100%; height: auto; }

/* team */
.pr { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.pr:last-child { border-bottom: 0; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: #fff; flex: none; }
.load { height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.load i { display: block; height: 100%; background: var(--accent); }

/* reports */
.bars { display: grid; gap: 10px; background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.bar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .84rem; }
.bar .tr { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.bar .tr i.hi { background: var(--bad); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: .84rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 700; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* settings */
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.sw { width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px #0003; }
.sw[aria-checked="true"] { background: var(--ok); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.flowline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: .8rem; color: var(--ink-2); margin-top: 3px; }
.flowline span.s { background: var(--surface-2); border-radius: 6px; padding: 1px 6px; color: var(--ink); font-weight: 600; }

/* tabs */
nav.tabs { position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { padding-block: 9px 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 600; color: var(--ink-2); }
.tab .i { font-size: 1.15rem; line-height: 1; }
.tab[aria-selected="true"] { color: var(--accent); }
.fab { position: fixed; z-index: 6; right: max(16px, calc(50% - 244px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 16px; background: var(--ink); color: var(--surface); font-weight: 700; box-shadow: 0 10px 26px #0004; }
.fab .spark { width: 24px; height: 24px; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: #05080c99; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding-top: 10px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease-out; }
.sheet.still { animation: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
textarea, .in { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .8rem; font-weight: 600; text-align: left; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* job detail graph */
.graph { display: flex; flex-direction: column; }
.gstep { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 12px; }
.gstep::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.gstep:last-child::before { display: none; }
.gstep.done::before { background: var(--ok); }
.dotn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--surface-2); border: 2px solid var(--line); color: var(--ink-2); position: relative; }
.gstep.done .dotn { background: var(--ok); border-color: var(--ok); color: #fff; }
.gstep.cur .dotn { border-color: var(--accent); color: var(--accent); background: var(--surface); }
.gstep.blk .dotn { border-color: var(--bad); color: var(--bad); background: var(--surface); }
.par { display: grid; gap: 6px; }
.pcard { background: var(--surface-2); border-radius: 12px; padding: 9px 11px; display: grid; gap: 3px; }
.pcard .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 700; }
.ptag { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--info); }

/* plan */
.plan { border: 1.5px solid var(--accent); border-radius: 16px; padding: 14px; display: grid; gap: 12px; background: var(--surface); }
.plan-h { display: grid; gap: 4px; }
.pl { display: grid; grid-template-columns: 26px minmax(0, 1fr) 132px; gap: 10px; align-items: center; padding-block: 6px; border-bottom: 1px solid var(--line); }
.pl:last-child { border-bottom: 0; }
.pl .n { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: .78rem; display: grid; place-items: center; }
.pl select { width: 100%; min-width: 0; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: .82rem; }
.note { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; font-size: .86rem; display: grid; gap: 4px; }
.note.info { background: var(--info-soft); }
.thinking { display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-weight: 600; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }

/* customer */
.track { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.tsteps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.ts { display: grid; gap: 6px; text-align: center; font-size: .7rem; font-weight: 600; color: var(--ink-2); }
.ts i { height: 6px; border-radius: 3px; background: var(--surface-2); }
.ts.on i { background: var(--ok); }
.ts.cur i { background: var(--accent); }
.ts.cur { color: var(--ink); }
.eta { font-family: var(--display); font-weight: 800; font-size: 1.6rem; }

.ed-name { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; }
.ed-name select { padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 1.1rem; }
.ed-list { display: flex; flex-direction: column; gap: 10px; }
.ed-row { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; border-left: 4px solid transparent; }
.ed-row.par { border-left-color: var(--info); margin-left: 14px; }
.ed-top { display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px 36px 36px; gap: 6px; align-items: center; }
.ed-top input, .ed-two input, .ed-two select { width: 100%; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.ed-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.ed-b { height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; }
.ed-b.del { color: var(--bad); }
.ed-b:disabled { opacity: .35; }
.ed-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ed-two label { display: grid; gap: 3px; font-weight: 600; }
.ed-checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; font-weight: 600; }
.ed-checks label { display: flex; gap: 6px; align-items: center; }
.ed-checks input { width: 18px; height: 18px; accent-color: var(--accent); }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 360px) { .tgrid { grid-template-columns: 1fr; } }

    else if (/kalite|kontrol/.test(l)) { st.skill = "kalite"; st.type = "approval"; st.sla = 4; }
    else if (/paket/.test(l)) { st.skill = "depo"; st.type = "pack"; st.sla = 4; }
    else if (/teslim/.test(l)) { st.skill = D.mods.fleet ? "sofor" : "depo"; st.type = D.mods.fleet ? "delivery" : "task"; }
    else if (/ödeme/.test(l)) st.skill = "patron";
    return st;
  }
  function fromTemplate(t) {
    return { id: null, ico: t.ico, name: `${t.name} akışı`, from: t.name, prefs: { ...DEFAULT_PREFS, ...(t.prefs || {}) },
      stages: t.stages.map(x => ({ key: newKey(), name: x.name, skill: deptKey(x.dept), type: x.type === "delivery" && !D.mods.fleet ? "task" : x.type, par: x.par, sla: x.sla, photo: x.photo, pub: x.pub, checklist: [...x.checklist] })) };
  }
  function openFlowEditor(src, still) {
    if (!still) {
      edSrc = src;
      if (src.id) draft = JSON.parse(JSON.stringify(flowById(src.id)));
      else if (src.copy) { draft = JSON.parse(JSON.stringify(flowById(src.copy))); draft.id = null; draft.name += " kopyası"; draft.stages.forEach(x => x.key = newKey()); }
      else if (src.tpl) draft = fromTemplate(TEMPLATES.find(t => t.id === src.tpl));
      else draft = { id: null, ico: "⭐", name: "", prefs: { ...DEFAULT_PREFS }, stages: [] };
      draft.stages.forEach(x => { if (typeof x.checklist === "string") x.checklist = x.checklist ? [x.checklist] : []; });
    }
    const ownerOpts = st => Object.entries(D.depts).filter(([k]) => k !== "sofor" || D.mods.fleet).map(([k, v]) => `<option value="d:${k}"${!st.fixed && st.skill === k ? " selected" : ""}>${esc(v)} (${deptPeople(k).length} kişi)</option>`).join("")
      + `<option value="new">＋ Yeni departman…</option><optgroup label="Sabit kişi">${PEOPLE.map(p => `<option value="p:${p.id}"${st.fixed === p.id ? " selected" : ""}>👤 ${esc(p.name)}</option>`).join("")}</optgroup>`;
    const unit = h => h != null && h < 1 ? "dk" : h != null && h >= 48 ? "gün" : "sa";
    const uval = h => h == null ? "" : unit(h) === "dk" ? Math.round(h * 60) : unit(h) === "gün" ? +(h / 24).toFixed(1) : +h.toFixed(1);
    const rows = draft.stages.map((st, i) => {
      const empty = !st.fixed && !deptPeople(st.skill).length;
      return `<div class="ed-row${st.par && i ? " par" : ""}">

        <button class="ed-b" data-mv="${i}:-1" aria-label="Yukarı"${i === 0 ? " disabled" : ""}>↑</button><button class="ed-b" data-mv="${i}:1" aria-label="Aşağı"${i === draft.stages.length - 1 ? " disabled" : ""}>↓</button>

        <label class="sm">Aşama tipi<select data-i="${i}" data-f="type">${Object.entries(TYPES).filter(([k]) => k !== "delivery" || D.mods.fleet).map(([k, v]) => `<option value="${k}"${st.type === k ? " selected" : ""}>${TYPE_ICON[k]} ${v}</option>`).join("")}</select></label></div>
      <div class="newdept" data-nd="${i}" hidden><input class="in" placeholder="Departman adı (ör: Döşeme)" aria-label="Yeni departman adı"><button class="btn dark" data-ndok="${i}">Ekle</button></div>
      ${empty ? `<div class="sm" style="color:var(--warn)">Bu departmanda çalışan yok; çalışan ekleyene kadar iş ustabaşına düşer.</div>` : ""}
      <div class="ed-two"><label class="sm">Hedef süre<span class="slarow"><input data-i="${i}" data-f="slav" type="number" min="1" value="${uval(st.sla)}" inputmode="decimal"><select data-i="${i}" data-f="slau">${["dk", "sa", "gün"].map(u => `<option${unit(st.sla) === u ? " selected" : ""}>${u}</option>`).join("")}</select></span></label>

      <label class="sm" style="display:grid;gap:3px;font-weight:600">Kontrol listesi · her satıra bir madde<textarea data-i="${i}" data-f="checklist" rows="${Math.max(2, st.checklist.length)}" placeholder="Ör: Ölçüler kontrol edildi">${esc(st.checklist.join("\n"))}</textarea></label>
      <div class="ed-checks">${i ? `<label><input type="checkbox" data-i="${i}" data-f="par"${st.par ? " checked" : ""}> Öncekiyle aynı anda yürüsün</label>` : ""}

    </div>`; }).join("");

      <div class="ed-name"><select id="edIco" aria-label="Simge">${FICONS.map(x => `<option${x === draft.ico ? " selected" : ""}>${x}</option>`).join("")}</select><input class="in" id="edName" value="${esc(draft.name)}" placeholder="Akışın adı (ör: Kapı üretimi)" aria-label="Akışın adı"></div>
      ${draft.stages.length ? `<section><h2>Önizleme</h2><div class="preview" aria-live="polite">${stageGraph(draft.stages.filter(x => x.name.trim()), x => x.fixed ? person(x.fixed).name : deptName(x.skill))}</div></section>` : ""}
      <section><h2>Aşamalar</h2>
        ${draft.stages.length ? `<div class="ed-list">${rows}</div>` : `<div class="empty" style="background:var(--surface-2)">Henüz aşama yok. Aşağıdan hazır bir aşamaya dokun ya da boş aşama ekle.</div>`}
        <div class="chips">${QUICK.map(q => `<button class="chip" data-quick="${esc(q)}">＋ ${esc(q)}</button>`).join("")}</div>
        <button class="btn ghost block" id="edAdd">＋ Boş aşama ekle</button></section>
      <section><h2>Akış tercihleri</h2><div class="list">${PREF_TEXT.filter(([k]) => (k !== "signReq" || D.mods.fleet) && (!k.startsWith("cust") || D.mods.customers)).map(([k, n, dsc]) => `<div class="set"><div><b>${n}</b><div class="sm">${dsc}</div></div><button class="sw" role="switch" aria-checked="${!!draft.prefs[k]}" data-dpref="${k}" aria-label="${n}"></button></div>`).join("")}</div></section>
      <div class="sm" id="edMsg" style="color:var(--bad)"></div>
      <div class="grid2"><button class="btn ghost" id="edCancel">Vazgeç</button><button class="btn ok" id="edSave">${draft.id ? "Kaydet" : "Akışı oluştur"}</button></div>
    </div>`, () => {
      const redraw = () => openFlowEditor(edSrc, true);
      const refresh = () => { const pv = layer.querySelector(".preview"); if (pv) pv.innerHTML = stageGraph(draft.stages.filter(x => x.name.trim()), x => x.fixed ? person(x.fixed).name : deptName(x.skill)); };
      layer.querySelectorAll("[data-f]").forEach(el => el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {
        const i = +el.dataset.i, st = draft.stages[i], f = el.dataset.f;
        if (f === "owner") {
          if (el.value === "new") { layer.querySelector(`[data-nd="${i}"]`).hidden = false; layer.querySelector(`[data-nd="${i}"] input`).focus(); return; }
          const [kind, v] = el.value.split(":"); if (kind === "p") { st.fixed = v; st.skill = (person(v).skills || ["yonetim"])[0]; } else { delete st.fixed; st.skill = v; } redraw();
        } else if (f === "par" || f === "photo") { st[f] = el.checked; redraw(); }
        else if (f === "slav" || f === "slau") { const v = +layer.querySelector(`[data-i="${i}"][data-f="slav"]`).value, u = layer.querySelector(`[data-i="${i}"][data-f="slau"]`).value;
          st.sla = v > 0 ? (u === "dk" ? v / 60 : u === "gün" ? v * 24 : v) : null; refresh(); }
        else if (f === "checklist") { st.checklist = el.value.split("\n").map(x => x.trim()).filter(Boolean); refresh(); }
        else if (f === "type") { st.type = el.value; redraw(); }
        else { st[f] = el.value; refresh(); }

        const st = draft.stages[i]; delete st.fixed; st.skill = deptKey(v); save(); redraw(); toast("🏷", `${v} departmanı eklendi`, "Ekip sekmesinden çalışan atayabilirsin"); });

      layer.querySelectorAll("[data-dpref]").forEach(b => b.onclick = () => { const k = b.dataset.dpref; draft.prefs[k] = !draft.prefs[k]; b.setAttribute("aria-checked", draft.prefs[k]); });
      layer.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [i, d] = b.dataset.mv.split(":").map(Number), a = draft.stages; [a[i], a[i + d]] = [a[i + d], a[i]]; a[0].par = false; redraw(); });
      layer.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { draft.stages.splice(+b.dataset.del, 1); if (draft.stages[0]) draft.stages[0].par = false; redraw(); });
      layer.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => { draft.stages.push(quickStage(b.dataset.quick)); redraw(); });
      $("#edAdd").onclick = () => { draft.stages.push({ key: newKey(), name: "", skill: "yonetim", type: "task", pub: "", checklist: [], sla: 8, photo: false, par: false }); redraw();
        const ins = layer.querySelectorAll('[data-f="name"]'); ins[ins.length - 1].focus(); };
      $("#edCancel").onclick = closeSheet;
      $("#edSave").onclick = () => {
        draft.name = draft.name.trim();
        if (!draft.name) { $("#edMsg").textContent = "Akışa bir ad ver."; $("#edName").focus(); return; }
        if (!draft.stages.length) { $("#edMsg").textContent = "En az bir aşama ekle."; return; }

        let g = -1; draft.stages.forEach((x, i) => { x.name = x.name.trim(); x.pub = (x.pub || "").trim() || x.name; if (!i) x.par = false; g += x.par ? 0 : 1; x.g = g; });
        if (draft.id) D.flows[D.flows.findIndex(f => f.id === draft.id)] = draft; else { draft.id = "f" + Date.now().toString(36); D.flows.push(draft); }
        save(); closeSheet(); tab = "ayar"; render();
        toast(draft.ico, `${draft.name} hazır`, `${draft.stages.length} aşama · yeni iş açarken seçebilirsin`);
      };
    }, still);

  // ----- job detail (boss / foreman) -----
  function openJob(id, still) {
    const j = jobById(id); if (!j) return;
    const groups = [...new Set(j.steps.map(s => s.g))];
    const canManage = ["patron", "ustabasi"].includes(person(me).role);
    const graph = groups.map((g, gi) => {
      const gs = j.steps.filter(s => s.g === g), all = gs.every(s => s.status === "done"), blk = gs.some(s => s.status === "blocked"), act = gs.some(s => !["done", "locked"].includes(s.status));
      return `<div class="gstep ${all ? "done" : blk ? "blk" : act ? "cur" : ""}"><span class="dotn">${all ? "✓" : gi + 1}</span><div class="par">
        ${gs.length > 1 ? `<span class="ptag">∥ Paralel · ${gs.length} departman aynı anda</span>` : ""}
        ${gs.map(s => `<div class="pcard"><div class="h"><span>${esc(s.name)}</span>${stepPill(s)}</div>${slaPill(j, s)}
          <div class="sm" style="display:flex;align-items:center;gap:6px">${avatar(s.owner, 20)} ${esc(person(s.owner).name)}${s.doneAt && s.status === "done" ? ` · ${esc(when(s.doneAt))}` : s.status !== "locked" && s.readyAt ? ` · ${ago(s.readyAt)}dır bu aşamada` : ""}</div>
          ${s.issue && s.status === "blocked" ? `<div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}</div>` : ""}
          ${s.photos.length || s.notes.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="İş fotoğrafı">`).join("")}${s.notes.map(n => `<span class="vn">${n.kind === "voice" ? "🎙 " + n.text : "📝 " + esc(n.text)}</span>`).join("")}</div>` : ""}
          ${s.signature ? `<div class="attach"><img src="${s.signature}" alt="Müşteri imzası" style="width:120px;background:#fff"></div>` : ""}
          ${canManage && !["done", "locked"].includes(s.status) ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
            <button class="chip" data-reassign="${j.id}:${s.key}">Başkasına ata</button>
            ${s.status === "blocked" ? `<button class="chip" data-resolve="${j.id}:${s.key}">Sorun çözüldü</button>` : ""}
            ${s.type === "approval" && s.status === "ready" ? `<button class="chip" data-approve="${j.id}:${s.key}">Onayla</button>` : ""}</div>` : ""}
        </div>`).join("")}</div></div>`;
    }).join("");
    sheet(`<div class="stack">
      <div><div class="eyebrow">İş emri #${j.id} · ${esc(flowOf(j).ico)} ${esc(flowOf(j).name)}</div><h2 style="font-size:1.45rem">${esc(j.title)}</h2>
        <div class="sm">${esc(j.customer)} · ${esc(j.qty)} · Termin ${esc(when(j.due))}</div>
        <div class="chips" style="margin-top:8px"><span class="pill ${jobState(j).cls}">${esc(jobState(j).label)}</span>${isLate(j) ? `<span class="pill bad">Gecikme mevcut</span>` : ""}<span class="pill mute">%${pct(j)}</span></div></div>
      ${D.mods.finance && canManage ? `<div class="grid3"><div class="kpi"><div class="l">Tutar</div><div class="num" style="font-weight:700">${tl(j.price)}</div></div><div class="kpi"><div class="l">Tahmini maliyet</div><div class="num" style="font-weight:700">${tl(j.cost)}</div></div><div class="kpi"><div class="l">Kâr</div><div class="num" style="font-weight:700;color:var(--ok)">${tl(j.price - j.cost)}</div></div></div>` : ""}
      <div class="graph">${graph}</div>
      ${j.done ? `<div class="note info"><b>🏁 İş tamamlandı · rapor</b><span>Toplam süre ${((j.doneAt - j.createdAt) / DAY).toFixed(1).replace(".", ",")} gün · ${j.doneAt <= j.due + DAY ? "zamanında teslim" : "gecikmeli teslim"}${D.mods.finance ? ` · kâr ${tl(j.price - j.cost)}` : ""}</span></div>` : ""}

  function stepPill(s) {
    return s.status === "done" ? `<span class="pill ok">Bitti</span>` : s.status === "working" ? `<span class="pill acc">${s.type === "delivery" ? "Yolda" : "Çalışıyor"}</span>`
      : s.status === "blocked" ? `<span class="pill bad">Sorun</span>` : s.status === "ready" ? `<span class="pill warn">${s.type === "approval" ? "Onay bekliyor" : "Sırada"}</span>` : `<span class="pill mute">Bekliyor</span>`;
  }
  function openReassign(jid, key) {

  // ----- new work order (manual) -----
  const deptName = k => D.depts[k] || k;
  const deptPeople = k => PEOPLE.filter(p => (p.skills || []).includes(k));
  function deptKey(name) {
    const hit = Object.entries(D.depts).find(([, v]) => lower(v) === lower(name)); if (hit) return hit[0];
    let k = lower(name).replace(/[^a-z0-9çğıöşü]+/g, "-").replace(/^-|-$/g, "") || "dept"; while (D.depts[k]) k += "2";
    D.depts[k] = name; return k;
  }
  function leastLoaded(skill) {
    const c = PEOPLE.filter(p => (p.skills || []).includes(skill)).sort((a, b) => (loadOf(a.id) + queuedOf(a.id) * .3) - (loadOf(b.id) + queuedOf(b.id) * .3));
    return c[0]?.id || (PEOPLE.find(p => p.role === "ustabasi") || PEOPLE[0]).id;
  }

      ${D.mods.fleet ? `<div><label class="sm" for="nAddr"><b>Teslimat adresi</b></label><input class="in" id="nAddr" placeholder="Mahalle, cadde, ilçe" autocomplete="off"></div>` : ""}
      <label class="ck" style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="nUrgent" style="width:20px;height:20px;accent-color:var(--accent)"> Acil iş</label>
      <div class="plan"><div class="plan-h"><b>Aşamalar ve sorumlular</b><div class="sm">Otomatik aşamalarda en az yüklü kişi seçili geldi, istersen değiştir.</div></div>
        <div id="nStages"></div>

    </div>`, () => {

        $("#nStages").innerHTML = f.stages.map(s => `<div class="pl"><span class="n">${s.g + 1}</span><div style="min-width:0"><b style="font-size:.9rem">${esc(s.name)}</b>${f.stages.filter(x => x.g === s.g).length > 1 ? ` <span class="ptag">∥ paralel</span>` : ""}${s.type === "approval" ? ` <span class="ptag" style="color:var(--warn)">onay</span>` : ""}${s.photo ? ` <span class="ptag" style="color:var(--ink-2)">📷</span>` : ""}</div>
          <select data-owner="${s.key}" aria-label="${esc(s.name)} sorumlusu">${PEOPLE.filter(p => ((p.skills || []).includes(s.skill) || p.role === "ustabasi" || p.id === s.fixed)).map(p => `<option value="${p.id}"${p.id === (s.fixed || leastLoaded(s.skill)) ? " selected" : ""}>${esc(first(p.id))} · ${loadOf(p.id)} açık</option>`).join("")}</select></div>`).join(""); };
      drawStages(); $("#nFlow").onchange = () => { drawStages(); warn(); };
      const warn = () => {
        const out = [], dvv = $("#nDue").value;
        if (dvv) { const [y, m, d] = dvv.split("-").map(Number), due = new Date(y, m - 1, d, 17).getTime(), left = (due - Date.now()) / DAY, fl = flowById($("#nFlow").value), need = fl.stages.reduce((a, x) => a + (x.sla || 8), 0) / 24 * .8, ng = new Set(fl.stages.map(x => x.g)).size;
          if (left < need) out.push(`Termin sıkı: ${ng} aşamanın hedef süreleri toplamı yaklaşık ${Math.ceil(need)} gün, ${Math.max(0, left).toFixed(1).replace(".", ",")} gün var.`); }
        const n = parseInt($("#nQty").value) || 0, k = D.stock.find(s => s.name === "Kilit takımı");
        if (D.mods.stock && /kapı/.test(lower($("#nTitle").value)) && k && n > k.qty) out.push(`Stok: ${n} kilit takımı gerekiyor, depoda ${k.qty} var.`);
        $("#nWarn").innerHTML = out.length ? `<div class="note"><b>Dikkat</b>${out.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : "";
        return out;
      };
      ["nDue", "nQty", "nTitle"].forEach(id => $("#" + id).addEventListener("input", warn)); warn();
      $("#nGo").onclick = () => {
        const title = $("#nTitle").value.trim(), customer = $("#nCust").value.trim(), dvv = $("#nDue").value;
        if (!title || !customer || !dvv) { $("#nMsg").textContent = "Ürün / iş, müşteri ve termin gerekli."; (!title ? $("#nTitle") : !customer ? $("#nCust") : $("#nDue")).focus(); return; }
        const owners = {}; layer.querySelectorAll("[data-owner]").forEach(x => owners[x.dataset.owner] = x.value);
        const [y, m, d] = dvv.split("-").map(Number);
        const price = D.mods.finance ? +($("#nPrice").value || "0").replace(/\D/g, "") : 0;
        const j = mkJob({ flowId: $("#nFlow").value, id: D.nextId++, title, customer, qty: $("#nQty").value.trim() || "1 adet", due: new Date(y, m - 1, d, 17).getTime(), at: 0, waiting: 0,
          price, cost: Math.round(price * .65), createdAt: Date.now(), owners, urgent: $("#nUrgent").checked, address: D.mods.fleet ? $("#nAddr").value.trim() : "" });
        if (!D.mods.fleet) { j.steps = j.steps.filter(s => s.type !== "delivery"); }
        const mz = j.steps.find(s => s.key === "malzeme") || j.steps[0];
        warn().filter(x => x.startsWith("Stok")).forEach(x => mz.notes.push({ kind: "text", text: x, by: "selim", at: Date.now() }));
        j.steps.filter(s => s.status === "ready").forEach(s => s.readyAt = Date.now());
        D.jobs.push(j);
        const g0 = j.steps.filter(s => s.g === 0);
        notify(`Selim yeni iş açtı: #${j.id} ${title} (${customer}) · ${g0.map(s => first(s.owner)).join(" ve ")} bilgilendirildi`, "🆕", g0.map(s => s.owner));
        save(); closeSheet(); tab = "panel"; render(); window.scrollTo(0, 0);
        toast("🆕", `#${j.id} iş emri dağıtıldı`, `${j.steps.length} aşama · ilk aşama: ${g0.map(s => first(s.owner)).join(" ∥ ")}`);
      };
    });
  }

  // ----- worker (production, QC, warehouse) -----
  let tick = null;
  function myTasks(id) {
    return D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => s.owner === id && ["ready", "working", "blocked"].includes(s.status)).map(s => ({ j, s })))
      .sort((a, b) => (b.s.status === "working") - (a.s.status === "working") || (a.s.deadline || a.j.due) - (b.s.deadline || b.j.due));
  }
  function renderWorker() {
    setNav(null, false);

    $("#app").innerHTML = head(`Çalışan paneli · ${esc(p.title)}`, "Görevlerim", bellCount(me)) + `<main class="gut">
      <p style="margin:0;font-size:1.05rem;font-weight:600">${tasks.length ? `Bugün ${tasks.length} görevin var.` : "Şu an bekleyen görevin yok."}</p>
      ${tasks.map(({ j, s }) => taskCard(j, s)).join("")}
      ${queued.length ? `<section><h2>Sırada gelecek</h2><div class="list">${queued.map(({ j, s }) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="mono sm">#${j.id}</span> <b>${esc(j.title)}</b><div class="sm">${esc(s.name)} · önceki aşama bitince bildirim gelir</div></div><span class="pill mute">Bekliyor</span></div>`).join("")}</div></section>` : ""}
      ${p.role === "depo" && D.mods.stock ? stockHtml() : ""}

    clearInterval(tick);
    if (tasks.some(x => x.s.status === "working")) tick = setInterval(() => document.querySelectorAll("[data-timer]").forEach(el => el.textContent = clock(+el.dataset.timer)), 1000);
  }
  const clock = t => { const s = Math.max(0, Math.floor((Date.now() - t) / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  function taskCard(j, s) {
    const k = `${j.id}:${s.key}`;
    const status = s.status === "working" ? `<span class="pill acc">Çalışıyor</span>` : s.status === "blocked" ? `<span class="pill bad">Sorun bildirildi</span>` : `<span class="pill warn">${s.type === "approval" ? "Onayını bekliyor" : "Bekliyor"}</span>`;
    const facts = `<div class="facts">${s.place ? `<span>📍 ${esc(s.place)}</span>` : ""}<span>⏰ Teslim: ${esc(s.deadline ? when(s.deadline) : dayLabel(j.due))}</span><span>📦 ${esc(j.qty)}</span></div>`;
    const attach = s.photos.length || s.notes.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="Eklenen fotoğraf">`).join("")}${s.notes.map(n => `<span class="vn">${n.kind === "voice" ? "🎙 " + esc(n.text) : "📝 " + esc(n.text)}</span>`).join("")}</div>` : "";
    const tools = `<div class="grid3">
        <label class="tool"><span class="i">📷</span>Fotoğraf ekle<input type="file" accept="image/*" data-photo="${k}"></label>
        <button class="tool" data-voice="${k}"><span class="i">🎙</span>Sesli not</button>
        <button class="tool" data-issue="${k}"><span class="i">⚠️</span>Sorun bildir</button></div>`;
    let body = "";
    if (s.status === "blocked") body = `<div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}<div class="sm">Ustabaşı ve patron bilgilendirildi. Çözülünce bildirim gelecek.</div></div>`;
    else if (s.type === "approval") body = `${tools}<div class="${flowOf(j).prefs.sendBack ? "grid2" : ""}"><button class="btn ok xl${flowOf(j).prefs.sendBack ? "" : " block"}" data-approve="${k}">Onayla ✓</button>${flowOf(j).prefs.sendBack ? `<button class="btn bad xl" data-back="${k}">Geri gönder</button>` : ""}</div>`;
    else if (s.type === "pack") {
      const items = s.items || [{ name: j.title, code: `UR-${j.id}`, n: parseInt(j.qty) || 1, scanned: false }]; s.items = items;
      const doneN = items.filter(i => i.scanned).length;
      body = `<div class="list" style="box-shadow:none;background:var(--surface-2);padding:0 12px">${items.map(i => `<div class="scan ${i.scanned ? "on" : ""}"><span class="bx">✓</span><div style="min-width:0"><b>${esc(i.name)}</b><div class="sm mono">${esc(i.code)} · ${i.n} adet</div></div>${i.scanned ? `<span class="pill ok">Okundu</span>` : `<button class="chip" data-scanone="${k}:${esc(i.code)}">Okut</button>`}</div>`).join("")}</div>
        <div class="scanrow"><input class="mono" id="scan-${j.id}" placeholder="Barkod / QR kodu" aria-label="Barkod kodu" autocomplete="off"><button class="btn dark" data-scan="${k}">▣ Okut</button></div>
        <div class="sm">Gerçek uygulamada kamera ile okutulur. Burada kodu yaz ya da satırdaki “Okut”a dokun.</div>
        ${D.mods.fleet ? `<select class="in" data-vehicle="${k}" aria-label="Yüklenecek araç"><option value="">Yüklenecek aracı seç</option>${PEOPLE.filter(p => p.role === "sofor").map(p => `<option value="${p.id}"${s.vehicle === p.id ? " selected" : ""}>${esc(p.vehicle)} · ${esc(first(p.id))}</option>`).join("")}</select>` : ""}
        <button class="btn ok xl block" data-done="${k}"${doneN < items.length || (D.mods.fleet && !s.vehicle) ? " disabled" : ""}>Araca yüklendi ✓ (${doneN}/${items.length})</button>`;
    } else if (s.status === "working") body = `<div class="timer" data-timer="${s.startedAt}">${clock(s.startedAt)}</div>${tools}<button class="btn ok xl block" data-done="${k}"${s.photo && !s.photos.length ? " disabled" : ""}>İşi tamamla ✓</button>${s.photo && !s.photos.length ? `<div class="sm" style="text-align:center">Bu aşamada bitirmeden önce fotoğraf eklemen gerekiyor.</div>` : ""}`;
    else body = `<button class="btn xl block" data-start="${k}">▶ İşe başla</button>${tools}`;
    return `<article class="task ${s.status}">
      <div class="task-top"><span class="wo">İŞ EMRİ #${j.id}</span>${status}</div>${slaPill(j, s) ? `<div>${slaPill(j, s)}</div>` : ""}
      <div><h3>${esc(s.detail ? s.name.split(" ")[0] + ": " + j.title : `${s.name} · ${j.title}`)}</h3>${s.detail || typeof s.checklist === "string" ? `<p style="margin-top:6px">${esc(s.detail || s.checklist)}</p>` : ""}${Array.isArray(s.checklist) && s.checklist.length && !s.detail ? `<ul class="cl">${s.checklist.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}</div>
      ${facts}
      ${s.file ? `<button class="file" data-file="${esc(s.file)}">📄 ${esc(s.file)}<span class="sm" style="margin-left:auto">Aç</span></button>` : ""}
      ${s.notes.filter(n => n.text.startsWith("Geri gönderildi") || n.text.startsWith("Stok")).map(n => `<div class="note"><b>Not</b><span>${esc(n.text)}</span></div>`).join("")}
      ${body}${attach}
    </article>`;
  }

  function driverCard(j, s) {
    const k = `${j.id}:${s.key}`, addr = j.address || `${j.customer} adresi`;

      <path d="M40 90 H120 V40 H250 V70 H320" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${s.status === "working" ? "0" : "8 6"}"/>

    else body = `<div class="grid2"><a class="btn line" href="${mapUrl}" target="_blank" rel="noopener">🧭 Navigasyon</a><label class="btn line" style="position:relative">📷 Teslim fotoğrafı<input type="file" accept="image/*" data-photo="${k}" style="position:absolute;inset:0;opacity:0"></label></div>
      ${s.photos.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="Teslim fotoğrafı">`).join("")}</div>` : ""}
      <div><div class="sec-h"><b>Müşteri imzası</b><button class="link" id="sigClear">Temizle</button></div><canvas class="sig" data-sig="${k}" aria-label="İmza alanı, parmakla imzalayın"></canvas></div>
      <button class="btn ok xl block" data-deliver="${k}">Teslim edildi ✓</button>
      <div class="sm">${flowOf(j).prefs.signReq ? "Teslim için imza gerekli." : "İmza isteğe bağlı."} Fotoğraf önerilir.</div>`;
    return `<article class="task ${s.status === "working" ? "working" : ""}">
      <div class="task-top"><span class="wo">İŞ EMRİ #${j.id}</span>${s.status === "working" ? `<span class="pill acc">Yolda · ${ago(s.startedAt)}</span>` : `<span class="pill warn">Yüklendi, çıkış bekliyor</span>`}</div>
      <div><h3>${esc(j.customer)}</h3><p style="margin-top:4px">📍 ${esc(addr)}</p></div>
      <div class="facts"><span>📦 ${esc(j.title)} · ${esc(s.load || j.qty)}</span><span>⏰ ${esc(when(j.due))}</span></div>
      ${route}${body}</article>`;
  }
  function initSig(c) {
    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = "round"; x.strokeStyle = getComputedStyle(document.body).color;
    let down = false; c.dataset.inked = "";
    const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); };
    c.onpointermove = e => { if (!down) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); c.dataset.inked = "1"; };
    c.onpointerup = c.onpointercancel = () => { down = false; };
    const cl = $("#sigClear"); if (cl) cl.onclick = () => { x.clearRect(0, 0, c.width, c.height); c.dataset.inked = ""; };
  }

  // ----- customer -----
  function renderCustomer(name) {
    setNav(null, false);
    const jobs = D.jobs.filter(j => j.customer === name).sort((a, b) => a.done - b.done || a.due - b.due);
    const pubsOf = j => ["Sipariş alındı", ...[...new Set(j.steps.slice().sort((a, b) => a.g - b.g).map(x => x.pub || x.name))]];
    const stageIdx = j => { const P = pubsOf(j); if (j.done) return P.length; const act = activeSteps(j)[0]; return act ? P.indexOf(act.pub || act.name) : 0; };
    const visible = jobs.filter(j => flowOf(j).prefs.custVisible);
    $("#app").innerHTML = head("Müşteri takip ekranı", esc(name)) + `<main class="gut">
      <p class="sm" style="margin:0">Demirtaş Metal'in sizinle paylaştığı sipariş durumları. İç notlar, maliyetler ve çalışan bilgileri gösterilmez.</p>
      ${visible.map(j => { const PUB = pubsOf(j), si = stageIdx(j), del = j.steps.find(s => s.type === "delivery") || { status: "locked" };
        const eta = j.done ? `Teslim edildi · ${when(j.doneAt)}` : del.status === "working" ? `Yolda · tahmini varış ${hm(Date.now() + 40 * MIN)}` : `Tahmini teslim: ${when(j.due)}`;
        return `<div class="track"><div class="task-top"><span class="wo">SİPARİŞ #${j.id}</span>${j.done ? `<span class="pill ok">Teslim edildi</span>` : del.status === "working" ? `<span class="pill acc">Yolda</span>` : `<span class="pill info">${esc(PUB[Math.min(si, PUB.length - 1)])}</span>`}</div>
          <div><h2 style="font-size:1.25rem">${esc(j.title)}</h2><div class="sm">${esc(j.qty)}</div></div>
          <div class="eta">${esc(eta)}</div>
          <div class="tsteps" style="grid-template-columns:repeat(${PUB.length},minmax(0,1fr))">${PUB.map((n, i) => `<div class="ts ${i < si ? "on" : i === si ? "cur" : ""}"><i></i>${esc(n)}</div>`).join("")}</div>
          ${del.status === "working" ? `<div class="note info"><b>🚚 Aracınız yolda</b><span>Teslimat aracı yola çıktı. Konum yalnızca teslimat süresince paylaşılır.</span></div>` : ""}
          ${j.done && del.signature ? `<div class="sm">Teslim belgesi imzalı olarak kayıtlı.</div>` : ""}
        </div>`; }).join("") || `<div class="empty">Paylaşılan sipariş yok.</div>`}
      ${jobs.length > visible.length ? `<div class="sm">${jobs.length - visible.length} sipariş, işletmenin tercihiyle bu ekranda gösterilmiyor.</div>` : ""}
    </main>`;
  }

  // ---------------- events ----------------
  function readPhoto(file, cb) {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"), sc = 200 / Math.max(img.width, img.height);
      c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", .7)); }; img.src = r.result; };
    r.readAsDataURL(file);
  }
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.id === "who") { me = el.value; tab = "panel"; closeSheet(); render(); window.scrollTo(0, 0); return; }
    if (el.dataset.photo && el.files[0]) { const { j, s } = parseK(el.dataset.photo); readPhoto(el.files[0], url => { s.photos.push(url); notify(`${first(me)} #${j.id} için fotoğraf ekledi`, "📷"); save(); render(); toast("📷", "Fotoğraf eklendi", `#${j.id} ${s.name}`); }); }
    if (el.dataset.vehicle != null) { const { s } = parseK(el.dataset.vehicle); s.vehicle = el.value; if (el.value) { const { j } = parseK(el.dataset.vehicle); j.steps.find(x => x.type === "delivery").owner = el.value; } save(); render(); }
  });
  document.addEventListener("click", e => {
    const el = e.target.closest("button, a"); if (!el || el.tagName === "A") return;
    const d = el.dataset;
    if (el.id === "reset") { D = seed(); syncPeople(); save(); closeSheet(); render(); toast("↺", "Prototip sıfırlandı", "Örnek veriler geri yüklendi"); return; }
    if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); return; }
    if (d.goto) { const [t, f] = d.goto.split(":"); tab = t; if (f) jobFilter = f; render(); window.scrollTo(0, 0); return; }
    if (d.filter) { jobFilter = d.filter; render(); return; }
    if (d.job) { openJob(+d.job); return; }
    if (el.id === "newJob") { openNewJob(); return; }
    if (el.id === "bell") { const mine = D.feed.filter(f => f.to && f.to.includes(me)).reverse();
      sheet(`<div class="stack"><h2>Bildirimler</h2>${feedHtml(mine.length ? mine : [])}<button class="btn ghost block" id="closeS">Kapat</button></div>`, () => $("#closeS").onclick = closeSheet); return; }
    if (d.mod) { D.mods[d.mod] = !D.mods[d.mod]; save(); render(); toast("⚙", `${MODULES.find(m => m[0] === d.mod)[1]} ${D.mods[d.mod] ? "açıldı" : "kapatıldı"}`, D.mods[d.mod] ? "İlgili ekranlar görünür oldu" : "İlgili ekranlar gizlendi"); return; }
    if (d.priv) { D.privacy[d.priv] = !D.privacy[d.priv]; save(); render(); return; }
    if (d.tpl) { openTemplate(d.tpl); return; }
    if (d.usetpl) { openFlowEditor({ tpl: d.usetpl }); return; }
    if (d.copyflow) { openFlowEditor({ copy: d.copyflow }); return; }
    if (d.editflow) { openFlowEditor({ id: d.editflow }); return; }
    if (d.person) { openPerson(d.person); return; }
    if (el.id === "addPerson") { openPerson(null); return; }
    if (d.defflow) { D.defaultFlow = d.defflow; save(); render(); toast("⭐", "Varsayılan akış değişti", `${flowById(d.defflow).name} yeni işlerde önce seçili gelir`); return; }
    if (el.id === "newFlow") { openStartChooser(); return; }
    if (d.reassign) { const [a, b] = d.reassign.split(":"); openReassign(+a, b); return; }
    if (d.resolve) { const { j, s } = parseK(d.resolve); s.status = "ready"; s.readyAt = Date.now(); s.log.push({ at: Date.now(), by: me, act: "resolved", note: s.issue?.note }); delete s.issue;
      notify(`${first(me)} #${j.id} sorununu çözdü, ${first(s.owner)} devam edebilir`, "🛠", [s.owner]); save(); render(); if (layer.innerHTML) openJob(j.id, true); toast("🛠", "Sorun çözüldü", `${first(s.owner)} bilgilendirildi`); return; }
    if (d.approve) { const { j, s } = parseK(d.approve); const r = completeStep(j, s, me, "approved"); if (layer.innerHTML) { save(); render(); openJob(j.id, true); toast("✅", "Onaylandı", r.next ? `Sıradaki: ${r.next.map(x => x.name).join(", ")}` : ""); } else afterComplete(j, s, r); return; }
    if (d.back) { openBack(d.back); return; }
    if (d.start) { const { j, s } = parseK(d.start); s.status = "working"; s.startedAt = Date.now(); notify(`${first(me)} #${j.id} ${s.name} işine başladı`, "▶️"); save(); render(); return; }
    if (d.done) { const { j, s } = parseK(d.done); afterComplete(j, s, completeStep(j, s, me)); return; }
    if (d.voice) { const { j, s } = parseK(d.voice); const sec = 8 + Math.floor(Math.random() * 20);
      s.notes.push({ kind: "voice", text: `Sesli not · 0:${pad(sec)}`, by: me, at: Date.now() }); save(); render();
      toast("🎙", "Sesli not eklendi", "Prototipte kayıt taklit ediliyor; gerçek uygulamada basılı tutup konuşursun"); return; }
    if (d.issue) { openIssue(d.issue); return; }
    if (d.file) { openDrawing(d.file); return; }
    if (d.scanone || d.scan) {
      let k, code;
      if (d.scanone) { const parts = d.scanone.split(":"); k = parts[0] + ":" + parts[1]; code = parts.slice(2).join(":"); }
      else { k = d.scan; const j0 = parseK(k).j; code = ($(`#scan-${j0.id}`)?.value || "").trim().toUpperCase(); }
      const { j, s } = parseK(k), it = s.items.find(i => i.code === code);
      if (!it) { toast("✕", "Kod bulunamadı", code ? `${code} bu sevkiyatta yok` : "Bir kod yaz ya da satırdan okut"); return; }
      it.scanned = true; save(); render(); toast("▣", "Okundu", `${it.name} · ${it.n} adet`); return; }
    if (d.go) { const { j, s } = parseK(d.go); s.status = "working"; s.startedAt = Date.now(); notify(`${first(me)} #${j.id} için yola çıktı · müşteri bilgilendirildi`, "🚚", ["selim"]); save(); render(); toast("🚚", "İyi yolculuklar", `${j.customer} takip ekranında “Yolda” görünüyor`); return; }
    if (d.deliver) { const { j, s } = parseK(d.deliver), c = document.querySelector(`[data-sig="${d.deliver}"]`);
      if (flowOf(j).prefs.signReq && (!c || !c.dataset.inked)) { toast("✍️", "İmza gerekli", "Müşteriye imza alanına imzalatın"); return; }
      if (c && c.dataset.inked) s.signature = c.toDataURL("image/png"); afterComplete(j, s, completeStep(j, s, me)); return; }
  });

  render();
  setInterval(() => { if (!layer.innerHTML && !document.querySelector(".sig")) render(); }, 60000);
})();
</script>
