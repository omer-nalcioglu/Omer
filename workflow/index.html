<title>Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* ==========================================================================
   Workflow tasarım dili v2 · sahada kullanım için
   Layout: telefon genişliğinde tek sütun (en fazla 520px); üstte başlık, altta sabit menü, ayrıntılar alttan açılan pencerede.
   Kurallar: gövde 16px · en küçük 12px · her kontrol ≥48px, ana eylem 56px · renk yalnızca anlam taşır
   (mavi = dokunulabilir, yeşil = bitti/iyi, sarı = bekliyor/dikkat, kırmızı = durdu/gecikti) · tek ikon seti · 4px ızgara
   ========================================================================== */
:root {
  /* Yumuşak tasarım dili v3: açık lila zemin, beyaz kartlar, çivit vurgu, yuvarlak köşeler */
  --bg: #f4f5fb;
  --surface: #ffffff;
  --surface-2: #f6f7fc;
  --sunk: #eceef6;
  --ink: #111827;
  --ink-2: #4b5563;
  --ink-3: #5b6474;
  --line: #e5e7f0;
  --line-2: #d3d6e4;
  /* tek vurgu: çivit; yalnızca dokunulabilir öğelerde ve "benim" mesajlarımda */
  --accent: #4f46e5;
  --accent-2: #3730a3;
  --on-accent: #ffffff;
  --accent-soft: #eef0ff;
  --accent-line: #c7c9f9;
  /* durum renkleri: beyaz zeminde metin olarak en az 4.5:1 */
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --warn: #92400e;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --info: var(--accent);
  --info-soft: var(--accent-soft);
  --band: #14161f;
  --band-ink: #dfe2ee;
  --shadow: 0 1px 2px rgba(17, 24, 39, .05);
  --shadow-md: 0 10px 26px rgba(79, 70, 229, .12);
  --shadow-lg: 0 -12px 36px rgba(17, 24, 39, .14);
  /* ölçüler */
  --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 24px;
  --tap: 48px; --tap-lg: 56px;
  --t-xs: .75rem; --t-sm: .875rem; --t-md: 1rem; --t-lg: 1.125rem; --t-xl: 1.375rem; --t-2xl: 1.875rem; --t-3xl: 2.25rem;
  --display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #171a23; --surface-2: #1d2130; --sunk: #0b0d12; --ink: #eef0f6; --ink-2: #b8bdcc; --ink-3: #959bad; --line: #2a2f3d; --line-2: #3a4152;
    --accent: #a5b4fc; --accent-2: #c7d2fe; --on-accent: #1e1b4b; --accent-soft: #23254a; --accent-line: #3f4380;
    --ok: #4ade80; --ok-soft: #10291a; --warn: #fbbf24; --warn-soft: #2c2210; --bad: #fca5a5; --bad-soft: #351616;
    --band: #07080b; --band-ink: #c9cdd8; --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-md: 0 10px 26px rgba(0, 0, 0, .45); --shadow-lg: 0 -12px 36px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --surface-2: #1d2130; --sunk: #0b0d12; --ink: #eef0f6; --ink-2: #b8bdcc; --ink-3: #959bad; --line: #2a2f3d; --line-2: #3a4152;
  --accent: #a5b4fc; --accent-2: #c7d2fe; --on-accent: #1e1b4b; --accent-soft: #23254a; --accent-line: #3f4380;
  --ok: #4ade80; --ok-soft: #10291a; --warn: #fbbf24; --warn-soft: #2c2210; --bad: #fca5a5; --bad-soft: #351616;
  --band: #07080b; --band-ink: #c9cdd8; --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-md: 0 10px 26px rgba(0, 0, 0, .45); --shadow-lg: 0 -12px 36px rgba(0, 0, 0, .6); color-scheme: dark;
}

/* ---------- temel ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: var(--t-md); line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "cv11", "ss03"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.sm { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

/* ---------- prototip bandı: uygulamanın parçası değil, koyu ve ayrık ---------- */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; }
.band-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 6px; font-size: var(--t-xs); }
.band-in span { opacity: .7; white-space: nowrap; font-weight: 500; letter-spacing: .02em; }
.band select { flex: 1; min-width: 0; height: 36px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); color: var(--band-ink); border-radius: var(--r-sm); padding: 0 10px; font-size: var(--t-sm); font-weight: 600; }
.band select option { color: #0f1419; background: #fff; }
.band button { color: var(--band-ink); opacity: .8; font-size: var(--t-xs); font-weight: 600; height: 36px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- sayfa iskeleti ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: calc(100% - 48px); display: flex; flex-direction: column; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { padding-block: 24px 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top > div { min-width: 0; }
.eyebrow { font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-family: var(--display); font-weight: 700; font-size: var(--t-2xl); letter-spacing: -.025em; margin: 4px 0 0; line-height: 1.15; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 650; font-size: var(--t-lg); margin: 0; letter-spacing: -.015em; line-height: 1.3; }
h3 { margin: 0; }
.bell { position: relative; width: var(--tap); height: var(--tap); border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); flex: none; }
.bell svg { width: 22px; height: 22px; }
.bell b { position: absolute; top: -5px; right: -5px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--bad); color: #fff; font-size: var(--t-xs); font-weight: 700; display: grid; place-items: center; padding: 0 6px; border: 2px solid var(--bg); }
main { display: flex; flex-direction: column; gap: 24px; padding-block: 16px 32px; }
section { display: flex; flex-direction: column; gap: 12px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.link { color: var(--accent); font-weight: 600; font-size: var(--t-sm); min-height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 4px; }
.link svg { width: 16px; height: 16px; }
.sec-h .pill::before { display: none; }
.sec-h .pill { padding-left: 10px; }
.track .ts { font-size: 0; gap: 0; }

/* ---------- durum özeti (patron paneli başı) ---------- */
.hero { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.hero .hic { width: 44px; height: 44px; border-radius: var(--r); display: grid; place-items: center; }
.hero .hic svg { width: 24px; height: 24px; }
.hero b { display: block; font-size: var(--t-lg); font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
.hero span { display: block; font-size: var(--t-sm); color: var(--ink-2); }
.hero.ok .hic { background: var(--ok-soft); color: var(--ok); }
.hero.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); } .hero.warn .hic { background: var(--warn-soft); color: var(--warn); }
.hero.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); } .hero.bad .hic { background: var(--bad-soft); color: var(--bad); }

/* ---------- sayı kutuları ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; text-align: left; min-height: 88px; display: grid; align-content: space-between; gap: 6px; }
.kpi .v { font-family: var(--display); font-weight: 700; font-size: var(--t-3xl); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: var(--t-sm); color: var(--ink-2); font-weight: 500; }
.kpi .num { font-size: var(--t-lg); }
.kpi.bad .v { color: var(--bad); }
.kpi.ok .v { color: var(--ok); }

/* ---------- dikkat listesi ---------- */
.att { display: grid; grid-template-columns: 36px minmax(0, 1fr) 20px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 16px; min-height: 64px; border-bottom: 1px solid var(--line); }
div.att { grid-template-columns: 36px minmax(0, 1fr); }
.att:last-child { border-bottom: 0; }
.att .aic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.att .aic svg { width: 20px; height: 20px; }
.aic.bad { background: var(--bad-soft); color: var(--bad); } .aic.warn { background: var(--warn-soft); color: var(--warn); } .aic.info { background: var(--accent-soft); color: var(--accent); } .aic.ok { background: var(--ok-soft); color: var(--ok); }
.atx { display: grid; gap: 1px; min-width: 0; }
.atx b { font-weight: 600; overflow-wrap: anywhere; }
.atx span { font-size: var(--t-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.chev { color: var(--ink-3); display: grid; } .chev svg { width: 20px; height: 20px; }
.allok { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); background: var(--ok-soft); }
.allok svg { width: 24px; height: 24px; color: var(--ok); justify-self: center; }
.allok b { display: block; } .allok span { font-size: var(--t-sm); color: var(--ink-2); }

/* eski uyarı kartı (raporlarda kullanılıyor) */
.ai { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 8px; }
.ai-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.spark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; flex: none; }
.ai ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: var(--t-sm); }

/* ---------- listeler ve iş satırı ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.jr { display: grid; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-height: 72px; }
.jr:last-child { border-bottom: 0; }
.jr:active, .att:active, .pr:active, .cr:active { background: var(--surface-2); }
.jr-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.jr .t { font-weight: 600; font-size: var(--t-md); overflow-wrap: anywhere; line-height: 1.35; }
.jr-h .mono { color: var(--ink-3); flex: none; }
.jr-m { font-size: var(--t-sm); color: var(--ink-2); }
.jr-m b { font-weight: 600; }
.jr .st { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.jr .pct { margin-left: auto; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.prog.ok i { background: var(--ok); }
.prog.bad i { background: var(--bad); }

/* ---------- durum etiketi ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; font-size: var(--t-xs); font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.2; }
.pill.bad, .pill.warn, .pill.ok { padding-left: 8px; }
.pill.bad::before, .pill.warn::before, .pill.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--accent-soft); color: var(--accent-2); }
.pill.mute { background: var(--sunk); color: var(--ink-2); }
.pill.acc { background: var(--accent); color: var(--on-accent); }

/* ---------- canlı akış ---------- */
.feed { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0 16px; }
.fi { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); font-size: var(--t-sm); align-items: start; line-height: 1.45; }
.fi:last-child { border-bottom: 0; }
.fic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.fic svg { width: 16px; height: 16px; }
.fic.bad { background: var(--bad-soft); color: var(--bad); } .fic.ok { background: var(--ok-soft); color: var(--ok); } .fic.warn { background: var(--warn-soft); color: var(--warn); } .fic.info { background: var(--accent-soft); color: var(--accent); }
.fi time { font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }

/* ---------- düğmeler ---------- */
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 10px 18px; border-radius: var(--r); font-weight: 600; font-size: var(--t-md); background: var(--accent); color: var(--on-accent); text-align: center; line-height: 1.25; }
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.line { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad-soft); color: var(--bad); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.block { width: 100%; }
.btn.xl { min-height: var(--tap-lg); padding-block: 14px; font-size: var(--t-lg); border-radius: var(--r-lg); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 72px; padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); font-weight: 600; font-size: var(--t-sm); text-align: center; position: relative; color: var(--ink); }
.tool .i { display: grid; place-items: center; line-height: 1; font-size: 1.3rem; }
.tool .i svg { width: 24px; height: 24px; }
.tool[data-issue] { color: var(--bad); }
.tool input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- görev kartı: çalışanın tek ekranı ---------- */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.task::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--warn); }
.task.working::before { background: var(--accent); }
.task.blocked::before { background: var(--bad); }
.task.working { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.task.blocked { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wo { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .04em; color: var(--ink-3); font-weight: 500; }
.task h3 { font-family: var(--display); font-size: var(--t-xl); line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.task p { margin: 0; color: var(--ink-2); }
.facts { display: grid; gap: 8px; font-weight: 500; font-size: var(--t-md); }
.facts > span { display: flex; align-items: center; gap: 10px; min-width: 0; }
.facts svg, .tic-i svg { width: 20px; height: 20px; color: var(--ink-3); }
.file { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent-2); font-weight: 600; text-align: left; width: 100%; }
.file svg { width: 20px; height: 20px; }
.timer { font-family: var(--mono); font-size: 2.25rem; font-weight: 500; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding-block: 4px; }
.attach { display: flex; gap: 8px; flex-wrap: wrap; }
.attach img { width: 64px; height: 64px; border-radius: var(--r-sm); object-fit: cover; border: 1px solid var(--line); }
.vn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-sm); font-weight: 500; }
.issue { background: var(--bad-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: var(--t-sm); display: grid; gap: 2px; }
.issue b { color: var(--bad); }
.scan { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.scan:last-child { border-bottom: 0; }
.scan .bx { width: 32px; height: 32px; border-radius: var(--r-sm); border: 2px solid var(--line-2); display: grid; place-items: center; font-weight: 800; color: transparent; }
.scan.on .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.scanrow { display: flex; gap: 8px; }
.scanrow input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-family: var(--mono); }
.sig { width: 100%; height: 170px; border-radius: var(--r); border: 2px dashed var(--line-2); background: var(--surface-2); touch-action: none; display: block; }
.map { border-radius: var(--r); overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.map svg { display: block; width: 100%; height: auto; }
ul.cl { margin: 8px 0 0; padding: 0; list-style: none; color: var(--ink-2); display: grid; gap: 6px; }
ul.cl li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; }
ul.cl li::before { content: ""; width: 14px; height: 14px; margin-top: 4px; border-radius: 4px; border: 2px solid var(--line-2); }

/* ---------- kişi satırı ---------- */
.pr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.pr:last-child { border-bottom: 0; }
.pr b { font-weight: 600; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: var(--t-sm); color: #fff; flex: none; letter-spacing: .02em; }
.load { height: 6px; border-radius: 3px; background: var(--sunk); margin-top: 6px; overflow: hidden; }
.load i { display: block; height: 100%; background: var(--accent); }

/* ---------- raporlar ---------- */
.bars { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.bar { display: grid; grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr) 3.5rem; gap: 10px; align-items: center; font-size: var(--t-sm); }
.bar .tr { height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.bar .tr i.hi { background: var(--bad); }

/* ---------- ayar satırı ve anahtar ---------- */
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 64px; padding: 14px 16px; border-bottom: 1px solid var(--line); }

/* ---------- alt menü ---------- */
nav.tabs { position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

.tab .i { position: relative; width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }

.fab { position: fixed; z-index: 6; right: max(16px, calc(50% - 244px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; min-height: var(--tap-lg); padding: 0 20px; border-radius: var(--r-lg); background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--shadow-lg); }

/* ---------- alttan açılan pencere ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; padding-top: 6px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease-out; box-shadow: var(--shadow-lg); }
.sheet.still { animation: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sh-top { position: sticky; top: -6px; z-index: 2; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; background: var(--surface); margin: -6px -16px 8px; padding: 6px 8px 0; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto; grid-column: 2; }
.sx { grid-column: 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--surface-2); }
.sx svg { width: 20px; height: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

textarea, .in { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); resize: vertical; font-size: var(--t-md); }
.in::placeholder, textarea::placeholder { color: var(--ink-3); }

select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); font-size: var(--t-sm); font-weight: 500; text-align: left; color: var(--ink); line-height: 1.25; }

/* ---------- iş detayı: aşama çizelgesi ---------- */
.graph { display: flex; flex-direction: column; }

/* ---------- akış düzenleyici ---------- */

/* ---------- bildirim baloncuğu ve boş durum ---------- */

.me-card { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }

/* v2 düzeltmeleri: sonradan eklenen bileşenler yeni ölçüye */

.kcard { padding: 12px; } .kopen { font-size: var(--t-md); }
.seg button { min-height: 44px; }
.cnum { min-height: 44px; }
.obst .r { grid-template-columns: 28px minmax(0, 1fr) 44px 44px 44px; } .obst .ed-b { height: 44px; } .obst .r input { min-height: 44px; }
.obwho .add input { min-height: 44px; }

.mi.sm2 { vertical-align: -4px; }
.ob-hero h1 { font-size: 2.5rem; letter-spacing: -.035em; }
.custok { border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.cvrow .in { min-height: 44px; } .cbtn { width: 44px; height: 44px; }
.cvrow { grid-template-columns: 44px 44px minmax(0, 1fr) 48px; } .cbtn.send { width: 48px; height: 48px; }
.bub { font-size: var(--t-md); } .mby, .mt { font-size: var(--t-xs); }

.ob-prog span { border-top: 3px solid var(--line); padding-top: 6px; } .ob-prog span.on { border-color: var(--accent); color: var(--accent); }

.ob-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.ob-logo svg { width: 30px; height: 30px; }

.obst .ed-b { height: 36px; }
.obst.par { margin-left: 18px; border-left: 3px solid var(--accent); }
.obwho { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }

/* Workflow Forms */
.form { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 12px; }
.form .fh, .frec .fh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ff { display: grid; gap: 6px; }
.ff > label, .ff > .fl { font-weight: 600; font-size: .9rem; }

.ff .in { padding: 10px 12px; }
.fnum { display: flex; align-items: center; gap: 8px; } .fnum .in { flex: 1; min-width: 0; } .fnum span { color: var(--ink-2); font-size: .9rem; white-space: nowrap; }
.ff.bad .in { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
.ff .fe { color: var(--bad); font-size: .8rem; font-weight: 700; } .ff .fe:empty { display: none; }

.ed-ftog .mi { margin: 0; } .ed-ftog span:last-child { margin-left: auto; color: var(--accent); }
.fed { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 8px; }

.wzlist { display: grid; gap: 8px; max-height: 52vh; overflow-y: auto; }
.choice.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ==========================================================================
   Yumuşak tasarım dili v3 · bileşen katmanı
   Kural: yuvarlak (14/20/24), yumuşak gölge yalnız öne çıkan kartta, çivit yalnız eylemde.
   Hareket: ekrana girişte kısa yükselme, pencere alttan kayar, bildirim üstten düşer,
   tikler çizilir, canlı nokta nabız atar. Hepsi 0.2–0.6 sn; "hareketi azalt" açıksa kapanır.
   ========================================================================== */
@keyframes sf-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sf-inL { from { opacity: 0; transform: translate(-8px, 8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sf-inR { from { opacity: 0; transform: translate(8px, 8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sf-live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes sf-pop { 0% { transform: scale(0); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes sf-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sf-draw { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
body { font-feature-settings: normal; letter-spacing: -.003em; }
h1 { font-weight: 800; letter-spacing: -.02em; }
h2 { font-weight: 700; letter-spacing: -.01em; }
.eyebrow { font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.top { padding-block: 28px 6px; }
.bell { border-radius: var(--r); }
/* kartlar */
.list, .kpi, .hero, .me-card, .tk-opt, .empty { border-radius: var(--r-lg); }
.hero { box-shadow: var(--shadow); }
.hero.bad { background: linear-gradient(135deg, var(--bad-soft), var(--surface) 70%); }
.hero.warn { background: linear-gradient(135deg, var(--warn-soft), var(--surface) 70%); }
.hero.ok { background: linear-gradient(135deg, var(--ok-soft), var(--surface) 70%); }
.kpi .v { font-weight: 800; letter-spacing: -.03em; }
.kpi.bad .v { color: var(--bad); }
.jr .t { font-weight: 700; }
.jr, .att, .set, .pr { border-color: color-mix(in srgb, var(--line) 75%, var(--surface)); }
.task { border-radius: var(--r-xl); box-shadow: var(--shadow-md); }
.task::before { display: none; }
.task.working { border-color: var(--accent-line); }
.task.blocked { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.task h3 { font-weight: 800; }
.wo { font-family: var(--text); font-weight: 700; letter-spacing: .06em; color: var(--ink-2); }
.timer { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; }
.tool { border-radius: var(--r); }
.note { border-radius: var(--r); }
.pcard, .kcol, .kcard { border-radius: var(--r); }
.kcard { box-shadow: var(--shadow); }
.gstep.cur .dotn { animation: sf-live 2s ease-out infinite; }
/* durum etiketleri: "yapılıyor" nabız atar */
.pill { font-weight: 700; }
.pill.acc { background: var(--accent-soft); color: var(--accent-2); padding-left: 8px; }
.pill.acc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: sf-live 2s ease-out infinite; }
.prog { height: 6px; border-radius: 999px; }
.prog i { border-radius: 999px; transform-origin: 0 50%; }
#app.enter .prog i { animation: sf-grow .9s .15s both var(--ease); }
/* düğmeler ve seçiciler */
.btn { border-radius: var(--r); font-weight: 700; transition: transform .12s, background .2s, color .2s, box-shadow .2s; }
.btn.xl { border-radius: 18px; }
.btn:not(.line):not(.ghost):not(.dark):not(:disabled) { box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn.ok:not(:disabled) { box-shadow: 0 8px 20px color-mix(in srgb, var(--ok) 24%, transparent); }
.btn:active:not(:disabled), .chip:active, .tool:active, .att:active, .jr:active, .kpi:active, .tck:active { transform: scale(.97); }
.chip { border-color: var(--line); font-weight: 600; transition: background .2s, color .2s, border-color .2s, transform .12s; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { border-radius: 16px; background: var(--sunk); border-color: var(--line); }
.seg button { border-radius: 12px; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { box-shadow: var(--shadow); }
.in, textarea, select.in { border-radius: var(--r); background: var(--surface); }
.in:focus, textarea:focus, select:focus { box-shadow: 0 0 0 4px var(--accent-soft); }
.sw[aria-checked="true"] { background: var(--accent); }
.tck { border-radius: var(--r); }
.tck[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.tck[aria-pressed="true"] .bx { background: var(--accent); border-color: var(--accent); border-radius: 50%; }
.tck .bx { border-radius: 50%; }
.tck[aria-pressed="true"] .bx svg path { stroke-dasharray: 30; animation: sf-draw .35s both ease-out; }
/* alt menü: düz beyaz, seçili sekme lila kapsül, ortada yuvarlak-kare ＋ */
nav.tabs { background: color-mix(in srgb, var(--surface) 94%, transparent); border-top-color: var(--line); }
.tab { font-weight: 600; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--accent-2); font-weight: 800; }
.tab[aria-selected="true"] .i { background: var(--accent-soft); color: var(--accent); }
.tab.tplus .i { width: 54px; height: 54px; border-radius: 18px; margin-top: -22px; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 38%, transparent); }
#app.enter ~ #nav .tb, #nav .tb.new { animation: sf-pop .4s both var(--ease); }
/* pencere ve bildirim */
.scrim { background: rgba(17, 18, 32, .42); }
.sheet { border-radius: 28px 28px 0 0; }

.cvm > .msg:last-child { animation: sf-inL .35s both var(--ease); }
.cvm > .msg.me:last-child { animation-name: sf-inR; }

#app.enter main > *:nth-child(2) { animation-delay: .05s; } #app.enter main > *:nth-child(3) { animation-delay: .1s; }
#app.enter main > *:nth-child(4) { animation-delay: .15s; } #app.enter main > *:nth-child(n+5) { animation-delay: .2s; }

.ob-hero h1 { font-weight: 800; letter-spacing: -.03em; }

  // ---------- Modül Deposu ----------
  function recsFor(flows, jobs) {
    const out = {}, st = flows.flatMap(f => f.stages.map(x => ({ ...x, flow: f.name })));
    const hit = (re, type) => st.find(x => (type && x.type === type) || re.test(lower(x.name)));
    let h;
    if ((h = hit(/teslim|nakliye|kargo|yerinde/, "delivery"))) out.fleet = `Akışında “${h.name}” aşaması var`;
    if ((h = hit(/paketleme|sevkiyat|yükleme/, "pack"))) out.scan = `“${h.name}” aşamasında ürünler okutularak sayılabilir`;
    if ((h = hit(/malzeme|depo|stok|toplama|kumaş|parça/))) out.stock = `“${h.name}” aşaması stok bilgisi ister`;
    const longest = flows.reduce((a, f) => f.stages.length > (a?.stages.length || 0) ? f : a, null);
    if (longest && longest.stages.filter(x => !x.par).length >= 6) out.planning = `${longest.stages.length} aşamalı “${longest.name}” akışında termin hesabı en çok fark yaratır`;
    if (st.some(x => x.type === "approval")) out.rules = "Onay adımların var; kurallar onayları otomatik yönetebilir";
    if (jobs.some(j => j.price > 0) || st.some(x => /fiyat|ödeme|hakediş|tahsilat|teklif/.test(lower(x.name)))) out.finance = "İşlerinde tutar ve ödeme adımı var";
    if (st.some(x => x.pub && x.pub !== x.name) || flows.some(f => f.prefs?.custNotify)) out.customers = "Müşteriye gösterilecek aşama adların hazır";
    if ((h = hit(/kalite|kontrol|ölçü|keşif|muayene|test|ekspertiz/))) out.forms = `“${h.name}” aşamasında ölçü ve kontrol değerleri kayıt altına alınabilir`;
    out.chat = "Ekip iletişimi işin içinde kalır, WhatsApp gruplarına gerek kalmaz";
    if (jobs.filter(j => j.done).length >= 3 || (longest && longest.stages.length >= 6)) out.reports = "Aşama sürelerini ölçmeye yetecek iş hacmin var";
    return out;
  }

      ${D.mods.rules ? `<section><div class="sec-h"><h2>Kurallar</h2><span class="sm">Eğer… ise… yap</span></div>

        ${(draft.rules || []).length ? `<div class="list">${draft.rules.map((r, i) => `<div class="set"><div style="min-width:0"><b style="font-weight:600">${esc(ruleText(r, draft))}</b></div>

        <div class="rulebox">
          <label class="sm"><b>EĞER</b><select id="rc">${Object.entries(CONDS).filter(([, v]) => !v.mod || D.mods[v.mod]).map(([k, v]) => `<option value="${k}">${v.t}</option>`).join("")}</select></label>
          <div id="rcx"></div>
          <label class="sm"><b>O ZAMAN</b><select id="ra"></select></label>

    </div>`, () => {
      const redraw = () => openFlowEditor(edSrc, true);

        $("#ra").innerHTML = Object.entries(ACTS).filter(([, a]) => a.ev.includes(c.ev)).map(([k, a]) => `<option value="${k}">${a.t}</option>`).join(""); drawAct(); };
      const drawAct = () => { $("#rax").innerHTML = ACTS[$("#ra").value]?.stage ? `<label class="sm">Atlanacak aşama${stageSel("ras")}</label>` : ""; };
      if ($("#rc")) { $("#rc").onchange = drawRule; $("#ra").onchange = drawAct; drawRule(); }
      if ($("#rAdd")) $("#rAdd").onclick = () => { const r = { id: newKey(), cond: $("#rc").value, act: $("#ra").value, on: true };

      const refresh = () => { const pv = layer.querySelector(".preview"); if (pv) pv.innerHTML = stageGraph(draft.stages.filter(x => x.name.trim()), x => x.fixed ? person(x.fixed).name : deptName(x.skill)); };
      layer.querySelectorAll("[data-f]").forEach(el => el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {

        } else if (f === "par" || f === "photo" || f === "hide") { st[f] = el.checked; redraw(); }
        else if (f === "slav" || f === "slau") { const v = +layer.querySelector(`[data-i="${i}"][data-f="slav"]`).value, u = layer.querySelector(`[data-i="${i}"][data-f="slau"]`).value;
          st.sla = v > 0 ? (u === "dk" ? v / 60 : u === "gün" ? v * 24 : v) : null; refresh(); }
        else if (f === "checklist") { st.checklist = el.value.split("\n").map(x => x.trim()).filter(Boolean); refresh(); }
        else if (f === "type") { st.type = el.value; redraw(); }
        else { st[f] = el.value; refresh(); }
      }));
      layer.querySelectorAll("[data-ndok]").forEach(b => b.onclick = () => { const i = +b.dataset.ndok, v = layer.querySelector(`[data-nd="${i}"] input`).value.trim(); if (!v) return;
        const st = draft.stages[i]; delete st.fixed; st.skill = deptKey(v); edOpen.add(st.key); save(); redraw(); toast("🏷", `${v} departmanı eklendi`, "Ekip sekmesinden çalışan atayabilirsin"); });
      layer.querySelectorAll("details.ed-more").forEach(dt => dt.addEventListener("toggle", () => dt.open ? edOpen.add(dt.dataset.edk) : edOpen.delete(dt.dataset.edk)));
      layer.querySelectorAll("[data-ftog]").forEach(b => b.onclick = () => { const k = b.dataset.ftog; edOpenF.has(k) ? edOpenF.delete(k) : edOpenF.add(k); redraw(); });
      layer.querySelectorAll("[data-fadd]").forEach(b => b.onclick = () => { const [i, kind] = b.dataset.fadd.split(":"), st = draft.stages[+i];
        (st.form = st.form || []).push({ id: newKey(), label: "", kind, req: kind !== "text", ...(kind === "choice" ? { opts: [], bad: [] } : {}), ...(kind === "yesno" ? { failNo: true } : {}) }); redraw();
        const ins = layer.querySelectorAll(`[data-fe2$=":label"][data-fe2^="${i}:"]`); ins[ins.length - 1]?.focus(); });
      layer.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => { const [i, fi] = b.dataset.fdel.split(":").map(Number); draft.stages[i].form.splice(fi, 1); redraw(); });
      layer.querySelectorAll("[data-fbad]").forEach(b => b.onclick = () => { const [i, fi] = b.dataset.fbad.split(":").map(Number), f = draft.stages[i].form[fi], o = b.dataset.o;
        f.bad = (f.bad || []).includes(o) ? f.bad.filter(x => x !== o) : [...(f.bad || []), o]; redraw(); });
      layer.querySelectorAll("[data-fe2]").forEach(el => el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" || el.dataset.fe2.endsWith(":opts") ? "change" : "input", () => {
        const [i, fi, prop] = el.dataset.fe2.split(":"), f = draft.stages[+i].form[+fi];
        if (prop === "req" || prop === "failNo") { f[prop] = el.checked; return; }
        if (prop === "kind") { f.kind = el.value; if (f.kind === "choice") { f.opts = f.opts || []; f.bad = f.bad || []; } if (f.kind === "yesno" && f.failNo == null) f.failNo = true; redraw(); return; }
        if (prop === "opts") { f.opts = [...new Set(el.value.split(",").map(x => x.trim()).filter(Boolean))]; f.bad = (f.bad || []).filter(x => f.opts.includes(x)); redraw(); return; }
        if (prop === "min" || prop === "max") { const v = el.value.trim(); f[prop] = v === "" || isNaN(fNum(v)) ? null : fNum(v); return; }
        f[prop] = el.value;
      }));
      $("#edFinal").onchange = e => draft.finalBy = e.target.value || null;
      $("#edIco").onchange = e => draft.ico = e.target.value;
      $("#edName").oninput = e => draft.name = e.target.value;

  // ----- job detail (boss / foreman) -----
  function openJob(id, still) {
    const j = jobById(id); if (!j) return;
    const groups = [...new Set(j.steps.map(s => s.g))];
    const canManage = ["patron", "ustabasi"].includes(person(me).role);
    const graph = groups.map((g, gi) => {
      const gs = j.steps.filter(s => s.g === g), all = gs.every(s => s.status === "done"), blk = gs.some(s => s.status === "blocked"), act = gs.some(s => !["done", "locked"].includes(s.status));
      return `<div class="gstep ${all ? "done" : blk ? "blk" : act ? "cur" : ""}"><span class="dotn">${all ? "✓" : gi + 1}</span><div class="par">
        ${gs.length > 1 ? `<span class="ptag">∥ Paralel · ${gs.length} departman aynı anda</span>` : ""}
        ${gs.map(s => `<div class="pcard"><div class="h"><span>${esc(s.name)}</span>${stepPill(s)}</div>${slaPill(j, s)}
          <div class="sm" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${isPool(s.owner) ? `<span class="pill warn">Panoda · kimse almadı</span>` : crewOf(s).map(id => `<span style="display:inline-flex;gap:5px;align-items:center">${avatar(id, 20)} ${esc(crewOf(s).length > 1 ? first(id) : person(id).name)}${s.split?.[id] ? ` · ${s.split[id].n} ${esc(unitOf(j))}${s.split[id].done ? ` <b style="color:var(--ok)">✓</b>` : ""}` : ""}</span>`).join(" ")}${s.mode === "together" && crewOf(s).length > 1 ? ` <span class="ptag">birlikte</span>` : ""}${s.doneAt && s.status === "done" ? ` · ${esc(when(s.doneAt))}` : s.status !== "locked" && s.readyAt ? ` · ${since(s.readyAt)} bu aşamada` : ""}</div>
          ${D.mods.planning && s.status !== "done" && SIM.res[j.id]?.steps[s.key] ? `<div class="sm">Plan: ${esc(when(SIM.res[j.id].steps[s.key].start))} → ${esc(when(SIM.res[j.id].steps[s.key].end))}${SIM.res[j.id].steps[s.key].wait > 2 * HOUR ? ` · <span style="color:var(--warn);font-weight:700">${fmtH(SIM.res[j.id].steps[s.key].wait / HOUR)} sıra bekliyor</span>` : ""}</div>` : ""}
          ${s.issue && s.status === "blocked" ? `<div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}</div>` : ""}
          ${s.photos.length || s.notes.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="İş fotoğrafı">`).join("")}${s.notes.map(n => `<span class="vn">${n.kind === "voice" ? "🎙 " + n.text : "📝 " + esc(n.text)}</span>`).join("")}</div>` : ""}
          ${s.signature ? `<div class="attach"><img src="${s.signature}" alt="Müşteri imzası" style="width:120px;background:#fff"></div>` : ""}
          ${D.mods.forms ? formRec(s) : ""}
          ${!j.done && s.status !== "done" && (can(me, "assign") || can(me, "approve") || s.owner === me) ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
            ${can(me, "assign") ? `<button class="chip" data-reassign="${j.id}:${s.key}">Kim yapıyor</button>` : ""}
            ${s.status === "blocked" && can(me, "assign") ? `<button class="chip" data-resolve="${j.id}:${s.key}">Sorun çözüldü</button>` : ""}
            ${s.type === "approval" && s.status === "ready" && (can(me, "approve") || s.owner === me) ? `<button class="chip" data-approve="${j.id}:${s.key}">${s.final ? "Tamamlandı, onayla" : "Onayla"}</button>` : ""}</div>` : ""}
        </div>`).join("")}</div></div>`;
    }).join("");
    sheet(`<div class="stack">
      <div><div class="eyebrow">${j.quick ? `Görev${j.by ? " · " + esc(first(j.by)) + " verdi" : ""}` : `İş emri #${j.id} · ${esc(flowOf(j).ico)} ${esc(flowOf(j).name)}`}</div><h2>${esc(j.title)}</h2>
        <div class="sm">${j.quick ? `${esc(crewOf(j.steps[0]).map(first).join(", "))}${j.spec && j.spec.link ? ` · <button class="link" data-job="${j.spec.link}">${esc(j.qty)}</button>` : ""}` : `${esc(j.customer)} · ${esc(j.qty)}`} · Termin ${esc(when(j.due))}</div>
        ${j.quick && j.steps[0].ck && j.steps[0].ck.length ? `<div class="sm" style="margin-top:6px">Alt adımlar: ${j.steps[0].checklist.map((c, i) => `${j.steps[0].ck[i] ? "☑" : "☐"} ${esc(c)}`).join(" · ")}</div>` : ""}
        ${j.quick && j.spec && j.spec.repeat && !j.spec.stopped ? `<div class="note info" style="margin-top:8px"><b>🔁 ${REP[j.spec.repeat][0]} tekrarlanıyor</b><span>Bitince bir sonraki kendiliğinden açılır.</span>${can(me, "create") ? `<button class="link" data-stoprep="${j.id}">Tekrarı durdur</button>` : ""}</div>` : ""}
        ${!j.done && !j.quick && can(me, "create") ? `<button class="btn line block" data-taskjob="${j.id}" style="margin-top:12px">${ico("bolt")} Bu işle ilgili görev ver</button>` : ""}
        <div class="chips" style="margin-top:8px"><span class="pill ${jobState(j).cls}">${esc(jobState(j).label)}</span>${isLate(j) ? `<span class="pill bad">Gecikme mevcut</span>` : ""}<span class="pill mute">%${pct(j)}</span></div>
        ${!j.done && (can(me, "create") || can(me, "assign")) ? `<button class="btn line block" data-jedit="${j.id}" style="margin-top:12px">${ico("pen")} Düzenle ya da iptal et</button>` : ""}</div>

          j.items.forEach(it => { if (it.pid || D.products.some(p => (it.code && trn(p.code) === trn(it.code)) || trn(p.name) === trn(it.name))) return;
            D.products.push({ id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), code: it.code || "", name: it.name, cat: "Yeni eklenen", opts: {}, unit: it.unit || "ad" }); }); }
        const wn = $("#nNote").value.split("\n").map(x => x.trim()).filter(Boolean); if (wn.length) j.warn = wn;
        if (ni.paper) j.paper = ni.paper;
        applyCreateRules(j, false);
        const mz = j.steps.find(s => s.key === "malzeme") || j.steps[0];
        warn().filter(x => x.startsWith("Stok")).forEach(x => mz.notes.push({ kind: "text", text: x, by: PAT(), at: Date.now() }));
        j.steps.filter(s => s.status === "ready").forEach(s => s.readyAt = Date.now());
        D.jobs.push(j);
        const g0 = j.steps.filter(s => s.g === 0);
        notify(`${first(PAT())} yeni iş açtı: #${j.id} ${title} (${customer}) · ${g0.map(s => first(s.owner)).join(" ve ")} bilgilendirildi`, "🆕", g0.map(s => s.owner));
        save(); closeSheet(); tab = "panel"; render(); window.scrollTo(0, 0);
        toast("🆕", `#${j.id} iş emri dağıtıldı`, `${j.steps.length} aşama · ilk aşama: ${g0.map(s => first(s.owner)).join(" ∥ ")}`);
      };
    });
  }

  // ----- foreman -----
  function renderForeman() {

    const issues = D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => s.status === "blocked").map(s => ({ j, s })));
    const workers = PEOPLE.filter(p => homeOf(p.id) === "worker");
    const pooled = D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => isPool(s.owner) && s.status === "ready").map(s => ({ j, s })));
    const inProd = D.jobs.filter(j => !j.done).sort((a, b) => a.due - b.due);
    $("#app").innerHTML = head("Ustabaşı paneli", `Günaydın ${esc(first(me))}`, bellCount(me)) + `<main class="gut">

      <section><div class="sec-h"><h2>Sorun bildirimleri</h2><span class="pill ${issues.length ? "bad" : "ok"}">${issues.length}</span></div>
        ${issues.length ? issues.map(({ j, s }) => `<div class="task blocked"><div class="task-top"><span class="wo">İŞ EMRİ #${j.id} · ${esc(s.name.toUpperCase())}</span><span class="pill bad">${ago(s.issue.at)}</span></div>
          <div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}<div class="sm">Bildiren: ${esc(person(s.issue.by || s.owner).name)}</div></div>
          <div class="grid2"><button class="btn ok" data-resolve="${j.id}:${s.key}">Çözüldü, devam</button><button class="btn line" data-reassign="${j.id}:${s.key}">Başkasına ata</button></div></div>`).join("") : `<div class="empty">Açık sorun yok 👍</div>`}</section>
      ${pooled.length ? `<section><div class="sec-h"><h2>Panoda bekleyenler</h2><span class="pill warn">${pooled.length}</span></div><div class="list">${pooled.map(({ j, s }) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="mono sm">#${j.id}</span> <b>${esc(j.title)}</b><div class="sm">${esc(s.name)} · ${since(s.readyAt)} kimse almadı</div></div>${can(me, "assign") ? `<button class="btn line" data-reassign="${j.id}:${s.key}">Ata</button>` : ""}</div>`).join("")}</div></section>` : ""}
      ${can(me, "create") ? `<button class="btn block" id="newJob">${ico("plus")} Yeni iş oluştur</button>` : ""}
      <section><div class="sec-h"><h2>Onay bekleyenler</h2><span class="pill ${approvals.length ? "warn" : "ok"}">${approvals.length}</span></div>
        ${approvals.length ? `<div class="list">${approvals.map(({ j, s }) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="mono sm">#${j.id}</span> <b>${esc(j.title)}</b><div class="sm">${esc(s.name)} · ${esc(first(s.owner))} kontrol ediyor · ${ago(s.readyAt)}</div></div>
          <button class="btn ok" data-approve="${j.id}:${s.key}">Onayla</button></div>`).join("")}</div>` : `<div class="empty">Onay bekleyen iş yok.</div>`}</section>
      <section><h2>Ekip yükü</h2><div class="list">${workers.map(p => { const st = personStatus(p.id);
        return `<div class="pr">${avatar(p.id)}<div style="min-width:0"><b>${esc(first(p.id))}</b> <span class="sm">· ${esc(p.title)}</span><div class="load"><i style="width:${Math.min(100, (loadOf(p.id) + queuedOf(p.id)) * 20)}%"></i></div></div><span class="pill ${st.cls}">${esc(st.label)}</span></div>`; }).join("")}</div></section>
      <section><h2>Üretimdeki işler</h2><div class="list">${inProd.map(jobRow).join("")}</div></section>

  // ----- worker (production, QC, warehouse) -----
  let tick = null;
  function myTasks(id) {
    return D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => onStep(s, id) && ["ready", "working", "blocked"].includes(s.status)).map(s => ({ j, s })))
      .sort((a, b) => (b.s.status === "working") - (a.s.status === "working") || (a.s.deadline || a.j.due) - (b.s.deadline || b.j.due));
  }
  function renderWorker() {
    setNav(roleNav("Görevlerim"));
    const p = person(me), tasks = myTasks(me);
    const queued = D.jobs.filter(j => !j.done).flatMap(j => j.steps.filter(s => s.owner === me && s.status === "locked").map(s => ({ j, s })));
    $("#app").innerHTML = head(`Çalışan paneli · ${esc(p.title)}`, "Görevlerim", bellCount(me)) + `<main class="gut">
      <p style="margin:0;font-size:1.05rem;font-weight:600">${tasks.length ? `Bugün ${tasks.length} görevin var.` : "Şu an bekleyen görevin yok."}</p>
      ${tasks.map(({ j, s }) => taskCard(j, s)).join("")}
      ${queued.length ? `<section><h2>Sırada gelecek</h2><div class="list">${queued.map(({ j, s }) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><span class="mono sm">#${j.id}</span> <b>${esc(j.title)}</b><div class="sm">${esc(s.name)} · önceki aşama bitince bildirim gelir</div></div><span class="pill mute">Bekliyor</span></div>`).join("")}</div></section>` : ""}
      ${p.role === "depo" && D.mods.stock ? stockHtml() : ""}
    </main>`;
    clearInterval(tick);
    if (tasks.some(x => x.s.status === "working")) tick = setInterval(() => document.querySelectorAll("[data-timer]").forEach(el => el.textContent = clock(+el.dataset.timer)), 1000);
  }
  const clock = t => { const s = Math.max(0, Math.floor((Date.now() - t) / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  function taskCard(j, s) {
    const k = `${j.id}:${s.key}`;
    const status = s.status === "working" ? `<span class="pill acc">Çalışıyor</span>` : s.status === "blocked" ? `<span class="pill bad">Sorun bildirildi</span>` : `<span class="pill warn">${s.type === "approval" ? "Onayını bekliyor" : "Bekliyor"}</span>`;
    const facts = `<div class="facts">${s.place ? `<span>${ico("pin")}${esc(s.place)}</span>` : ""}<span>${ico("clock")}Teslim: ${esc(s.deadline ? when(s.deadline) : dayLabel(j.due))}</span>${j.quick && j.qty === "Görev" ? "" : `<span>${ico("box")}${esc(j.qty)}</span>`}</div>`;
    const attach = s.photos.length || s.notes.length ? `<div class="attach">${s.photos.map(p => `<img src="${p}" alt="Eklenen fotoğraf">`).join("")}${s.notes.map(n => `<span class="vn">${n.kind === "voice" ? "🎙 " + esc(n.text) : "📝 " + esc(n.text)}</span>`).join("")}</div>` : "";
    const tools = `<div class="grid3">
        <label class="tool"><span class="i">${ico("camera")}</span>Fotoğraf<input type="file" accept="image/*" data-photo="${k}"></label>
        <button class="tool" data-voice="${k}"><span class="i">${ico("mic")}</span>Sesli not</button>
        <button class="tool" data-issue="${k}"><span class="i">${ico("alert")}</span>Sorun bildir</button></div>`;
    let body = "";
    if (s.status === "blocked") body = `<div class="issue"><b>${esc(s.issue.type)}</b> · ${esc(s.issue.note)}<div class="sm">Ustabaşı ve patron bilgilendirildi. Çözülünce bildirim gelecek.</div></div>`;
    else if (s.type === "wait") body = `<div class="note info"><b>Dışarıdan bekleniyor</b><span>Tedarikçi, müşteri ya da başka bir kurumdan gelecek şey bekleniyor. Bu süre kimsenin iş yüküne yazılmaz. Gelince işaretle, iş sıradakine geçsin.</span></div>
      <button class="btn ok xl block" data-done="${k}">Geldi, devam ✓</button>`;
    else if (s.type === "approval") body = `${s.cust && D.mods.customers ? `<div class="note info"><b>Müşteri onayı</b><span>${esc(j.customer)} takip ekranından kendisi onaylayabilir. Telefonda onay aldıysan sen de onaylayabilirsin.</span></div>` : ""}${formHtml(j, s, k, true)}${tools}<div class="${flowOf(j).prefs.sendBack ? "grid2" : ""}"><button class="btn ok xl${flowOf(j).prefs.sendBack ? "" : " block"}" data-approve="${k}"${gate(s).block ? " disabled" : ""}>${gate(s).fails ? "Sapmayla onayla" : s.final ? "Tamamlandı ✓" : "Onayla ✓"}</button>${flowOf(j).prefs.sendBack ? `<button class="btn bad xl" data-back="${k}">Geri gönder</button>` : ""}</div><div class="sm fhint" data-fhint="${k}">${gate(s).hint}</div>`;
    else if (s.type === "pack" && D.mods.scan) {
      const items = s.items || [{ name: j.title, code: `UR-${j.id}`, n: parseInt(j.qty) || 1, scanned: false }]; s.items = items;
      const doneN = items.filter(i => i.scanned).length;
      body = `<div class="list" style="box-shadow:none;background:var(--surface-2);padding:0 12px">${items.map(i => `<div class="scan ${i.scanned ? "on" : ""}"><span class="bx">✓</span><div style="min-width:0"><b>${esc(i.name)}</b><div class="sm mono">${esc(i.code)} · ${i.n} adet</div></div>${i.scanned ? `<span class="pill ok">Okundu</span>` : `<button class="chip" data-scanone="${k}:${esc(i.code)}">Okut</button>`}</div>`).join("")}</div>
        <div class="scanrow"><input class="mono" id="scan-${j.id}" placeholder="Barkod / QR kodu" aria-label="Barkod kodu" autocomplete="off"><button class="btn dark" data-scan="${k}">▣ Okut</button></div>
        <div class="sm">Gerçek uygulamada kamera ile okutulur. Burada kodu yaz ya da satırdaki “Okut”a dokun.</div>
        ${D.mods.fleet ? `<select class="in" data-vehicle="${k}" aria-label="Yüklenecek araç"><option value="">Yüklenecek aracı seç</option>${PEOPLE.filter(p => p.role === "sofor").map(p => `<option value="${p.id}"${s.vehicle === p.id ? " selected" : ""}>${esc(p.vehicle)} · ${esc(first(p.id))}</option>`).join("")}</select>` : ""}
        <button class="btn ok xl block" data-done="${k}"${doneN < items.length || (D.mods.fleet && !s.vehicle) ? " disabled" : ""}>Araca yüklendi ✓ (${doneN}/${items.length})</button>`;
    } else if (s.status === "working") body = `<div class="timer" data-timer="${s.startedAt}">${clock(s.startedAt)}</div>${formHtml(j, s, k, true)}${tools}${(() => { const sp = s.mode === "split" && s.split && s.split[me] && Object.keys(s.split).length > 1 ? s.split[me] : null;
      if (sp && sp.done) return `<button class="btn ok xl block" disabled>Payın bitti · ${Object.entries(s.split).filter(([, v]) => !v.done).map(([id]) => esc(first(id))).join(", ")} bekleniyor</button>`;
      return `<button class="btn ok xl block" data-done="${k}"${gate(s).block ? " disabled" : ""}>${sp ? `Payımı bitirdim ✓ · ${sp.n} ${esc(unitOf(j))}` : "İşi tamamla ✓"}</button>`; })()}<div class="sm fhint" data-fhint="${k}">${gate(s).hint}</div>`;
    else body = `${formHtml(j, s, k, false)}<button class="btn xl block" data-start="${k}">${ico("play")} İşe başla</button>${tools}`;
    return `<article class="task ${s.status}">
      <div class="task-top"><span class="wo">${j.quick ? `GÖREV${j.by && j.by !== me ? " · " + esc(first(j.by)).toLocaleUpperCase("tr") + " VERDİ" : ""}${j.spec && j.spec.repeat ? " · 🔁 " + REP[j.spec.repeat][0].toLocaleUpperCase("tr") : ""}` : `İŞ EMRİ #${j.id}`}</span>${status}</div>${slaPill(j, s) ? `<div>${slaPill(j, s)}</div>` : ""}
      ${warnHtml(j)}
      <div><h3>${esc(j.quick && !s.final ? j.title : s.detail ? s.name.split(" ")[0] + ": " + j.title : `${s.name} · ${j.title}`)}</h3>${s.detail || typeof s.checklist === "string" ? `<p style="margin-top:6px">${esc(s.detail || s.checklist)}</p>` : ""}${s.ck && s.checklist.length ? `<div class="tcks">${s.checklist.map((c, i) => `<button class="tck" data-tck="${k}:${i}" aria-pressed="${!!s.ck[i]}"><span class="bx">${ico("check")}</span><span>${esc(c)}</span></button>`).join("")}</div>` : Array.isArray(s.checklist) && s.checklist.length && !s.detail ? `<ul class="cl">${s.checklist.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}</div>
      ${facts}
      ${crewOf(s).length > 1 ? `<div class="crew">${s.mode === "split" ? "Bölüşüldü:" : "Birlikte:"} ${crewOf(s).map(id => `<span>${avatar(id, 22)} ${id === me ? "Sen" : esc(first(id))}${s.split?.[id] ? ` · ${s.split[id].n} ${esc(unitOf(j))}${s.split[id].done ? ` <span class="dn">✓</span>` : ""}` : ""}</span>`).join("")}</div>` : ""}
      ${s.final ? `<div class="note info"><b>Tamamlanma onayı</b><span>Bütün aşamalar bitti. Ürün ya da hizmet eksiksizse onayla; eksik varsa istediğin aşamaya geri gönder.</span></div>` : ""}
      ${itemsHtml(j, s, k)}${paperHtml(j)}
      ${s.file ? `<button class="file" data-file="${esc(s.file)}">${ico("file")}${esc(s.file)}<span class="sm" style="margin-left:auto">Aç</span></button>` : ""}
      ${s.notes.filter(n => n.text.startsWith("Geri gönderildi") || n.text.startsWith("Stok")).map(n => `<div class="note"><b>Not</b><span>${esc(n.text)}</span></div>`).join("")}
      ${body}${attach}
    </article>`;
  }
  function stockHtml() {
    return `<section><h2>Stok</h2><div class="list">${D.stock.map(s => `<div class="pr" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(s.name)}</b><div class="sm">Minimum ${s.min} ${esc(s.unit)}</div></div>
      <span class="pill ${s.qty === 0 ? "bad" : s.qty < s.min ? "warn" : "ok"}">${s.qty} ${esc(s.unit)}</span></div>`).join("")}</div></section>`;
  }
  const parseK = k => { const [id, key] = k.split(":"); const j = jobById(+id); return { j, s: j.steps.find(x => x.key === key) }; };
  function afterComplete(j, s, r) {
    save(); render();
    if (r.finished && j.quick) toast("✅", "Görev bitti", `${j.by && j.by !== me ? first(j.by) + " bilgilendirildi" : "Kayda geçti"}${j.spawned ? " · bir sonraki " + dayLabel(jobById(j.spawned).due) : ""}`);
    else if (r.finished) toast("🏁", `#${j.id} tamamlandı`, "Patrona teslimat, süre ve maliyet raporu gitti");
    else if (r.waitingParallel) toast("✅", "Görev tamamlandı", `Paralel aşama bekleniyor: ${r.waitingParallel.map(x => x.name).join(", ")}`);
    else toast("➡️", "Görev tamamlandı", `Sıradaki: ${r.next.map(x => `${x.name} (${first(x.owner)})`).join(" ∥ ")} · bildirim gönderildi`);
  }
  function openIssue(k) {
    const { j, s } = parseK(k);
    const types = ["Malzeme eksik", "Makine arızası", "Çizim / ölçü hatalı", "İş güvenliği", "Diğer"];
    let pick = types[0];
    sheet(`<div class="stack"><div><div class="eyebrow">#${j.id} · ${esc(s.name)}</div><h2>Sorun bildir</h2><div class="sm">Ustabaşı ve patron anında haberdar olur.</div></div>
      <div class="chips">${types.map((t, i) => `<button class="chip" data-type="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join("")}</div>
      <textarea id="issNote" rows="3" placeholder="Kısaca ne oldu? (ör: 40×40 profil bitti)"></textarea>
      <button class="btn bad xl block" id="issGo" style="background:var(--bad);color:#fff">Sorunu bildir</button>
      <button class="btn ghost block" id="closeS">Vazgeç</button></div>`, () => {
      layer.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { pick = b.dataset.type; layer.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
      $("#closeS").onclick = closeSheet;
      $("#issGo").onclick = () => {
        s.status = "blocked"; s.issue = { type: pick, note: $("#issNote").value.trim() || "Ayrıntı yazılmadı", at: Date.now(), by: me }; s.log.push({ at: Date.now(), by: me, act: "issue", note: `${pick}: ${s.issue.note}` });
        notify(`${first(me)} sorun bildirdi: #${j.id} ${pick.toLowerCase()}`, "⚠️", [...FORE(), PAT()]); eventRules(j, "issue", s); save(); closeSheet(); render();
        toast("⚠️", "Sorun bildirildi", "Ustabaşı ve patron bilgilendirildi");
      };
    });
  }
  function openBack(k) {
    const { j, s } = parseK(k), gs = [...new Set(j.steps.filter(x => x.g < s.g).map(x => x.g))].sort((a, b) => a - b);
    let tg = gs[gs.length - 1];
    sheet(`<div class="stack"><div><div class="eyebrow">#${j.id} · ${esc(s.name)}</div><h2>Geri gönder</h2><div class="sm">İş, seçtiğin aşamaya notla döner; aradaki aşamalar yeniden yapılır.</div></div>
      ${gs.length > 1 ? `<div><div class="sm" style="font-weight:700;margin-bottom:6px">Hangi aşamaya?</div><div class="chips">${gs.map(g => `<button class="chip" data-tg="${g}" aria-pressed="${g === tg}">${esc(j.steps.filter(x => x.g === g).map(x => x.name).join(" ∥ "))}</button>`).join("")}</div></div>` : ""}
      <textarea id="backNote" rows="3" placeholder="Ne düzeltilmeli? (ör: sol kanatta boya akması var)"></textarea>

      $("#backGo").onclick = () => { const prev = sendBack(j, s, me, $("#backNote").value.trim(), tg); save(); closeSheet(); render();

  // ----- driver -----
  let stopSig = null;
  function renderDriver() {
    setNav(roleNav("Teslimatlar"));
    const p = person(me);
    const del = D.jobs.flatMap(j => j.done ? [] : j.steps.filter(s => s.owner === me && s.type === "delivery" && ["ready", "working", "blocked"].includes(s.status)).map(s => ({ j, s })));
    const coming = D.jobs.filter(j => !j.done).flatMap(j => j.steps.filter(s => s.owner === me && s.type === "delivery" && s.status === "locked").map(s => ({ j, s })));
    $("#app").innerHTML = head(`Şoför paneli · ${esc(p.vehicle || p.title)}`, "Teslimatlarım", bellCount(me)) + `<main class="gut">

    if (el.id === "newFlow") { openStartChooser(); return; }

    if (d.reassign) { const [a, b] = d.reassign.split(":"); openCrew(+a, b); return; }
    if (d.resolve) { const { j, s } = parseK(d.resolve); s.status = "ready"; s.readyAt = Date.now(); s.log.push({ at: Date.now(), by: me, act: "resolved", note: s.issue?.note }); delete s.issue;
      notify(`${first(me)} #${j.id} sorununu çözdü, ${first(s.owner)} devam edebilir`, "🛠", [s.owner]); save(); render(); if (layer.innerHTML) openJob(j.id, true); toast("🛠", "Sorun çözüldü", `${first(s.owner)} bilgilendirildi`); return; }

      el.parentElement.querySelectorAll("[data-fv]").forEach(b => b.setAttribute("aria-pressed", b === el)); formSync(k); return; }
    if (el.id === "formCsv") { const n = formsCsv(); toast("⇩", "Form kayıtları indirildi", `${n} satır · form-kayitlari.csv`); return; }
    if ((d.approve || d.done) && D.mods.forms) { const { s } = parseK(d.approve || d.done), g = gate(s);
      if (formState(s).missing.length) { toast("📋", "Önce formu doldurun", g.hint.replace(/<[^>]+>/g, "")); return; } }
    if (d.approve) { const { j, s } = parseK(d.approve); const r = completeStep(j, s, me, "approved"); if (layer.innerHTML) { save(); render(); openJob(j.id, true); toast("✅", "Onaylandı", r.next ? `Sıradaki: ${r.next.map(x => x.name).join(", ")}` : ""); } else afterComplete(j, s, r); return; }
    if (d.back) { openBack(d.back); return; }
    if (d.start) { const { j, s } = parseK(d.start); s.status = "working"; s.startedAt = Date.now(); s.log.push({ at: Date.now(), by: me, act: "started" }); notify(`${first(me)} #${j.id} ${s.name} işine başladı`, "▶️"); save(); render(); return; }
    if (d.item) { const [a, b2, ix] = d.item.split(":"), { j, s } = parseK(a + ":" + b2); s.itemsDone = s.itemsDone || {}; s.itemsDone[ix] = !s.itemsDone[ix]; save();
      el.classList.toggle("on", s.itemsDone[ix]); el.setAttribute("aria-pressed", s.itemsDone[ix]);
      const n = j.items.filter((_, i) => s.itemsDone[i]).length, c = document.querySelector(`[data-icount="${a}:${b2}"]`); if (c) c.textContent = `${n} / ${j.items.length} hazır`;
      if (n === j.items.length) toast("✓", "Bütün kalemler hazır", "Şimdi işi tamamlayabilirsin"); return; }
    if (d.oform) { openOrderForm(+d.oform); return; }
    if (el.id === "newQuote") { openQuoteForm(null); return; }
    if (d.jedit) { openJobEdit(+d.jedit); return; }
    if (d.pay) { openPay(+d.pay); return; }
    if (d.cust) { openCust(d.cust); return; }
    if (el.id === "newCust") { openCust(null); return; }
    if (d.newjobfor) { const c = D.customers.find(x => x.id === d.newjobfor); closeSheet(); openNewJob(c.name); return; }
    if (d.newquotefor) { const c = D.customers.find(x => x.id === d.newquotefor); closeSheet(); openQuoteForm(null, c.name); return; }
    if (el.id === "bz_sat") { el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"); return; }
    if (el.id === "bzSave") { const b = D.biz || (D.biz = {}); ["name", "what", "address", "phone", "email", "taxOffice", "taxNo", "iban", "pay"].forEach(k => b[k] = $("#bz_" + k).value.trim());

      if (b.we <= b.ws) { toast("✋", "Mesai bitişi başlangıçtan sonra olmalı"); return; }

    if (d.quote) { openQuote(d.quote); return; }
    if (d.qedit) { openQuoteForm(d.qedit); return; }
    if (d.qsend) { openSendQuote(d.qsend); return; }

    if (d.qrej) { const q = D.quotes.find(x => x.id === d.qrej); q.status = "rejected"; q.decidedAt = Date.now(); notify(`${qno(q)} teklifi ${me.startsWith("c:") ? q.customer + " tarafından reddedildi" : "reddedildi olarak işaretlendi"}`, "✕", [PAT()]); save(); closeSheet(); render(); toast("✕", "Teklif reddedildi", qno(q)); return; }
    if (d.qtalk) { const q = D.quotes.find(x => x.id === d.qtalk); q.status = "talk"; notify(`${q.customer} ${qno(q)} teklifi hakkında görüşmek istiyor`, "📲", [PAT()]); save(); closeSheet(); render(); toast("📲", "İletildi", `${BIZ()} sizi arayacak`); return; }
    if (d.paper) { const j = jobById(+d.paper); sheet(`<div class="stack"><div><div class="eyebrow">#${j.id} · ${esc(j.customer)}</div><h2>Sipariş kağıdı</h2></div><div class="paperbig"><img src="${j.paper}" alt="Sipariş kağıdı"></div></div>`); return; }
    if (d.done) { const { j, s } = parseK(d.done);
      if (j.items && j.items.length && !["pack", "delivery"].includes(s.type)) { const miss = j.items.length - j.items.filter((_, i) => (s.itemsDone || {})[i]).length;
        if (miss && !s.missOk) { s.missOk = true; toast("✋", `${miss} kalem işaretlenmedi`, "Hepsi hazırsa işaretle; yine de bitirmek için tekrar dokun"); return; } delete s.missOk; }
      if (s.mode === "split" && s.split && s.split[me] && Object.keys(s.split).length > 1) { s.split[me].done = true; s.split[me].at = Date.now();
        const left = Object.entries(s.split).filter(([, v]) => !v.done);
        if (left.length) { notify(`${first(me)} #${j.id} ${s.name} işinde payını bitirdi (${s.split[me].n} ${unitOf(j)}) · ${left.map(([id]) => first(id)).join(", ")} bekleniyor`, "✅", [PAT(), ...left.map(([id]) => id)]);
          save(); render(); toast("✅", "Payın kaydedildi", `${left.map(([id]) => first(id)).join(", ")} bitirince iş sıradakine geçer`); return; } }
      afterComplete(j, s, completeStep(j, s, me)); return; }
    if (d.voice) { const { j, s } = parseK(d.voice); const sec = 8 + Math.floor(Math.random() * 20);
      s.notes.push({ kind: "voice", text: `Sesli not · 0:${pad(sec)}`, by: me, at: Date.now() }); save(); render();
      toast("🎙", "Sesli not eklendi", "Prototipte kayıt taklit ediliyor; gerçek uygulamada basılı tutup konuşursun"); return; }
    if (d.issue) { openIssue(d.issue); return; }
    if (d.file) { openDrawing(d.file); return; }
    if (d.scanone || d.scan) {
      let k, code;
      if (d.scanone) { const parts = d.scanone.split(":"); k = parts[0] + ":" + parts[1]; code = parts.slice(2).join(":"); }
      else { k = d.scan; const j0 = parseK(k).j; code = ($(`#scan-${j0.id}`)?.value || "").trim().toUpperCase(); }
      const { j, s } = parseK(k), it = s.items.find(i => i.code === code);
      if (!it) { toast("✕", "Kod bulunamadı", code ? `${code} bu sevkiyatta yok` : "Bir kod yaz ya da satırdan okut"); return; }
      it.scanned = true; save(); render(); toast("▣", "Okundu", `${it.name} · ${it.n} adet`); return; }
    if (d.go) { const { j, s } = parseK(d.go); s.status = "working"; s.startedAt = Date.now(); notify(`${first(me)} #${j.id} için yola çıktı · müşteri bilgilendirildi`, "🚚", ["selim"]); save(); render(); toast("🚚", "İyi yolculuklar", `${j.customer} takip ekranında “Yolda” görünüyor`); return; }
    if (d.deliver) { const { j, s } = parseK(d.deliver), c = document.querySelector(`[data-sig="${d.deliver}"]`);
      if (flowOf(j).prefs.signReq && (!c || !c.dataset.inked)) { toast("✍️", "İmza gerekli", "Müşteriye imza alanına imzalatın"); return; }
      if (c && c.dataset.inked) s.signature = c.toDataURL("image/png"); afterComplete(j, s, completeStep(j, s, me)); return; }
  });

  if (firstRun) startOb(false); else render();
  setInterval(() => { if (!OB && !drag && !layer.innerHTML && !document.querySelector(".sig") && !document.activeElement?.dataset?.fin) render(); }, 60000);
