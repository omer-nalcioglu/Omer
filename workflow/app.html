<title>Workflow v5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Workflow: iş kimde, hangi aşamada, ne zaman biter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>/* ==========================================================================
   Workflow · tasarım dili v4 "Sakin"
   Yerleşim: masaüstünde telefon kasası, telefonda tam ekran; tek sütun, alt menü, alttan pencere.
   İlkeler: her ekranda tek ana eylem · durum hem renk hem ikon hem yazı · 48px dokunma alanı ·
   gövde 17px (atölyede kol mesafesinden okunur) · hareket 0,2–0,45 sn ve kapatılabilir.
   ========================================================================== */
:root {
  --bg: #f5f6fb;  --surface: #ffffff; --surface-2: #f8f9fd; --sunk: #eceef6;
  --ink: #12141f; --ink-2: #464c5e;   --ink-3: #5d6375;     --line: #e3e5ef; --line-2: #cfd3e2;
  --accent: #4f46e5; --accent-ink: #3730a3; --on-accent: #ffffff; --accent-soft: #eef0ff; --accent-line: #c7c9f9;
  --ok: #126b34;  --ok-soft: #e6f7eb;  --warn: #92400e; --warn-soft: #fdf2d8; --bad: #b91c1c; --bad-soft: #fde8e8;
  --scrim: rgba(18, 20, 31, .45); --shadow: 0 1px 2px rgba(18, 20, 31, .05); --lift: 0 12px 32px rgba(79, 70, 229, .13);
  --focus: #4f46e5;
  --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 24px; --r-sheet: 28px;
  --t-xs: .8125rem; --t-sm: .9375rem; --t-md: 1.0625rem; --t-lg: 1.25rem; --t-xl: 1.5rem; --t-2xl: 1.875rem; --t-3xl: 2.375rem;
  --tap: 3rem; --tap-lg: 3.5rem;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1); --dur: .32s;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1016; --surface: #171a24; --surface-2: #1c2030; --sunk: #0a0c11; --ink: #eef0f7; --ink-2: #b9bfd0; --ink-3: #9aa1b5; --line: #282d3b; --line-2: #394054;
    --accent: #a5b4fc; --accent-ink: #c7d2fe; --on-accent: #1e1b4b; --accent-soft: #22254a; --accent-line: #3f4380;
    --ok: #4ade80; --ok-soft: #0f2a1b; --warn: #fbbf24; --warn-soft: #2b2110; --bad: #fca5a5; --bad-soft: #361717;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0, 0, 0, .4); --lift: 0 12px 32px rgba(0, 0, 0, .45); --focus: #a5b4fc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1016; --surface: #171a24; --surface-2: #1c2030; --sunk: #0a0c11; --ink: #eef0f7; --ink-2: #b9bfd0; --ink-3: #9aa1b5; --line: #282d3b; --line-2: #394054;
  --accent: #a5b4fc; --accent-ink: #c7d2fe; --on-accent: #1e1b4b; --accent-soft: #22254a; --accent-line: #3f4380;
  --ok: #4ade80; --ok-soft: #0f2a1b; --warn: #fbbf24; --warn-soft: #2b2110; --bad: #fca5a5; --bad-soft: #361717;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 1px 2px rgba(0, 0, 0, .4); --lift: 0 12px 32px rgba(0, 0, 0, .45); --focus: #a5b4fc; color-scheme: dark;
}
/* erişilebilirlik ayarları (Menü › Görünüm ve erişilebilirlik) */
:root[data-size="l"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }
:root[data-contrast="high"] { --ink-2: var(--ink); --ink-3: var(--ink); --line: var(--line-2); --line-2: var(--ink-3); --accent-soft: transparent; }
:root[data-contrast="high"] .card, :root[data-contrast="high"] .list, :root[data-contrast="high"] .btn, :root[data-contrast="high"] .chip, :root[data-contrast="high"] .in { border-width: 2px; }
:root[data-bold="1"] body { font-weight: 600; }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- temel ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--t-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--r); font-weight: 700; }
.skip:focus { top: 12px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 1.375rem; height: 1.375rem; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 1.125rem; height: 1.125rem; }
svg.i.l { width: 1.75rem; height: 1.75rem; }

/* ---------- prototip çubuğu (uygulamanın parçası değil) ---------- */
.proto { position: sticky; top: 0; z-index: 60; background: #12141f; color: #e3e6f0; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-in { max-width: 560px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--t-xs); }
.proto label { opacity: .78; font-weight: 600; }
.proto select { flex: 1 1 170px; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; padding: 0 10px; font-weight: 700; }
.proto select option { color: #12141f; background: #fff; }
.proto button { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); color: #fff; font-weight: 700; font-size: var(--t-xs); }
.proto button[aria-pressed="true"] { background: #fff; color: #12141f; }

/* ---------- cihaz kasası ---------- */
.device { position: relative; background: var(--bg); }
.sbar, .homebar { display: none; }
.screen { min-height: 100dvh; }
@media (min-width: 760px) and (min-height: 680px) {
  html, body { overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; background: radial-gradient(1100px 600px at 50% -10%, var(--accent-soft), transparent 70%), var(--sunk); }
  .proto { position: static; background: transparent; color: var(--ink); }
  .proto label { color: var(--ink-2); opacity: 1; }
  .proto select { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
  .proto button { color: var(--ink); border-color: var(--line-2); background: var(--surface); }
  .proto button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .stage { display: grid; place-items: center; padding: 8px 24px 24px; min-height: 0; }
  .device { height: min(844px, calc(100dvh - 96px)); aspect-ratio: 390 / 844; border: 12px solid #0b0d14; border-radius: 58px; overflow: hidden; transform: translateZ(0);
    box-shadow: 0 0 0 2px #2b2f3d, 0 40px 80px rgba(18, 20, 31, .28), 0 12px 24px rgba(18, 20, 31, .14); }
  .sbar { display: flex; position: absolute; z-index: 40; inset: 0 0 auto; height: 50px; padding: 0 30px 0 34px; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; background: var(--bg); pointer-events: none; }
  .sbar .island { position: absolute; left: 50%; top: 11px; width: 116px; height: 32px; margin-left: -58px; border-radius: 20px; background: #000; }
  .screen { position: absolute; inset: 50px 0 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .homebar { display: block; position: absolute; z-index: 45; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .8; pointer-events: none; }
  .tabs { padding-bottom: 20px !important; }
  .sheet { padding-bottom: 34px !important; }
}

/* ---------- sayfa iskeleti ---------- */
.page > * { min-width: 0; }
.page { padding: 20px max(16px, env(safe-area-inset-left, 0px)) 128px max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; max-width: 560px; margin: 0 auto; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.top > div { min-width: 0; }
.eyebrow { font-size: var(--t-xs); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-size: var(--t-2xl); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
h1:focus { outline: none; }
h2 { font-size: var(--t-lg); font-weight: 750; letter-spacing: -.01em; }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-sm); }
.xs { font-size: var(--t-xs); }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-left: -8px; padding: 0 8px; color: var(--accent-ink); font-weight: 700; border-radius: var(--r); }

/* ---------- yüzeyler ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; }
.row:first-child { border-top: 0; }
button.row:active, a.row:active { background: var(--surface-2); }
.row .t, .row .s { display: block; }
.row .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.row .s { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
.row .chev { color: var(--ink-3); }
.ic { width: 2.5rem; height: 2.5rem; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); flex: none; }
.ic.ok { background: var(--ok-soft); color: var(--ok); } .ic.warn { background: var(--warn-soft); color: var(--warn); } .ic.bad { background: var(--bad-soft); color: var(--bad); }
.av { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: var(--t-xs); flex: none; letter-spacing: .02em; }
.av.s { width: 1.75rem; height: 1.75rem; font-size: .6875rem; }
.avs { display: inline-flex; } .avs .av { border: 2px solid var(--surface); margin-left: -8px; } .avs .av:first-child { margin-left: 0; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r-lg); padding: 24px 16px; text-align: center; color: var(--ink-2); font-size: var(--t-sm); background: var(--surface); display: grid; gap: 10px; justify-items: center; }

/* özet kartı: tek cümle, en kötü duruma göre renk + ikon */
.sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); }
.sum b { display: block; font-size: var(--t-lg); line-height: 1.3; font-weight: 800; letter-spacing: -.01em; }
.sum.bad { background: linear-gradient(135deg, var(--bad-soft), var(--surface) 72%); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
.sum.warn { background: linear-gradient(135deg, var(--warn-soft), var(--surface) 72%); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); }
.sum.ok { background: linear-gradient(135deg, var(--ok-soft), var(--surface) 72%); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kpi { display: grid; gap: 2px; padding: 12px 10px; min-height: 76px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: left; align-content: space-between; }
.kpi .v { font-size: var(--t-xl); font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.kpi .l { font-size: var(--t-xs); color: var(--ink-2); font-weight: 600; line-height: 1.25; }
.kpi.bad .v { color: var(--bad); }

/* ---------- durum etiketleri: ikon + yazı, yalnız renk değil ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; background: var(--sunk); color: var(--ink-2); line-height: 1.2; }
.pill svg.i { width: .95rem; height: .95rem; stroke-width: 2.2; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.live { animation: live 1.8s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.prog { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s var(--ease); }
.prog.bad i { background: var(--bad); } .prog.ok i { background: var(--ok); }

/* ---------- düğmeler ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 10px 18px; border-radius: var(--r); font-weight: 750; background: var(--accent); color: var(--on-accent); border: 1px solid transparent; transition: transform .12s, background .2s, box-shadow .2s; line-height: 1.2; text-align: center; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.big { min-height: var(--tap-lg); font-size: var(--t-md); border-radius: 18px; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 28%, transparent); }
.btn.ok { background: var(--ok); color: #fff; } .btn.ok.big { box-shadow: 0 8px 22px color-mix(in srgb, var(--ok) 26%, transparent); }
:root[data-theme="dark"] .btn.ok, .dark-ok { color: #06240f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok { color: #06240f; } }
.btn.line { background: var(--surface); color: var(--ink); border-color: var(--line-2); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--accent-ink); box-shadow: none; }
.btn.danger { background: var(--bad-soft); color: var(--bad); box-shadow: none; }
.btn.block { width: 100%; }
.btn.btn[aria-disabled="true"] { background: var(--sunk); color: var(--ink-2); box-shadow: none; }
.btn:disabled { background: var(--sunk); color: var(--ink-2); box-shadow: none; cursor: not-allowed; }
.hint { font-size: var(--t-sm); color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
.hint.bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tool { display: grid; justify-items: center; gap: 4px; min-height: 68px; padding: 10px 6px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-size: var(--t-sm); font-weight: 700; }
.tool.bad { color: var(--bad); }
.tool:active { transform: scale(.97); }

/* ---------- seçiciler ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 650; font-size: var(--t-sm); transition: background .2s, color .2s, border-color .2s; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 16px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { min-height: 42px; border-radius: 12px; font-weight: 700; font-size: var(--t-sm); color: var(--ink-2); text-align: center; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-weight: 700; font-size: var(--t-sm); }
.in { width: 100%; min-height: var(--tap); border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); padding: 10px 14px; font-size: var(--t-md); }
textarea.in { min-height: 88px; resize: vertical; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.in[aria-invalid="true"] { border-color: var(--bad); }
.search { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); min-height: var(--tap); color: var(--ink-2); }
.search input { border: 0; background: transparent; min-height: 46px; outline: none; color: var(--ink); font-size: var(--t-md); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.sw { position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--line-2); flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 64px; padding: 12px 16px; border-top: 1px solid var(--line); }
.set:first-child { border-top: 0; }
.check { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; min-height: var(--tap); padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; }
.check .bx { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; }
.check[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.check[aria-checked="true"] .bx { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check[aria-checked="true"] .bx svg path { stroke-dasharray: 30; animation: draw .35s ease-out both; }
.check[aria-checked="true"] span:last-child { text-decoration: line-through; color: var(--ink-2); }
@keyframes draw { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }

/* ---------- görev kartı: çalışana düşen tek iş, tek ana düğme ---------- */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 18px; display: grid; gap: 14px; box-shadow: var(--lift); }
.task.working { border-color: var(--accent-line); }
.task.blocked { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.task-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.task h3 { font-size: var(--t-xl); line-height: 1.2; font-weight: 800; letter-spacing: -.015em; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: var(--t-sm); font-weight: 600; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.timer { font-size: var(--t-3xl); font-weight: 800; letter-spacing: -.02em; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; padding: 4px 0; }
.issue { background: var(--bad-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; font-size: var(--t-sm); }
.issue b { color: var(--bad); }
.note { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: var(--t-sm); display: grid; gap: 2px; }
.note.warn { background: var(--warn-soft); }

/* öneri kartı: sistem bir şey önerir, tek dokunuşla uygulanır, geri alınabilir */
.tip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--accent-line); background: linear-gradient(135deg, var(--accent-soft), var(--surface) 75%); }
.tip .acts { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.tip .acts .btn { min-height: 40px; padding: 6px 14px; font-size: var(--t-sm); box-shadow: none; }

/* iş satırı */
.job { display: grid; gap: 8px; width: 100%; padding: 14px 16px; border-top: 1px solid var(--line); text-align: left; }
.job:first-child { border-top: 0; }
.job:active { background: var(--surface-2); }
.job-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.job-h .t { font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
.job-h .no { font-size: var(--t-xs); color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.job .s { font-size: var(--t-sm); color: var(--ink-2); }
.job .st { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.job .pct { margin-left: auto; font-size: var(--t-sm); font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* aşama zaman çizelgesi */
.steps { display: grid; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.step:last-child { padding-bottom: 0; }
.step::before { content: ""; position: absolute; left: calc(1rem - 1px); top: 2rem; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--ok); }
.step .n { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 800; background: var(--surface); color: var(--ink-2); z-index: 1; }
.step.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now .n { border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.blk .n { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
.step.skip { opacity: .5; }
.step .b { font-weight: 700; }
.step .branch { margin-left: 2.75rem; margin-top: -4px; padding-bottom: 12px; font-size: var(--t-sm); color: var(--ink-2); }

/* ---------- alt menü ---------- */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 56px; font-size: var(--t-xs); font-weight: 650; color: var(--ink-2); }
.tab .pip { position: relative; width: 3.5rem; height: 1.875rem; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tab[aria-current="page"] { color: var(--accent-ink); font-weight: 800; }
.tab[aria-current="page"] .pip { background: var(--accent-soft); color: var(--accent); }
.tab .badge { position: absolute; top: -4px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .6875rem; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--surface); }
.tab.plus .pip { width: 3.375rem; height: 3.375rem; margin-top: -1.5rem; border-radius: 18px; background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 38%, transparent); }
.tab.plus .pip svg.i { width: 1.6rem; height: 1.6rem; stroke-width: 2.4; }

/* ---------- alttan pencere ve iletişim kutusu ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease-out; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; animation: up .36s var(--ease); box-shadow: 0 -12px 36px rgba(0,0,0,.16); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto; }
.sheet-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-h h2 { font-size: var(--t-xl); font-weight: 800; letter-spacing: -.015em; }
.x { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; background: var(--sunk); flex: none; }
.dialog .sheet { border-radius: var(--r-sheet); margin: 16px; width: calc(100% - 32px); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* bildirim: geri al ile */
.toasts { position: fixed; z-index: 70; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; padding: 0 16px; pointer-events: none; }
.toast { pointer-events: auto; width: 100%; max-width: 528px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border-radius: var(--r-lg); background: var(--ink); color: var(--surface); box-shadow: 0 14px 34px rgba(0,0,0,.25); animation: rise .32s var(--ease); }
.toast b { display: block; font-weight: 750; }
.toast span { font-size: var(--t-sm); opacity: .85; }
.toast .undo { min-height: 40px; padding: 0 14px; border-radius: 12px; color: var(--surface); font-weight: 800; border: 1px solid color-mix(in srgb, var(--surface) 40%, transparent); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.offline { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: var(--t-sm); font-weight: 600; }

/* ekrana giriş: yalnız ekran değişince */
.enter > * { animation: rise .42s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .04s; } .enter > *:nth-child(3) { animation-delay: .08s; } .enter > *:nth-child(4) { animation-delay: .12s; } .enter > *:nth-child(n+5) { animation-delay: .16s; }

/* sohbet */
.thread { display: grid; gap: 10px; padding-bottom: 8px; }
.msg { display: grid; gap: 3px; max-width: 84%; justify-items: start; }
.msg.me { justify-self: end; justify-items: end; }
.bub { padding: 10px 14px; border-radius: 20px 20px 20px 6px; background: var(--surface); border: 1px solid var(--line); line-height: 1.45; overflow-wrap: anywhere; }
.msg.me .bub { background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-radius: 20px 20px 6px 20px; }
.msg .who { font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); padding: 0 4px; }
.msg .at { font-size: var(--t-xs); color: var(--ink-3); padding: 0 4px; }
.sys { justify-self: center; font-size: var(--t-xs); font-weight: 650; color: var(--ink-2); background: var(--sunk); padding: 5px 12px; border-radius: 999px; text-align: center; max-width: 92%; }
.composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--lift); }
.composer .in { border-radius: 999px; min-height: 46px; background: var(--surface-2); }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.quick .chip { white-space: nowrap; min-height: 36px; }

/* akıllı ekleme */
.smart { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--line); }
.parsed { display: flex; flex-wrap: wrap; gap: 6px; }
.parsed .chip { min-height: 34px; font-size: var(--t-xs); background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.parsed .chip.miss { background: var(--surface); border-style: dashed; color: var(--ink-2); }

/* akış tasarlayıcısı */
.fstep { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.fstep .k { width: 2rem; height: 2rem; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: var(--t-xs); }
.fstep.dec .k { background: var(--warn-soft); color: var(--warn); }
.fbranch { margin-left: 1.5rem; padding-left: 14px; border-left: 2px dashed var(--line-2); display: grid; gap: 8px; }
.ibtn { width: 2.75rem; height: 2.75rem; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); }
.ibtn:disabled { opacity: .35; }

/* müşteri takip sayfası önizlemesi */
.public { border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
.public .ph { padding: 16px; background: var(--accent); color: var(--on-accent); display: grid; gap: 4px; }
.public .pb { padding: 16px; display: grid; gap: 12px; background: var(--surface); }
.sig { width: 100%; height: 160px; border-radius: var(--r); border: 1px dashed var(--line-2); background: var(--surface-2); touch-action: none; display: block; }

function toFlow(m) {
  const groups = [];
  m.steps.forEach((s, i) => { if (s.par && i && groups.length && m.steps[i - 1].kind !== "decision" && s.kind !== "decision") groups.at(-1).push(s); else groups.push([s]); });
  const stages = [];
  groups.forEach((g, gi) => {
    const nxt = groups[gi + 1] || [];
    for (const s of g) {
      const st = { key: s.key, name: s.name, kind: s.kind, assign: s.assign, next: s.kind === "decision" ? [] : nxt.map(x => x.key), checklist: s.checklist || [], photoRequired: !!s.photo,
        signatureRequired: s.kind === "delivery", slaMinutes: s.sla ? s.sla * 60 : undefined, timerMinutes: s.kind === "timer" ? (s.timer || 12) * 60 : undefined, publicName: s.pub || s.name, messageTemplate: s.kind === "notify" ? "asama_bilgi" : undefined };
      if (s.kind === "decision") st.branches = [{ id: "evet", label: s.yes || "Uygun", to: nxt[0]?.key || s.key }, { id: "hayir", label: s.no || "Uygun değil", to: s.back || m.steps[0].key }];
      stages.push(st);
    }
  });
  return { id: m.id, version: m.version || 1, name: m.name, icon: m.icon || "flow", stages, start: groups[0] ? groups[0].map(s => s.key) : [], fields: m.fields || [], rules: m.rules || [], prefs: { notifyCustomer: true, customerCanSee: true, allowSendBack: true }, hidden: !!m.hidden, model: m };
}
function modelErrors(m) {
  const e = [];
  if (!m.name.trim()) e.push("Akışa bir ad ver.");
  if (!m.steps.length) e.push("En az bir aşama ekle.");
  m.steps.forEach((s, i) => {
    if (!s.name.trim()) e.push(`${i + 1}. aşamanın adı boş.`);
    if (s.kind === "decision" && i === m.steps.length - 1) e.push(`"${s.name || "Karar"}" son aşama olamaz; evet dalı bir sonrakine gider.`);
    if (s.kind === "decision" && m.steps[i + 1]?.par) e.push(`"${s.name}" kararından sonra aynı anda yürüyen aşama olamaz.`);
    if (s.kind === "decision" && s.back && m.steps.findIndex(x => x.key === s.back) >= i) e.push(`"${s.name}": hayır dalı yalnızca önceki bir aşamaya dönebilir.`);
    if (!s.assign || (s.assign.mode === "dept" && !s.assign.dept)) e.push(`"${s.name}" için kimin yapacağını seç.`);
  });
  if (!e.length) e.push(...WF.validateFlow(toFlow(m)));
  return e;
}

/* ---------- motor bağlantısı ---------- */
function resolver(st, job) {
  const a = st.assign || {};
  if (a.mode === "person" && a.person) return { owner: a.person, crew: [a.person] };
  if (a.mode === "creator") return { owner: job.createdBy, crew: [job.createdBy] };
  const pool = S.people.filter(p => (p.depts || []).includes(a.dept) && p.joined !== false);
  const pick = pool.sort((x, y) => loadOf(x.id) - loadOf(y.id))[0] || S.people.find(p => home(p.id) === "foreman") || S.people.find(p => home(p.id) === "boss");
  return pick ? { owner: pick.id, crew: [pick.id] } : { owner: null, crew: [] };
}
const ctx = (by = S.me) => ({ now: Date.now(), by, resolve: resolver });
const flowOf = j => S.flows[j.flowId];
const jobById = id => S.jobs.find(j => j.id === id);
const stageDef = (j, k) => flowOf(j).stages.find(s => s.key === k);

function threadFor(job) {
  let t = S.threads.find(x => x.kind === "job" && x.jobId === job.id);
  if (!t) { t = { id: "t" + job.id, kind: "job", jobId: job.id, msgs: [], read: {} }; S.threads.push(t); }
  return t;
}
const sysMsg = (job, text, at = Date.now()) => threadFor(job).msgs.push({ id: uid(), by: "system", at, kind: "sys", text });
function notify(to, text, jobId, kind = "mine") { S.notices.unshift({ id: uid(), to, text, jobId, at: Date.now(), read: false, kind }); S.notices.length = Math.min(S.notices.length, 150); }

function onEvents(events, job) {
  const f = flowOf(job);
  for (const e of events) {
    const st = e.stageKey ? f.stages.find(s => s.key === e.stageKey) : null;
    if (e.type === "stage.ready" && e.owner) { notify(e.owner, `${job.title}: ${st.name} sana düştü`, job.id); if (job.flowId !== "_task") sysMsg(job, `${st.name} başladı · ${first(e.owner)} bilgilendirildi`); }
    if (e.type === "stage.completed" && e.by !== "system" && job.flowId !== "_task") sysMsg(job, `${first(e.by)} ${st.name} aşamasını bitirdi${e.choice ? ` · ${st.branches.find(b => b.id === e.choice).label}` : ""}`);
    if (e.type === "stage.blocked") { for (const p of S.people.filter(x => isMgr(x.id))) notify(p.id, `${job.title}: sorun · ${e.issue}`, job.id, "issues"); sysMsg(job, `Sorun bildirildi: ${e.issue}`); }
    if (e.type === "job.completed") { notify(job.createdBy, `${job.title} tamamlandı`, job.id, "done"); if (job.flowId !== "_task") sysMsg(job, "İş tamamlandı"); }
    if (e.type === "message.requested") sysMsg(job, `Müşteriye WhatsApp mesajı gitti: "${job.title} · ${st ? st.publicName || st.name : "durum"}" (deneme)`);
    if (e.type === "invoice.requested") sysMsg(job, "Fatura taslağı hazırlandı; e-Fatura bağlanınca otomatik kesilir");
    if (e.type === "payment.requested") sysMsg(job, "Tahsilat bekleniyor; ödeme linki müşteriye gönderilebilir");
    if (e.type === "notify") notify(e.to.startsWith("role:") ? S.people.find(p => home(p.id) === "boss")?.id : e.to, e.text, job.id);
  }
  if (S.offline) S.queue.push(...events.map(e => ({ type: e.type, jobId: job.id, at: e.at })));
}

/* her değişiklik: anlık görüntü → uygula → geri alınabilir bildirim */
let undoSnap = null;
function snapshot() { return JSON.stringify({ jobs: S.jobs, notices: S.notices, threads: S.threads, queue: S.queue, nextNo: S.nextNo, people: S.people }); }
function act(fn, msg, opts = {}) {
  const snap = snapshot();
  try {
    const out = fn();
    save();
    undoSnap = opts.noUndo ? null : snap;
    render();
    if (msg) toast(typeof msg === "function" ? msg(out) : msg, opts.sub ? (typeof opts.sub === "function" ? opts.sub(out) : opts.sub) : "", !opts.noUndo);
    return out;
  } catch (e) {
    toast("Olmadı", e && e.message ? e.message : String(e), false, true);
    return null;
  }
}
function undo() { if (!undoSnap) return; Object.assign(S, JSON.parse(undoSnap)); undoSnap = null; save(); render(); toast("Geri alındı", "", false); }

function commit(r) {
  const i = S.jobs.findIndex(j => j.id === r.job.id);
  if (i >= 0) S.jobs[i] = r.job; else S.jobs.unshift(r.job);
  onEvents(r.events, r.job);
  return r.job;
}
const cmd = {
  create(flowId, input) {
    const f = S.flows[flowId];
    const j = commit(WF.createJob(f, { id: uid(), businessId: "local", number: S.nextNo++, ...input }, ctx()));
    if (j.flowId !== "_task") sysMsg(j, `${first(S.me)} işi açtı`);
    return j;
  },
  task({ title, who, due, note, steps, urgent }) {
    return who.map(w => {
      const data = {}; if (note) data.not = note; if (steps?.length) data.adimlar = steps.join("\n");
      const r = WF.createJob(S.flows._task, { id: uid(), businessId: "local", number: S.nextNo++, title, due, data, urgent: !!urgent }, { ...ctx(), resolve: () => ({ owner: w, crew: [w] }) });
      r.job.stages.gorev.checks = (steps || []).map(() => false);
      return commit(r);
    });
  },
  start: (id, k) => commit(WF.startStage(jobById(id), flowOf(jobById(id)), k, ctx())),
  done: (id, k, o = {}) => commit(WF.completeStage(jobById(id), flowOf(jobById(id)), k, ctx(), o)),
  check(id, k, i) { const j = WF.toggleCheck(jobById(id), k, i); S.jobs[S.jobs.findIndex(x => x.id === id)] = j; return j; },
  photo(id, k) { const j = WF.addPhoto(jobById(id), k); S.jobs[S.jobs.findIndex(x => x.id === id)] = j; return j; },

  back: (id, from, to, note) => commit(WF.sendBack(jobById(id), flowOf(jobById(id)), from, to, note, ctx())),
  hold: (id, why) => commit(WF.holdJob(jobById(id), why, ctx())),
  resume: id => commit(WF.resumeJob(jobById(id), ctx())),
  cancel: (id, why) => commit(WF.cancelJob(jobById(id), why, ctx())),
  reassign(id, k, to) {
    const j = jobById(id), r = j.stages[k], from = r.owner;
    r.owner = to; r.crew = [to]; j.log.push({ at: Date.now(), by: S.me, text: `${stageDef(j, k).name}: ${first(from)} → ${first(to)}` , stageKey: k });
    notify(to, `${j.title}: ${stageDef(j, k).name} sana verildi`, id); if (j.flowId !== "_task") sysMsg(j, `${first(S.me)} ${stageDef(j, k).name} aşamasını ${first(to)}'a verdi`);
    return j;
  },
  tick() {
    let changed = false;
    for (const j of S.jobs) if (j.status === "open") for (const s of WF.activeStages(j, flowOf(j))) {
      const r = j.stages[s.key];
      if (s.kind === "timer" && r.status === "working" && (r.dueAt || Infinity) <= Date.now()) { commit(WF.fireTimer(j, flowOf(j), s.key, ctx("system"))); changed = true; }
    }
    if (changed) { save(); render(); }
  },
};

function myWork(id = S.me) {
  const out = [];
  for (const j of S.jobs) if (j.status === "open") for (const s of WF.activeStages(j, flowOf(j))) {

}

/* ---------- akıllı ekleme: tek cümleden görev ya da iş ----------
   "Murat yarın 10'da Kaya İnşaat'a numune götürsün, acil"
   → kime: Murat · ne zaman: yarın 10:00 · müşteri: Kaya İnşaat · acil · başlık: Kaya İnşaat'a numune götürsün */
const WEEK = ["pazar", "pazartesi", "sali", "carsamba", "persembe", "cuma", "cumartesi"];
function parseSmart(text) {
  const raw = text.trim(), n = " " + trn(raw) + " ", cut = [];
  const out = { who: [], dueDay: null, hour: null, minute: 0, urgent: false, customer: null, flowId: null, title: "" };
  for (const p of S.people) {
    const f = trn(p.name.split(" ")[0]);
    const re = new RegExp(`(^|[\\s,])(${f})(['’]?[a-zçğıöşü]{0,4})?(?=[\\s,.!]|$)`, "i");
    const m = n.match(re); if (m && p.id !== S.me) { out.who.push(p.id); cut.push(m[2] + (m[3] || "")); }
  }
  if (/\bacil\b/.test(n)) { out.urgent = true; cut.push("acil"); }
  const rel = [[/\bbugun\b/, 0, "bugun"], [/\byarin\b/, 1, "yarin"], [/\b(obur|ertesi) gun\b/, 2, null], [/\bhaftaya\b/, 7, "haftaya"]];
  for (const [re, d] of rel) { const m = n.match(re); if (m) { out.dueDay = d; cut.push(m[0]); break; } }
  if (out.dueDay == null) { const m = n.match(/\b(\d{1,2}) gun (sonra|icinde)\b/); if (m) { out.dueDay = +m[1]; cut.push(m[0]); } }
  if (out.dueDay == null) WEEK.forEach((w, i) => { if (out.dueDay == null) { const m = n.match(new RegExp(`\\b${w}(ye|ya|a|e|gunu)?\\b`)); if (m) { out.dueDay = ((i - new Date().getDay() + 7) % 7) || 7; cut.push(m[0]); } } });
  if (/\bbu hafta\b/.test(n) && out.dueDay == null) { out.dueDay = Math.max(1, 5 - new Date().getDay()); cut.push("bu hafta"); }
  let m = n.match(/\b(\d{1,2})[:.](\d{2})(['’]?(da|de|ta|te))?\b/);
  if (m && +m[1] < 24) { out.hour = +m[1]; out.minute = +m[2]; cut.push(m[0]); }
  else { m = n.match(/\b(saat )?(\d{1,2})['’]?(da|de|ta|te)\b/); if (m && +m[2] < 24) { out.hour = +m[2]; cut.push(m[0]); } }
  for (const c of S.customers) { const k = trn(c.name.split(" ")[0]); if (k.length >= 3 && n.includes(" " + k)) { out.customer = c; break; } }
  const flowHints = [["servis", /\b(klima|montaj|servis|kombi|tamir|bakim)\b/], ["metal", /\b(kapi|korkuluk|konstruksiyon|imalat|uretim|profil|flans|sac)\b/]];
  for (const [id, re] of flowHints) if (S.flows[id] && re.test(n)) { out.flowId = id; break; }
  // başlık: çıkarılan parçalar silinir, ilk harf büyür
  let t = " " + raw + " ";
  for (const c of cut) { const re = new RegExp(`(^|[\\s,])${c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/i/g, "[iıİI]").replace(/u/g, "[uü]").replace(/o/g, "[oö]").replace(/c/g, "[cç]").replace(/s/g, "[sş]").replace(/g/g, "[gğ]")}(?=[\\s,.!]|$)`, "i"); t = t.replace(re, "$1"); }
  t = t.replace(/\s+/g, " ").replace(/^[\s,.-]+|[\s,.-]+$/g, "").replace(/\s+,/g, ",");
  out.title = t ? t.charAt(0).toLocaleUpperCase("tr-TR") + t.slice(1) : "";
  out.due = out.dueDay == null && out.hour == null ? null : atHour(out.dueDay ?? 0, out.hour ?? 17, out.minute);
  out.kind = out.flowId && out.customer ? "job" : "task";
  return out;
}

/* ---------- öneriler: sistem sorunu görür, çözümü önerir, tek dokunuşla uygular ---------- */
function suggestions() {
  const out = [], seen = new Set(S.dismissed || []);
  // 1) yük dengesi: aynı departmanda biri dolu, biri boş
  const workers = S.people.filter(p => !isMgr(p.id) && p.joined !== false);
  for (const busy of workers) {
    const mine = myWork(busy.id).filter(x => x.r.status === "ready" && !isTask(x.j));
    if (loadOf(busy.id) < 2 || !mine.length) continue;
    for (const x of mine) {
      const dept = x.s.assign?.dept;
      const idle = workers.find(p => p.id !== busy.id && (p.depts || []).includes(dept) && loadOf(p.id) === 0);
      if (!idle) continue;
      const id = `load:${x.j.id}:${x.s.key}:${idle.id}`;
      if (!seen.has(id)) out.push({ id, tone: "acc", ic: "users", title: `${first(busy.id)}'in önünde ${loadOf(busy.id)} iş var, ${first(idle.id)} boşta`, body: `${x.s.name} · ${x.j.title} işini ${first(idle.id)}'a verirsen ${dayLabel(x.j.due)} termini rahatlar.`, apply: { label: `${first(idle.id)}'a ver`, do: () => cmd.reassign(x.j.id, x.s.key, idle.id), msg: `${x.s.name} ${first(idle.id)}'a verildi` } });
      break;
    }
  }
  // 2) termin riski: termin 24 saat içinde ya da geçmiş, ilerleme düşük
  for (const j of openJobs()) {
    if (isTask(j) || j.status !== "open") continue;
    const pct = WF.progress(j), left = j.due - Date.now();
    if ((left < DAY && pct < 70) || left < 0) {
      const id = `risk:${j.id}`;
      if (seen.has(id) || j.urgent) continue;
      out.push({ id, tone: "bad", ic: "alert", title: left < 0 ? `${j.title} termini geçti` : `${j.title} termine yetişmeyebilir`, body: `İş %${pct} bitti, termin ${when(j.due)}. Acil işaretlersen ekibin listesinde en üste çıkar.`,
        apply: { label: "Acil işaretle", do: () => { j.urgent = true; j.log.push({ at: Date.now(), by: S.me, text: "Acil işaretlendi" }); active(j).forEach(s => j.stages[s.key].owner && notify(j.stages[s.key].owner, `${j.title} acil işaretlendi`, j.id)); }, msg: "Acil işaretlendi" },
        alt: { label: "Müşteriye haber ver", do: () => sysMsg(j, `Müşteriye mesaj gitti: "${j.title} için yeni tahmini teslim ${dayLabel(j.due + 2 * DAY)}" (deneme)`), msg: "Müşteriye haber verildi" } });
    }
  }
  // 3) bekleyen onay: 2 saatten uzun
  for (const j of openJobs()) for (const s of waitingApproval(j)) {
    const r = j.stages[s.key], id = `wait:${j.id}:${s.key}:${r.visits}`;
    if (seen.has(id) || Date.now() - (r.readyAt || 0) < 2 * HOUR || r.owner === S.me) continue;
    out.push({ id, tone: "warn", ic: "clock", title: `${s.name} ${Math.round((Date.now() - r.readyAt) / HOUR)} saattir bekliyor`, body: `${j.title} · onay ${first(r.owner)}'da.`, apply: { label: `${first(r.owner)}'a hatırlat`, do: () => notify(r.owner, `Hatırlatma: ${j.title} · ${s.name} onayını bekliyor`, j.id), msg: `${first(r.owner)}'a hatırlatıldı` } });
  }
  return out.slice(0, 3);
}

function viewReports() {
  const done = S.jobs.filter(j => j.status === "done" && !isTask(j)), onTime = done.filter(j => Math.max(...Object.values(j.stages).map(r => r.doneAt || 0)) <= j.due).length;

  for (const j of S.jobs) if (!isTask(j)) for (const s of flowOf(j).stages) { const r = j.stages[s.key]; if (r.status === "done" && r.startedAt && r.doneAt && s.kind !== "timer" && s.kind !== "notify") { const x = (stats[s.name] ??= { n: 0, h: 0, sla: s.slaMinutes ? s.slaMinutes / 60 : null }); x.n++; x.h += (r.doneAt - r.startedAt) / HOUR; } }
  const rows = Object.entries(stats).map(([n, x]) => ({ n, avg: x.h / x.n, sla: x.sla })).sort((a, b) => b.avg - a.avg).slice(0, 6), max = Math.max(1, ...rows.map(r => Math.max(r.avg, r.sla || 0)));

let sheetReturn = null;
function openSheet(id, html, opts = {}) {
  sheetReturn = document.activeElement;
  R.sheet = id;
  const root = $("#sheets");
  root.innerHTML = `<div class="scrim ${opts.dialog ? "dialog" : ""}" data-a="scrim"><div class="sheet" role="${opts.dialog ? "alertdialog" : "dialog"}" aria-modal="true" aria-labelledby="sh-t" tabindex="-1">
    ${opts.dialog ? "" : '<div class="grab" aria-hidden="true"></div>'}
    <div class="sheet-h"><div>${opts.eyebrow ? `<p class="eyebrow">${opts.eyebrow}</p>` : ""}<h2 id="sh-t">${opts.title}</h2>${opts.sub ? `<p class="small muted" style="margin-top:4px">${opts.sub}</p>` : ""}</div><button class="x" data-a="close" aria-label="Kapat">${ic("x")}</button></div>
    ${html}</div></div>`;
  const sh = $(".sheet", root);
  setTimeout(() => { const f = opts.focus ? $(opts.focus, sh) : sh; (f || sh).focus(); }, 30);
}
function closeSheet() { R.sheet = null; $("#sheets").innerHTML = ""; if (sheetReturn && document.contains(sheetReturn)) sheetReturn.focus(); sheetReturn = null; }
function trapFocus(e) {
  const sh = $("#sheets .sheet"); if (!sh || e.key !== "Tab") return;
  const f = $$('button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])', sh).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
}

function switchTab(t) { R.tab = t; R.stack = []; R.focusNext = true; render(); scrollTop(); }

    case "quickreply": { const i = $("#msg-in"); i.value = d.v; i.focus(); return; }
    case "dm": case "dm-foreman": { closeSheet(); const other = a === "dm" ? d.id : S.people.find(p => home(p.id) === "foreman")?.id || S.people.find(p => home(p.id) === "boss").id;
      let t = S.threads.find(x => x.kind === "dm" && x.members.includes(S.me) && x.members.includes(other)); if (!t) { t = { id: "dm" + uid(), kind: "dm", members: [S.me, other], msgs: [], read: {} }; S.threads.push(t); save(); }
      return go("thread", { id: t.id }); }
    // ayarlar
    case "pref": S.prefs[d.k] = d.v; save(); render(); { const el = $(`[data-a="pref"][data-k="${d.k}"][data-v="${d.v}"]`); if (el) el.focus(); } return;
    case "pref-sw": { const k = d.k; if (k === "contrast") S.prefs.contrast = S.prefs.contrast === "high" ? "normal" : "high"; else if (k === "motion") S.prefs.motion = S.prefs.motion === "off" ? "on" : "off"; else S.prefs[k] = !S.prefs[k]; save(); render(); const el = $(`[data-a="pref-sw"][data-k="${k}"]`); if (el) el.focus(); return; }
    case "notif-sw": S.prefs.notify[d.k] = !S.prefs.notify[d.k]; save(); render(); { const el = $(`[data-a="notif-sw"][data-k="${d.k}"]`); if (el) el.focus(); } return;
    // akış tasarlayıcısı
    case "flows": S.setup.flow = true; save(); return go("flows");
    case "editflow": FE = JSON.parse(JSON.stringify(S.flows[d.id].model)); FE.version = S.flows[d.id].version; return go("flowedit");
    case "newflow": FE = { id: "f" + uid().slice(-5), name: "", steps: [], fields: [], _new: true }; return go("flowedit");
    case "fe-move": { const i = +d.i, j2 = i + +d.d; [FE.steps[i], FE.steps[j2]] = [FE.steps[j2], FE.steps[i]]; if (FE.steps[0]) FE.steps[0].par = false; FE._checked = FE._checked; FE._sim = null; render(); const el = $(`[data-a="fe-move"][data-i="${j2}"][data-d="${d.d}"]`) || $(`[data-a="fe-edit"][data-i="${j2}"]`); el?.focus(); return; }
    case "fe-edit": return sheetStepEdit(+d.i);
    case "fe-add": FE.steps.push({ key: "s" + uid().slice(-5), name: "", kind: "task", assign: { mode: "dept", dept: "uretim" } }); FE._sim = null; render(); return sheetStepEdit(FE.steps.length - 1);
    case "st-sw": b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"); return;
    case "st-del": FE.steps.splice(+d.i, 1); FE._sim = null; closeSheet(); render(); toast("Aşama silindi", "", false); return;
    case "fe-check": FE._checked = true; render(); $('[role="status"]', $("#main"))?.scrollIntoView({ block: "center" }); return;
    case "fe-sim": { FE._checked = true; const errs = modelErrors(FE); if (errs.length) { render(); return; } FE._sim = simulate(FE); render(); return; }
    case "fe-save": { FE._checked = true; const errs = modelErrors(FE); if (errs.length) { render(); toast("Kaydedilmedi", `${errs.length} şey düzeltilmeli`, false, true); return; }
      const old = S.flows[FE.id], m = JSON.parse(JSON.stringify(FE)); delete m._checked; delete m._sim; delete m._new; m.version = (old?.version || 0) + 1;
      S.flows[FE.id] = toFlow(m); save(); goBack(); toast(old ? `Sürüm ${m.version} kaydedildi` : "Akış oluşturuldu", "Yeni işler bu sürümle açılacak", false); return; }
  }
});
function syncJf() { if (!R.jf) return; R.jf.cust = $("#jf-cust")?.value ?? R.jf.cust; R.jf.title = $("#jf-title")?.value ?? R.jf.title; R.jf.qty = $("#jf-qty")?.value ?? R.jf.qty; R.jf.amount = $("#jf-amount")?.value ?? R.jf.amount; $$("[data-jf-field]").forEach(i => { R.jf.data[i.dataset.jfField] = i.value; }); }
function simulate(m) {
  const f = toFlow(JSON.parse(JSON.stringify(m))), path = [];
  let r = WF.createJob(f, { id: "sim", businessId: "x", number: 0, title: "Deneme", due: Date.now() + 9 * DAY, data: Object.fromEntries(f.fields.map(x => [x.key, x.options ? x.options[0] : "deneme"])) }, { now: Date.now(), by: S.me, resolve: resolver });
  for (let guard = 0; guard < 40 && r.job.status === "open"; guard++) {
    const s = WF.activeStages(r.job, f)[0]; if (!s) break;
    const run = r.job.stages[s.key]; run.checks = run.checks.map(() => true); run.photos = 1;
    path.push(`${s.name} · ${first(run.owner) || "sahibi yok"}${WF.activeStages(r.job, f).length > 1 ? ` (aynı anda: ${WF.activeStages(r.job, f).slice(1).map(x => x.name).join(", ")})` : ""}`);
    r = WF.completeStage(r.job, f, s.key, { now: Date.now(), by: S.me, resolve: resolver }, s.kind === "decision" ? { choice: "evet" } : {});
  }
  path.push(r.job.status === "done" ? "İş tamamlanır" : "Akış bir yerde takıldı");
  return { path, choice: "evet" };
}

/* ---------- formlar ---------- */
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === "send") { const i = $("#msg-in"), v = i.value.trim(); if (!v) { i.focus(); return; } const t = S.threads.find(x => x.id === f.dataset.id); t.msgs.push({ id: uid(), by: S.me, at: Date.now(), kind: "text", text: v });
    for (const p of S.people) if (p.id !== S.me && trn(v).includes("@" + trn(first(p.id)))) notify(p.id, `${first(S.me)} seni andı: ${v.slice(0, 60)}`, t.jobId, "chat");
    if (S.offline) S.queue.push({ type: "message", at: Date.now() }); save(); render(); $("#msg-in")?.focus(); const s = $("#screen"); if (s) s.scrollTop = s.scrollHeight; window.scrollTo(0, document.body.scrollHeight); return; }
  if (k === "smart") { const p = parseSmart($("#sm-in").value);
    if (!p.title || (p.kind === "task" && !p.who.length)) { $("#sm-in").focus(); return; }
    closeSheet();
    if (p.kind === "job") { const c = p.customer; return act(() => { const j = cmd.create(p.flowId, { title: p.title, customerName: c.name, customerId: c.id, due: p.due || atHour(3), urgent: p.urgent }); S.setup.job = true; return j; }, "İş emri açıldı", { sub: j => `#${j.number} · ilk aşama ${first(active(j)[0] ? j.stages[active(j)[0].key].owner : S.me)}'a düştü` }); }
    return act(() => cmd.task({ title: p.title, who: p.who, due: p.due || atHour(0), urgent: p.urgent }), p.who.length > 1 ? `${p.who.length} kişiye görev verildi` : "Görev verildi", { sub: `${p.who.map(first).join(", ")} · ${when(p.due || atHour(0))}` }); }
  if (k === "task") { const t = $("#tf-title").value.trim(), st = R.tf, err = $("#tf-err");
    if (!t) { err.textContent = "Ne yapılacağını yaz."; $("#tf-title").setAttribute("aria-invalid", "true"); $("#tf-title").focus(); return; }
    if (!st.who.length) { err.textContent = "Görevi kime vereceğini seç."; $('[data-a="tf-who"]').focus(); return; }
    const due = atHour(st.day, +$("#tf-hour").value), steps = $("#tf-steps").value.split("\n").map(x => x.trim()).filter(Boolean), note = $("#tf-note").value.trim();
    closeSheet(); return act(() => cmd.task({ title: t, who: st.who, due, note, steps, urgent: st.urgent }), st.who.length > 1 ? `${st.who.length} kişiye görev verildi` : "Görev verildi", { sub: `${st.who.map(first).join(", ")} · ${when(due)}` }); }
  if (k === "job") { syncJf(); const st = R.jf, err = $("#jf-err"), f2 = S.flows[st.flow];
    const miss = [!st.cust.trim() && ["#jf-cust", "Müşteriyi yaz."], !st.title.trim() && ["#jf-title", "İşin adını yaz."], ...f2.fields.filter(x => x.requiredAt === "create" && !String(st.data[x.key] || "").trim()).map(x => [`#jf-f-${x.key}`, `${x.label} gerekli.`])].filter(Boolean);
    $$(".sheet .in").forEach(i => i.removeAttribute("aria-invalid"));
    if (miss.length) { err.textContent = miss.map(m => m[1]).join(" "); miss.forEach(m => $(m[0])?.setAttribute("aria-invalid", "true")); $(miss[0][0])?.focus(); return; }
    let c = S.customers.find(x => trn(x.name) === trn(st.cust)); if (!c) { c = { id: "c" + uid(), name: st.cust.trim() }; S.customers.push(c); }
    closeSheet();
    return act(() => { const j = cmd.create(st.flow, { title: st.title.trim(), customerName: c.name, customerId: c.id, due: atHour(st.day), qty: Number(st.qty) || 1, urgent: st.urgent, amount: st.amount ? WF.tl(Number(String(st.amount).replace(/\./g, "").replace(",", "."))) : 0, data: Object.fromEntries(Object.entries(st.data).filter(([, v]) => v !== "")) }); S.setup.job = true; return j; },
      "İş emri açıldı", { sub: j => `#${j.number} · ilk aşama ${first(active(j)[0] ? j.stages[active(j)[0].key].owner : S.me)}'a düştü` }); }
  if (k === "issue") { if (!R.issue.type) { $("#is-err").textContent = "Sorunun türünü seç."; $('[data-a="issue-type"]').focus(); return; }
    const [id, sk] = splitK(R.issue.k), note = $("#is-note").value.trim(); closeSheet(); return act(() => cmd.issue(id, sk, R.issue.type, note), "Sorun bildirildi", { sub: "Ustabaşı ve patron bilgilendirildi" }); }
  if (k === "person") { const n = $("#ap-name").value.trim(), ph = $("#ap-phone").value.trim(), err = $("#ap-err");
    if (!n) { err.textContent = "Ad soyad gerekli."; $("#ap-name").focus(); return; } if (ph.replace(/\D/g, "").length < 10) { err.textContent = "Davet için 10 haneli telefon gerekli."; $("#ap-phone").focus(); return; }
    const g = $("#ap-grp").value, dept = $("#ap-dept").value; closeSheet(); return act(() => { S.people.push({ id: "p" + uid(), name: n, phone: ph, title: DEPTS[dept] || "Çalışan", group: g, depts: [dept], joined: false }); S.setup.team = true; }, `${n} davet edildi`, { sub: `Davet linki ${ph} numarasına gider (prototipte gönderilmez)` }); }
  if (k === "customer") { const n = $("#cu-name").value.trim(); if (!n) { $("#cu-err").textContent = "Müşterinin adını yaz."; $("#cu-name").focus(); return; } closeSheet(); return act(() => S.customers.push({ id: "c" + uid(), name: n, phone: $("#cu-phone").value.trim() }), "Müşteri eklendi"); }
  if (k === "setup") { const me = $("#su-me").value.trim(), biz = $("#su-biz").value.trim(), sec = R.setup?.sector;
    const err = !me ? ["#su-me", "Adını yaz."] : !biz ? ["#su-biz", "İşletmenin adını yaz."] : !sec ? ['[data-a="sector"]', "Ne iş yaptığınızı seç."] : null;
    if (err) { $("#su-err").textContent = err[1]; $(err[0]).focus(); return; }
    seedNew({ me, biz, sector: sec, method: R.login }); save(); R.login = null; R.tab = "today"; R.stack = []; R.focusNext = true; render(); toast(`${biz} hazır`, "Başlarken listesinden devam edebilirsin", false); return; }
  if (k === "step") { const i = +f.dataset.i, s = FE.steps[i];
    s.name = $("#st-name").value.trim() || s.name; s.kind = $("#st-kind").value; const own = $("#st-own").value;
    s.assign = own.startsWith("d:") ? { mode: "dept", dept: own.slice(2) } : { mode: own };
    if ($("#st-yes")) { s.yes = $("#st-yes").value.trim(); s.no = $("#st-no").value.trim(); s.back = $("#st-back").value || FE.steps[0].key; }
    if (s.kind === "decision" && !s.back) s.back = FE.steps[0].key;
    if ($("#st-timer")) s.timer = +$("#st-timer").value || 12;
    s.checklist = $("#st-check").value.split("\n").map(x => x.trim()).filter(Boolean); s.sla = +$("#st-sla").value || undefined;
    s.photo = $('[data-k="photo"]', f).getAttribute("aria-checked") === "true"; const par = $('[data-k="par"]', f); s.par = par ? par.getAttribute("aria-checked") === "true" : false;
    if (!s.name) { $("#st-name").setAttribute("aria-invalid", "true"); $("#st-name").focus(); return; }
    FE._sim = null; closeSheet(); render(); $(`[data-a="fe-edit"][data-i="${i}"]`)?.focus(); return; }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { R.q = t.value; const jl = $("#jl"); if (jl) { const html = viewJobs(); const tmp = document.createElement("div"); tmp.innerHTML = html; jl.innerHTML = $("#jl", tmp).innerHTML; $$(".chips [data-stay]").forEach((c, i) => { const x = $$(".chips [data-stay]", tmp)[i]; if (x) c.innerHTML = x.innerHTML; }); } return; }
  if (t.id === "sm-in") { $("#sm-out").innerHTML = smartPreview(t.value); return; }
  if (t.id === "fe-name") { FE.name = t.value; return; }
  if (t.id === "su-me" || t.id === "su-biz") { R.setup = { ...(R.setup || {}), me: $("#su-me").value, biz: $("#su-biz").value }; return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "who") { S.me = t.value; save(); R.tab = "today"; R.stack = []; R.focusNext = true; closeSheet(); render(); scrollTop(); toast(`${person(S.me).name} gözüyle`, groupOf(S.me).name, false); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && R.sheet) { e.preventDefault(); closeSheet(); return; }
  trapFocus(e);
});
$("#net").addEventListener("click", () => {
  S.offline = !S.offline;
  if (!S.offline && S.queue.length) { const n = S.queue.length; S.queue = []; toast("Bağlantı geldi", `${n} değişiklik gönderildi`, false); } else if (S.offline) toast("İnternet yok", "Çalışmaya devam et; değişiklikler sıraya girer", false);
  save(); render();
});
$("#reset").addEventListener("click", () => { closeSheet(); seedDemo(); save(); R.tab = "today"; R.stack = []; R.focusNext = true; render(); toast("Örnek işletme baştan kuruldu", "", false); });

/* ---------- saat, sayaç, zamanlayıcı ---------- */
setInterval(() => { $$("[data-timer]").forEach(el => { el.textContent = clock(+el.dataset.timer); }); }, 1000);
setInterval(() => { const t = $("#sbTime"); if (t) t.textContent = hm(Date.now()); if (S.phase === "app") cmd.tick(); }, 30000);

document.documentElement.lang = "tr";
load();
if (S.phase === "app" && !S.people.length) S = fresh();
R.focusNext = false;
render();
{ const t = $("#sbTime"); if (t) t.textContent = hm(Date.now()); }
