<title>Halloldu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column centered on a quiet ground; sticky header, filter chips, task list, bottom tab bar; sheets slide up for compose / share / assignee view */
:root {
  --ground: #eef1ec;
  --surface: #ffffff;
  --surface-2: #f5f7f3;
  --ink: #18211c;
  --ink-2: #56625a;
  --line: #dde3dc;
  --accent: #157a55;
  --accent-soft: #dcefe5;
  --late: #c8372d;
  --late-soft: #fbe3e0;
  --today: #b26b00;
  --today-soft: #fbefd6;
  --wa: #1f8f4e;
  --wa-bubble: #d9fdd3;
  --wa-ground: #efe7dc;
  --shadow: 0 1px 2px #18211c14, 0 4px 14px #18211c0d;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1411; --surface: #171e1a; --surface-2: #1d2621; --ink: #e8efe9; --ink-2: #9aa8a0; --line: #2a352f;
    --accent: #3fc18b; --accent-soft: #173527; --late: #ff7a6e; --late-soft: #3a1c19; --today: #f0b64a; --today-soft: #3a2c12;
    --wa: #3fc174; --wa-bubble: #144d37; --wa-ground: #0c1512; --shadow: 0 1px 2px #0006, 0 4px 14px #0004; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f1411; --surface: #171e1a; --surface-2: #1d2621; --ink: #e8efe9; --ink-2: #9aa8a0; --line: #2a352f;
  --accent: #3fc18b; --accent-soft: #173527; --late: #ff7a6e; --late-soft: #3a1c19; --today: #f0b64a; --today-soft: #3a2c12;
  --wa: #3fc174; --wa-bubble: #144d37; --wa-ground: #0c1512; --shadow: 0 1px 2px #0006, 0 4px 14px #0004; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  background: var(--surface-2);
  display: flex; flex-direction: column;
  padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));
}
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* header */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 14px 12px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.65rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--surface); font-style: normal; font-size: 1rem; }
.who { font-size: .82rem; color: var(--ink-2); text-align: right; }
.who b { color: var(--ink); display: block; font-weight: 600; }
.summary { margin-top: 10px; font-size: .92rem; color: var(--ink-2); }
.summary b { color: var(--ink); }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .86rem; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

/* list */
main { flex: 1; padding-block: 8px 20px; display: flex; flex-direction: column; gap: 18px; }
.group h3 { margin: 0 0 8px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--surface); border-radius: 14px; padding: 12px 12px 12px 14px; box-shadow: var(--shadow);
  border-left: 4px solid transparent;
}
.card.late { border-left-color: var(--late); }
.card.today { border-left-color: var(--today); }
.card.done .t { text-decoration: line-through; color: var(--ink-2); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .95rem; color: #fff; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: .8rem; color: var(--ink-2); }
.pill { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.today { background: var(--today-soft); color: var(--today); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.seen { background: var(--surface-2); color: var(--ink-2); }
.check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 1rem; color: transparent; }
.card.done .check { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.demo-link { font-size: .78rem; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
.photo-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; margin-top: 6px; display: block; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 12px; }
.example-note { font-size: .78rem; color: var(--ink-2); text-align: center; }
.example-note button { color: var(--accent); font-weight: 600; text-decoration: underline; padding: 0; font-size: inherit; }

/* team & templates */
.panel { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 14px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.tpl { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.tpl:last-child { border-bottom: 0; }
.tpl .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.3rem; }
.sm { font-size: .8rem; color: var(--ink-2); }
.btn { padding: 10px 16px; border-radius: 12px; font-weight: 700; background: var(--accent); color: var(--surface); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.wa { background: var(--wa); color: #fff; }
.btn.block { width: 100%; padding-block: 14px; font-size: 1rem; }
.section-title { font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin: 4px 0 0; }

/* compose bar */
.fab {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(448px, calc(100% - 32px));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
  background: var(--ink); color: var(--surface); border-radius: 18px; box-shadow: 0 8px 24px #0003;
  text-align: left;
}
.fab span { flex: 1; opacity: .8; }
.fab b { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; font-size: 1.2rem; color: #fff; }

/* tabs */
nav.tabs {
  position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab { padding-block: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--ink-2); }
.tab .i { font-size: 1.25rem; line-height: 1; }
.tab[aria-selected="true"] { color: var(--accent); }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: #0a100c80; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding-top: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .25s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-family: var(--display); font-size: 1.35rem; margin: 0 0 4px; }
.sheet .stack { display: flex; flex-direction: column; gap: 12px; }
.say { display: flex; gap: 8px; align-items: stretch; }
.say input { flex: 1; min-width: 0; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); }
.mic { width: 52px; border-radius: 14px; background: var(--accent-soft); font-size: 1.3rem; }
.mic.on { background: var(--late-soft); }
.ex { display: flex; flex-wrap: wrap; gap: 6px; }
.ex button { font-size: .8rem; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; }
.parsed { border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; }
.field label { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--accent); }
.field input, .field select { width: 100%; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.when-row { display: flex; gap: 8px; }
.when-row > * { flex: 1; min-width: 0; }
.notice { font-size: .8rem; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }

/* whatsapp mock */
.wa-chat { background: var(--wa-ground); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.wa-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.bubble { align-self: flex-end; max-width: 88%; background: var(--wa-bubble); border-radius: 12px 12px 2px 12px; padding: 8px 10px 6px; font-size: .9rem; box-shadow: 0 1px 1px #0001; overflow-wrap: anywhere; }
.bubble a { color: #1a73c9; text-decoration: underline; cursor: pointer; }
.bubble small { display: block; text-align: right; font-size: .68rem; color: var(--ink-2); margin-top: 2px; }

/* assignee (no-app) view */
.browser { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.url { background: var(--surface-2); font-size: .78rem; color: var(--ink-2); padding: 8px 12px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.guest { padding: 18px 16px; display: grid; gap: 14px; }
.guest .from { font-size: .85rem; color: var(--ink-2); }
.guest .task { font-family: var(--display); font-size: 1.5rem; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.guest .due { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.upload { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 12px; font-weight: 600; cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
.install { font-size: .8rem; color: var(--ink-2); text-align: center; }
.big-done { font-size: 1.15rem; padding-block: 16px; }

/* toast */
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  top: calc(12px + env(safe-area-inset-top, 0px));
  width: min(448px, calc(100% - 32px));
  background: var(--ink); color: var(--surface); border-radius: 14px; padding: 12px 14px;
  display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px #0004; animation: drop .3s ease-out;
}
@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }
.toast b { display: block; }
.toast .sm { color: inherit; opacity: .75; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

<div class="app">
  <header class="gut">
    <div class="brand">
      <div class="logo"><i>✓</i>Halloldu</div>
      <div class="who"><b>Usta Kerem</b>Kerem Tadilat · 5 kişi</div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="chips" id="chips" role="toolbar" aria-label="Filtre"></div>
  </header>

  <main class="gut" id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Yeni iş ver"><span>🎙️ “Ahmet yarın 10'da müşteriyi arasın”</span><b>＋</b></button>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="isler" aria-selected="true"><span class="i">☰</span>İşler</button>
  <button class="tab" role="tab" data-tab="ekip" aria-selected="false"><span class="i">👥</span>Ekip</button>
  <button class="tab" role="tab" data-tab="sablon" aria-selected="false"><span class="i">⧉</span>Şablonlar</button>
</nav>

<div id="layer"></div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lower = s => s.toLocaleLowerCase("tr");
  const capFirst = s => s ? s.charAt(0).toLocaleUpperCase("tr") + s.slice(1) : s;
  const DAY = 86400000;
  const lastV = n => { const m = lower(n).match(/[aeıioöuü](?=[^aeıioöuü]*$)/); return m ? m[0] : "e"; };
  const endsV = n => /[aeıioöuü]$/.test(lower(n));
  const dat = n => n + "'" + (endsV(n) ? "y" : "") + (/[aıou]/.test(lastV(n)) ? "a" : "e");
  const gen = n => { const v = lastV(n), h = /[aı]/.test(v) ? "ı" : /[ou]/.test(v) ? "u" : /[öü]/.test(v) ? "ü" : "i"; return n + "'" + (endsV(n) ? "n" : "") + h + "n"; };
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const DAYS_TR = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const MONTHS_TR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const pad = n => String(n).padStart(2, "0");
  const COLORS = ["#2f6fd6", "#c2410c", "#7c3aed", "#0f766e", "#be185d", "#4d7c0f", "#a16207"];

  function fmtDue(t) {
    if (!t.date) return "Tarih yok";
    const d = new Date(t.date), today = startOfDay(new Date()), diff = Math.round((startOfDay(d) - today) / DAY);
    let day = diff === 0 ? "Bugün" : diff === 1 ? "Yarın" : diff === -1 ? "Dün" :
      (diff > 1 && diff < 7) ? DAYS_TR[d.getDay()] : `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`;
    return t.hasTime ? `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}` : day;
  }
  function status(t) {
    if (t.done) return "done";
    if (!t.date) return "upcoming";
    const now = new Date(), d = new Date(t.date);
    const today = startOfDay(now).getTime(), day = startOfDay(d).getTime();
    if (t.hasTime ? d < now : day < today) return "late";
    if (day === today) return "today";
    return "upcoming";
  }
  const at = (dayOffset, h, m = 0) => { const d = startOfDay(new Date()); d.setDate(d.getDate() + dayOffset); if (h != null) d.setHours(h, m); return d.getTime(); };
  const code = () => Math.random().toString(36).slice(2, 6);

  // ---------- state ----------
  const SEED = () => ({
    me: "Kerem",
    team: [
      { name: "Ahmet", color: COLORS[0] }, { name: "Elif", color: COLORS[4] },
      { name: "Mehmet", color: COLORS[1] }, { name: "Ayşe", color: COLORS[2] }, { name: "Kerem", color: COLORS[3] },
    ],
    tasks: [
      { id: 1, who: "Ahmet", text: "Kadıköy'deki daireye boya malzemesi götür", date: at(-1, 15), hasTime: true, done: false, seen: true, code: "k4d9" },
      { id: 2, who: "Elif", text: "Haftalık malzeme faturalarını topla", date: at(0, 17), hasTime: true, done: false, seen: true, code: "e7f2" },
      { id: 3, who: "Mehmet", text: "Banyo fayanslarının ölçüsünü al", date: at(0), hasTime: false, done: false, seen: false, code: "m2p8" },
      { id: 4, who: "Ahmet", text: "Müşteri Selin Hanım'ı ara, keşif saatini ayarla", date: at(1, 10), hasTime: true, done: false, seen: false, code: "a9x1" },
      { id: 5, who: "Ayşe", text: "Yeni iş için teklif dosyasını hazırla", date: at(3), hasTime: false, done: false, seen: true, code: "y3q7" },
      { id: 6, who: "Elif", text: "Depodaki boş kutuları ayır", date: at(-1), hasTime: false, done: true, seen: true, doneAt: at(-1, 18), code: "e1z5" },
      { id: 7, who: "Mehmet", text: "Matkap uçlarını yenile", date: at(0, 9), hasTime: true, done: true, seen: true, doneAt: at(0, 9, 40), code: "m8r3" },
    ],
    nextId: 8,
  });
  let S;
  try { S = JSON.parse(localStorage.getItem("halloldu-v1")); } catch (e) {}
  if (!S || !S.tasks) S = SEED();
  const save = () => { try { localStorage.setItem("halloldu-v1", JSON.stringify(S)); } catch (e) {} };
  const person = n => S.team.find(p => p.name === n) || { name: n, color: COLORS[5] };
  const initials = n => n === S.me ? "Ben" : n.slice(0, 1).toLocaleUpperCase("tr");
  const avatar = n => `<div class="av" style="background:${person(n).color}" aria-hidden="true">${esc(initials(n))}</div>`;
  const displayName = n => n === S.me ? "Ben" : n;

  let tab = "isler", filter = "all";

  // ---------- render ----------
  function render() {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    $("#fab").hidden = tab !== "isler";
    const counts = { late: 0, today: 0, upcoming: 0, done: 0 };
    S.tasks.forEach(t => counts[status(t)]++);
    $("#summary").innerHTML = counts.late
      ? `<b style="color:var(--late)">${counts.late} iş gecikti</b> · bugün ${counts.today} iş var`
      : `Gecikmiş iş yok 👏 · bugün <b>${counts.today}</b> iş var`;
    const chipDefs = [["all", "Tümü", S.tasks.length - counts.done, ""], ["late", "Geciken", counts.late, "var(--late)"],
      ["today", "Bugün", counts.today, "var(--today)"], ["upcoming", "Yaklaşan", counts.upcoming, "var(--ink-2)"], ["done", "Halloldu", counts.done, "var(--accent)"]];
    $("#chips").hidden = tab !== "isler";
    $("#chips").innerHTML = chipDefs.map(([k, l, n, c]) =>
      `<button class="chip" data-filter="${k}" aria-pressed="${filter === k}">${c ? `<span class="dot" style="background:${c}"></span>` : ""}${l} <span class="n">${n}</span></button>`).join("");
    if (tab === "isler") renderTasks(); else if (tab === "ekip") renderTeam(); else renderTemplates();
  }

  function card(t) {
    const st = status(t);
    const pill = st === "late" ? `<span class="pill late">Gecikti</span>` : st === "today" ? `<span class="pill today">Bugün</span>` :
      st === "done" ? `<span class="pill done">Halloldu</span>` : "";
    const seen = !t.done && t.who !== S.me ? (t.seen ? `<span>👁 Gördü</span>` : `<span>✓ Gönderildi</span>`) : "";
    const doneTxt = t.done && t.doneAt ? `<span>✅ ${esc(displayName(t.who))} · ${fmtDue({ date: t.doneAt, hasTime: true })}</span>` : "";
    return `<div class="card ${st}">
      ${avatar(t.who)}
      <div style="min-width:0">
        <div class="t">${esc(t.text)}</div>
        <div class="meta"><span>${esc(displayName(t.who))}</span><span>🕑 ${esc(fmtDue(t))}</span>${pill}${seen}${doneTxt}</div>
        ${t.photo ? `<img class="photo-thumb" src="${t.photo}" alt="Tamamlanan iş fotoğrafı">` : ""}
        ${!t.done && t.who !== S.me ? `<button class="demo-link" data-guest="${t.id}">${esc(gen(t.who))} gördüğü ekranı aç</button>` : ""}
      </div>
      <button class="check" data-toggle="${t.id}" aria-label="${t.done ? "Geri al" : "Halloldu olarak işaretle"}">✓</button>
    </div>`;
  }

  function renderTasks() {
    const groups = [["late", "Geciken", "var(--late)"], ["today", "Bugün", "var(--today)"], ["upcoming", "Yaklaşan", "var(--ink-2)"], ["done", "Halloldu", "var(--accent)"]];
    let html = "";
    groups.forEach(([k, label, c]) => {
      if (filter !== "all" && filter !== k) return;
      if (filter === "all" && k === "done") return;
      const list = S.tasks.filter(t => status(t) === k).sort((a, b) => k === "done" ? (b.doneAt || 0) - (a.doneAt || 0) : (a.date || 9e15) - (b.date || 9e15));
      if (!list.length) return;
      html += `<section class="group"><h3><span class="dot" style="background:${c}"></span>${label} · ${list.length}</h3><div class="cards">${list.map(card).join("")}</div></section>`;
    });
    if (filter === "all") {
      const d = S.tasks.filter(t => t.done).length;
      if (d) html += `<button class="chip" data-filter="done" style="align-self:center">✅ ${d} iş halloldu, göster</button>`;
    }
    if (!html) html = `<div class="empty">Burada iş yok.<br>Aşağıdan yeni bir iş ver.</div>`;
    html += `<p class="example-note">Örnek verilerle dolu bir prototip · <button id="reset">Başa döndür</button></p>`;
    $("#view").innerHTML = html;
  }

  function renderTeam() {
    const rows = S.team.map(p => {
      const mine = S.tasks.filter(t => t.who === p.name), done = mine.filter(t => t.done).length;
      const late = mine.filter(t => status(t) === "late").length, pct = mine.length ? Math.round(done / mine.length * 100) : 0;
      return `<div class="row">${avatar(p.name)}<div style="min-width:0"><b>${esc(displayName(p.name))}</b>
        <div class="sm">${mine.length - done} açık iş${late ? ` · <span style="color:var(--late);font-weight:600">${late} gecikmiş</span>` : ""}</div>
        <div class="bar"><i style="width:${pct}%"></i></div></div><div class="num">%${pct}</div></div>`;
    }).join("");
    $("#view").innerHTML = `<h2 class="section-title">Ekip</h2>
      <p class="sm" style="margin:0">Ekiptekilerin uygulamayı indirmesi gerekmez. İşler onlara WhatsApp linkiyle gider.</p>
      <div class="panel">${rows}</div>
      <button class="btn ghost block" id="invite">＋ Ekibe kişi ekle</button>`;
  }

  const TEMPLATES = [
    { ico: "🏪", name: "Dükkân açılış listesi", desc: "Her sabah tekrar eden 4 iş", items: ["Kepenkleri aç, ışıkları yak", "Kasayı say", "Vitrini düzenle", "Eksik malzeme listesini çıkar"] },
    { ico: "🧱", name: "Tadilat işi başlangıcı", desc: "Yeni şantiye için 5 iş", items: ["Keşif fotoğraflarını çek", "Malzeme listesini hazırla", "Müşteriye teklif gönder", "Ön ödemeyi al", "Ekibe iş takvimini bildir"] },
    { ico: "🏠", name: "Ev işleri haftası", desc: "Aile için 4 iş", items: ["Faturaları öde", "Market alışverişi", "Çamaşırları yıka", "Çöpleri çıkar"] },
    { ico: "📦", name: "Taşınma", desc: "Taşınma öncesi 5 iş", items: ["Nakliyeciyle gün ayarla", "Kolileri topla", "Elektrik ve su aboneliğini taşı", "Adres değişikliğini bildir", "Anahtarları teslim et"] },
  ];
  function renderTemplates() {
    $("#view").innerHTML = `<h2 class="section-title">Şablonlar</h2>
      <p class="sm" style="margin:0">Hazır listeyi tek dokunuşla bugünün işleri olarak ekle.</p>
      <div class="panel">${TEMPLATES.map((t, i) => `<div class="tpl"><div class="ico">${t.ico}</div>
        <div style="min-width:0"><b>${t.name}</b><div class="sm">${t.desc}</div></div>
        <button class="btn ghost" data-tpl="${i}">Ekle</button></div>`).join("")}</div>`;
  }

  // ---------- Turkish sentence parser ----------
  const WEEKDAYS = { pazartesi: 1, salı: 2, çarşamba: 3, perşembe: 4, cuma: 5, cumartesi: 6, pazar: 0 };
  function parse(input) {
    let s = " " + input.trim().replace(/\s+/g, " ") + " ";
    let l = lower(s);
    let dayOffset = null, hour = null, minute = 0;
    const cut = re => { const m = l.match(re); if (m) { s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); l = lower(s); } return m; };

    if (cut(/\s(öbür ?gün|ertesi gün)\s/)) dayOffset = 2;
    else if (cut(/\syarın(?:a)?\s/)) dayOffset = 1;
    else if (cut(/\sbugün\s/)) dayOffset = 0;
    else if (cut(/\s(haftaya|gelecek hafta)\s/)) dayOffset = 7;
    else {
      const m = cut(/\s(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar)(?:'?(?:ya kadar|ye kadar|ya|ye)|\sgünü|\sgün)?\s/);
      if (m) { const want = WEEKDAYS[m[1]], now = new Date().getDay(); dayOffset = ((want - now + 7) % 7) || 7; }
    }
    let part = null;
    const pm = cut(/\s(sabah|öğlen|öğleden sonra|akşam|gece)(?:\s?leyin)?\s/);
    if (pm) part = pm[1];
    let m = cut(/\s(?:saat\s*)?(\d{1,2})[:.](\d{2})(?:'?\s?(?:de|da|te|ta))?\s/) || cut(/\ssaat\s*(\d{1,2})(?:'?\s?(?:de|da|te|ta))?\s/) || cut(/\s(\d{1,2})'?(?:de|da|te|ta)\s/);
    if (m) { hour = +m[1]; minute = m[2] ? +m[2] : 0; }
    if (hour != null) {
      if (part && /öğleden|akşam|gece/.test(part) && hour < 12) hour += 12;
      else if (!part && hour >= 1 && hour < 8) hour += 12;
    } else if (part) hour = { "sabah": 9, "öğlen": 12, "öğleden sonra": 15, "akşam": 19, "gece": 22 }[part];

    // person = first word if it looks like a name
    let words = s.trim().split(" ").filter(Boolean), who = null;
    if (words.length) {
      const raw = words[0], base = raw.replace(/['’](?:[a-zçğıöşü]+)$/i, "");
      const known = S.team.find(p => lower(p.name) === lower(base));
      if (known) { who = known.name; words.shift(); }
      else if (/^[A-ZÇĞİÖŞÜ]/.test(raw) && words.length > 1 && !/^(ben|bana|biz)$/i.test(base)) { who = capFirst(lower(base)); words.shift(); }
      else if (/^(ben|bana)$/i.test(base)) { who = S.me; words.shift(); }
    }
    words = words.filter(w => !/^(söyle|de|ki|lütfen)$/i.test(w));
    // "arasın" -> "ara", "gitsin" -> "git"
    if (words.length) {
      const last = words[words.length - 1];
      const stripped = last.replace(/(s[ıiuü]n|s[ıiuü]nlar)$/i, "");
      if (stripped !== last && stripped.length >= 2) words[words.length - 1] = stripped;
    }
    let text = capFirst(words.join(" ").replace(/\s+([,.!?])/g, "$1").replace(/^[,.\s]+|[,.\s]+$/g, ""));

    let date = null, hasTime = hour != null;
    if (dayOffset != null || hasTime) {
      let off = dayOffset ?? 0;
      const d = startOfDay(new Date()); d.setDate(d.getDate() + off);
      if (hasTime) { d.setHours(hour, minute); if (dayOffset == null && d < new Date()) d.setDate(d.getDate() + 1); }
      date = d.getTime();
    }
    return { who: who || S.me, text, date, hasTime };
  }

  // ---------- sheets ----------
  const layer = $("#layer");
  function sheet(html, onMount) {
    layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet gut" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
    $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") close(); });
    onMount && onMount();
  }
  const close = () => { layer.innerHTML = ""; };

  const EXAMPLES = ["Ahmet yarın saat 10'da müşteriyi arasın", "Elif bugün 5'te faturaları yatırsın", "Mehmet cuma günü mutfak dolabını monte etsin", "Ayşe haftaya teklif dosyasını göndersin"];
  function openCompose(prefill = "") {
    sheet(`<div class="stack">
      <div><h2>Yeni iş ver</h2><div class="sm">Kime, ne, ne zaman, normal konuşur gibi yaz.</div></div>
      <div class="say">
        <input id="say" type="text" autocomplete="off" placeholder="Ör: Ahmet yarın 10'da müşteriyi arasın" value="${esc(prefill)}">
        <button class="mic" id="mic" aria-label="Sesle söyle">🎙️</button>
      </div>
      <div class="notice" id="micNote" hidden>Gerçek uygulamada mikrofona basıp Türkçe söylersin. Bu önizlemede mikrofon kapalı, cümleyi yaz ya da bir örneğe dokun.</div>
      <div class="ex">${EXAMPLES.map(e => `<button data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div>
      <div id="parsedBox"></div>
    </div>`, () => {
      const inp = $("#say");
      inp.addEventListener("input", showParsed);
      $("#mic").onclick = () => { $("#micNote").hidden = false; $("#mic").classList.add("on"); setTimeout(() => $("#mic") && $("#mic").classList.remove("on"), 600); };
      layer.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { inp.value = b.dataset.ex; showParsed(); });
      showParsed();
      setTimeout(() => inp.focus(), 50);
    });
  }
  function toLocalInput(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function showParsed() {
    const v = $("#say").value.trim(), box = $("#parsedBox");
    if (!v) { box.innerHTML = ""; return; }
    const p = parse(v);
    const names = [...new Set([...S.team.map(t => t.name), p.who])];
    box.innerHTML = `<div class="parsed">
      <div class="field"><label for="pWho">Kim</label><select id="pWho">${names.map(n => `<option value="${esc(n)}"${n === p.who ? " selected" : ""}>${esc(displayName(n))}${S.team.some(t => t.name === n) ? "" : " (yeni kişi)"}</option>`).join("")}</select></div>
      <div class="field"><label for="pText">Ne</label><input id="pText" value="${esc(p.text)}"></div>
      <div class="field"><label for="pDate">Ne zaman</label><div class="when-row">
        <input id="pDate" type="date" value="${p.date ? toLocalInput(p.date) : ""}">
        <input id="pTime" type="time" value="${p.hasTime ? `${pad(new Date(p.date).getHours())}:${pad(new Date(p.date).getMinutes())}` : ""}">
      </div></div>
    </div>
    <button class="btn block" id="give" style="margin-top:12px">İşi ver${p.who !== S.me ? ` ve ${esc(dat(p.who))} gönder` : ""}</button>`;
    $("#pWho").onchange = () => { const w = $("#pWho").value; $("#give").textContent = w === S.me ? "İşi ver" : `İşi ver ve ${dat(w)} gönder`; };
    $("#give").onclick = createFromForm;
  }
  function createFromForm() {
    const who = $("#pWho").value, text = $("#pText").value.trim();
    if (!text) { $("#pText").focus(); $("#pText").placeholder = "Yapılacak işi yaz"; return; }
    const dv = $("#pDate").value, tv = $("#pTime").value;
    let date = null, hasTime = false;
    if (dv) { const [y, mo, d] = dv.split("-").map(Number); const x = new Date(y, mo - 1, d); if (tv) { const [h, mi] = tv.split(":").map(Number); x.setHours(h, mi); hasTime = true; } date = x.getTime(); }
    else if (tv) { const [h, mi] = tv.split(":").map(Number); const x = new Date(); x.setHours(h, mi, 0, 0); date = x.getTime(); hasTime = true; }
    if (!S.team.some(p => p.name === who)) S.team.push({ name: who, color: COLORS[S.team.length % COLORS.length] });
    const t = { id: S.nextId++, who, text, date, hasTime, done: false, seen: false, code: code() };
    S.tasks.push(t); save(); filter = "all"; render();
    if (who === S.me) { close(); toast("📝", "İş listene eklendi", text); }
    else openShare(t);
  }

  function openShare(t) {
    const link = `halloldu.app/i/${t.code}`;
    const now = new Date();
    sheet(`<div class="stack">
      <div><h2>${esc(dat(t.who))} gönder</h2><div class="sm">${esc(t.who)} uygulamayı indirmeden linkten görür ve “Yaptım” der.</div></div>
      <div class="wa-chat">
        <div class="wa-head">${avatar(t.who)}<div>${esc(t.who)}<div class="sm" style="font-weight:400">WhatsApp</div></div></div>
        <div class="bubble">Merhaba ${esc(t.who)}, sana yeni bir iş var:<br><b>${esc(t.text)}</b><br>🕑 ${esc(fmtDue(t))}<br><br>İşi görmek ve “Yaptım” demek için:<br><a data-guest="${t.id}">${link}</a><small>${pad(now.getHours())}:${pad(now.getMinutes())} ✓✓</small></div>
      </div>
      <button class="btn wa block" data-guest="${t.id}">WhatsApp'ta gönder</button>
      <div class="notice">Prototipte mesaj gerçekten gönderilmez. Butona basınca ${esc(gen(t.who))} telefonunda göreceği ekran açılır.</div>
      <button class="btn ghost block" id="later">Şimdilik gönderme</button>
    </div>`, () => { $("#later").onclick = close; });
  }

  function openGuest(id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    t.seen = true; save(); render();
    let photo = null;
    sheet(`<div class="stack">
      <div class="sm" style="text-align:center">📱 ${esc(gen(t.who))} telefonu</div>
      <div class="browser">
        <div class="url">🔒 halloldu.app/i/${esc(t.code)}</div>
        <div class="guest">
          <div class="from"><b>Usta Kerem</b> sana bir iş verdi</div>
          <div class="task">${esc(t.text)}</div>
          <div class="due">🕑 ${esc(fmtDue(t))} ${status(t) === "late" ? `<span class="pill late">Gecikti</span>` : ""}</div>
          <label class="upload" for="photo"><span id="upIco">📷</span><span id="upTxt">Fotoğraf ekle (isteğe bağlı)</span><input id="photo" type="file" accept="image/*"></label>
          <button class="btn block big-done" id="did">Yaptım ✅</button>
          <div class="install">Uygulamayı indirmen gerekmez · <u>Halloldu'yu indir</u></div>
        </div>
      </div>
    </div>`, () => {
      $("#photo").onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas"), sc = 160 / Math.max(img.width, img.height);
            c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            photo = c.toDataURL("image/jpeg", .7);
            $("#upIco").innerHTML = `<img src="${photo}" alt="">`; $("#upTxt").textContent = "Fotoğraf eklendi";
          };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      };
      $("#did").onclick = () => {
        t.done = true; t.doneAt = Date.now(); if (photo) t.photo = photo; save();
        close(); render();
        setTimeout(() => toast("✅", `${t.who} işi halletti`, t.text + (photo ? " · fotoğraf ekledi" : "")), 250);
      };
    });
  }

  let toastT;
  function toast(ico, title, sub) {
    const old = document.querySelector(".toast"); if (old) old.remove();
    const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status");
    el.innerHTML = `<span style="font-size:1.4rem">${ico}</span><div style="min-width:0"><b>${esc(title)}</b><div class="sm">${esc(sub)}</div></div>`;
    document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3800);
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("button, a"); if (!el) return;
    if (el.dataset.tab) { tab = el.dataset.tab; render(); window.scrollTo(0, 0); }
    else if (el.dataset.filter) { filter = el.dataset.filter; render(); }
    else if (el.dataset.toggle) {
      const t = S.tasks.find(x => x.id === +el.dataset.toggle);
      t.done = !t.done; t.doneAt = t.done ? Date.now() : null; if (t.done) t.seen = true; save(); render();
      if (t.done) toast("✅", "Halloldu", t.text);
    }
    else if (el.dataset.guest) openGuest(+el.dataset.guest);
    else if (el.dataset.tpl) {
      const tp = TEMPLATES[+el.dataset.tpl];
      tp.items.forEach(text => S.tasks.push({ id: S.nextId++, who: S.me, text, date: at(0), hasTime: false, done: false, seen: true, code: code() }));
      save(); toast("⧉", `${tp.name} eklendi`, `${tp.items.length} iş bugünün listesinde`);
      tab = "isler"; filter = "today"; render();
    }
    else if (el.id === "fab") openCompose();
    else if (el.id === "reset") { S = SEED(); save(); filter = "all"; render(); toast("↺", "Örnek veriler geri yüklendi", "Prototip baştan başladı"); }
    else if (el.id === "invite") openCompose("");
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") close();
    if (e.key === "Enter" && e.target.id === "say" && $("#give")) $("#give").click();
  });

  render();
  setInterval(render, 60000);
})();
</script>
