<title>Halloldu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column centered on a quiet ground; sticky header, filter chips, task list, bottom tab bar; sheets slide up for compose / share / assignee view */
:root {
  --ground: #eef1ec;
  --surface: #ffffff;
  --surface-2: #f5f7f3;
  --ink: #18211c;
  --ink-2: #56625a;
  --line: #dde3dc;
  --accent: #157a55;
  --accent-soft: #dcefe5;
  --late: #c8372d;
  --late-soft: #fbe3e0;
  --today: #b26b00;
  --today-soft: #fbefd6;
  --wa: #1f8f4e;
  --wa-bubble: #d9fdd3;
  --wa-ground: #efe7dc;
  --shadow: 0 1px 2px #18211c14, 0 4px 14px #18211c0d;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1411; --surface: #171e1a; --surface-2: #1d2621; --ink: #e8efe9; --ink-2: #9aa8a0; --line: #2a352f;
    --accent: #3fc18b; --accent-soft: #173527; --late: #ff7a6e; --late-soft: #3a1c19; --today: #f0b64a; --today-soft: #3a2c12;
    --wa: #3fc174; --wa-bubble: #144d37; --wa-ground: #0c1512; --shadow: 0 1px 2px #0006, 0 4px 14px #0004; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f1411; --surface: #171e1a; --surface-2: #1d2621; --ink: #e8efe9; --ink-2: #9aa8a0; --line: #2a352f;
  --accent: #3fc18b; --accent-soft: #173527; --late: #ff7a6e; --late-soft: #3a1c19; --today: #f0b64a; --today-soft: #3a2c12;
  --wa: #3fc174; --wa-bubble: #144d37; --wa-ground: #0c1512; --shadow: 0 1px 2px #0006, 0 4px 14px #0004; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  background: var(--surface-2);
  display: flex; flex-direction: column;
  padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));
}
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* header */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 14px 12px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.65rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--surface); font-style: normal; font-size: 1rem; }
.who { font-size: .82rem; color: var(--ink-2); text-align: right; }
.who b { color: var(--ink); display: block; font-weight: 600; }
.summary { margin-top: 10px; font-size: .92rem; color: var(--ink-2); }
.summary b { color: var(--ink); }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: .86rem; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

/* list */
main { flex: 1; padding-block: 8px 20px; display: flex; flex-direction: column; gap: 18px; }
.group h3 { margin: 0 0 8px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--surface); border-radius: 14px; padding: 12px 12px 12px 14px; box-shadow: var(--shadow);
  border-left: 4px solid transparent;
}
.card.late { border-left-color: var(--late); }
.card.today { border-left-color: var(--today); }
.card.done .t { text-decoration: line-through; color: var(--ink-2); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .95rem; color: #fff; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: .8rem; color: var(--ink-2); }
.pill { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.today { background: var(--today-soft); color: var(--today); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.seen { background: var(--surface-2); color: var(--ink-2); }
.check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 1rem; color: transparent; }
.card.done .check { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.demo-link { font-size: .78rem; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
.photo-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; margin-top: 6px; display: block; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 12px; }
.example-note { font-size: .78rem; color: var(--ink-2); text-align: center; }
.example-note button { color: var(--accent); font-weight: 600; text-decoration: underline; padding: 0; font-size: inherit; }

/* team & templates */
.panel { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 14px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.tpl { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--line); }
.tpl:last-child { border-bottom: 0; }
.tpl .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.3rem; }
.sm { font-size: .8rem; color: var(--ink-2); }
.btn { padding: 10px 16px; border-radius: 12px; font-weight: 700; background: var(--accent); color: var(--surface); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.wa { background: var(--wa); color: #fff; }
.btn.block { width: 100%; padding-block: 14px; font-size: 1rem; }
.section-title { font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin: 4px 0 0; }

/* compose bar */
.fab {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(448px, calc(100% - 32px));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
  background: var(--ink); color: var(--surface); border-radius: 18px; box-shadow: 0 8px 24px #0003;
  text-align: left;
}
.fab span { flex: 1; opacity: .8; }
.fab b { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; font-size: 1.2rem; color: #fff; }

/* tabs */
nav.tabs {
  position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab { padding-block: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--ink-2); }
.tab .i { font-size: 1.25rem; line-height: 1; }
.tab[aria-selected="true"] { color: var(--accent); }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: #0a100c80; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding-top: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .25s ease-out;
}
.sheet.still { animation: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-family: var(--display); font-size: 1.35rem; margin: 0 0 4px; }
.sheet .stack { display: flex; flex-direction: column; gap: 12px; }
.say { display: flex; gap: 8px; align-items: stretch; }
.say input { flex: 1; min-width: 0; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); }
.mic { width: 52px; border-radius: 14px; background: var(--accent-soft); font-size: 1.3rem; }
.mic.on { background: var(--late-soft); }
.ex { display: flex; flex-wrap: wrap; gap: 6px; }
.ex button { font-size: .8rem; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; }
.parsed { border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; }
.field label { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--accent); }
.field input, .field select { width: 100%; min-width: 0; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.when-row { display: flex; gap: 8px; }
.when-row > * { flex: 1; min-width: 0; }
.notice { font-size: .8rem; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }

/* whatsapp mock */
.wa-chat { background: var(--wa-ground); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.wa-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.bubble { align-self: flex-end; max-width: 88%; background: var(--wa-bubble); border-radius: 12px 12px 2px 12px; padding: 8px 10px 6px; font-size: .9rem; box-shadow: 0 1px 1px #0001; overflow-wrap: anywhere; }
.bubble a { color: #1a73c9; text-decoration: underline; cursor: pointer; }
.bubble small { display: block; text-align: right; font-size: .68rem; color: var(--ink-2); margin-top: 2px; }

/* assignee (no-app) view */
.browser { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.url { background: var(--surface-2); font-size: .78rem; color: var(--ink-2); padding: 8px 12px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.guest { padding: 18px 16px; display: grid; gap: 14px; }
.guest .from { font-size: .85rem; color: var(--ink-2); }
.guest .task { font-family: var(--display); font-size: 1.5rem; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.guest .due { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.upload { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 12px; font-weight: 600; cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
.install { font-size: .8rem; color: var(--ink-2); text-align: center; }
.big-done { font-size: 1.15rem; padding-block: 16px; }

/* toast */
.flow-chips { padding-block: 4px 0; }
.alert { display: flex; gap: 10px; align-items: flex-start; background: var(--late-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .88rem; }
.alert b { color: var(--late); }
.alert.ok { background: var(--accent-soft); }
.alert.ok b { color: var(--accent); }
.board-wrap { overflow-x: auto; margin-inline: -4px; padding: 2px 4px 10px; scroll-snap-type: x proximity; }
.board { display: flex; gap: 10px; align-items: flex-start; width: max-content; }
.col { width: 216px; flex: none; background: var(--surface); border-radius: 14px; padding: 10px; scroll-snap-align: start; border: 1px solid var(--line); }
.col.jam { border-color: var(--late); box-shadow: inset 0 3px 0 var(--late); }
.col-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.col-h .av { width: 26px; height: 26px; font-size: .7rem; flex: none; }
.col-h b { flex: 1; min-width: 0; font-size: .9rem; line-height: 1.2; }
.col-h .num { font-size: .85rem; color: var(--ink-2); }
.col-h small { display: block; font-weight: 500; color: var(--ink-2); font-size: .72rem; }
.col-empty { font-size: .8rem; color: var(--ink-2); padding: 10px 4px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.job { display: block; width: 100%; text-align: left; background: var(--surface-2); border-radius: 10px; padding: 9px 10px; margin-top: 6px; border-left: 3px solid var(--line); }
.job.slow { border-left-color: var(--late); }
.job.mid { border-left-color: var(--today); }
.job b { display: block; font-size: .88rem; overflow-wrap: anywhere; }
.job .sm { display: flex; justify-content: space-between; gap: 6px; margin-top: 3px; }
.tag-appr { font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--today); background: var(--today-soft); padding: 1px 6px; border-radius: 6px; }
.flowtag { font-size: .74rem; color: var(--accent); font-weight: 600; }
.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .bul { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); border: 2px solid var(--line); position: relative; }
.step.done .bul { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.step.done::before { background: var(--accent); }
.step.cur .bul { background: var(--surface); border-color: var(--today); color: var(--today); }
.step.future { color: var(--ink-2); }
.step-h { font-weight: 700; padding-top: 3px; }
.step .sm { margin-top: 1px; }
.curbox { margin-top: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.ck { display: flex; gap: 10px; align-items: center; font-size: .92rem; cursor: pointer; }
.ck input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.btn.warn { background: var(--late-soft); color: var(--late); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.note-in { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.hist { font-size: .8rem; color: var(--ink-2); display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.newjob { display: grid; gap: 10px; }
.newjob input, .newjob select { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); }
.newjob label { font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ed-name { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 8px; }
.ed-name select, .ed-name input, .ed-row input, .ed-row select { width: 100%; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.ed-list { display: flex; flex-direction: column; gap: 10px; }
.ed-row { background: var(--surface-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.ed-top { display: grid; grid-template-columns: 26px minmax(0,1fr) 34px 34px 34px; gap: 6px; align-items: center; }
.ed-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.ed-b { height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; }
.ed-b.del { color: var(--late); }
.ed-b:disabled { opacity: .35; }
.ed-bot { display: grid; grid-template-columns: minmax(0,1fr) 96px; gap: 8px; }
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  top: calc(12px + env(safe-area-inset-top, 0px));
  width: min(448px, calc(100% - 32px));
  background: var(--ink); color: var(--surface); border-radius: 14px; padding: 12px 14px;
  display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px #0004; animation: drop .3s ease-out;
}
@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }
.toast b { display: block; }
.toast .sm { color: inherit; opacity: .75; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

<div class="app">
  <header class="gut">
    <div class="brand">
      <div class="logo"><i>✓</i>Halloldu</div>
      <div class="who" id="who"></div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="chips" id="chips" role="toolbar" aria-label="Filtre"></div>
  </header>

  <main class="gut" id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Yeni iş ver"><span>🎙️ “Ahmet yarın 10'da müşteriyi arasın”</span><b>＋</b></button>

  <button class="tab" role="tab" data-tab="isler" aria-selected="true"><span class="i">☰</span>İşler</button>
  <button class="tab" role="tab" data-tab="akis" aria-selected="false"><span class="i">⇢</span>Akışlar</button>
  <button class="tab" role="tab" data-tab="ekip" aria-selected="false"><span class="i">👥</span>Ekip</button>
  <button class="tab" role="tab" data-tab="sablon" aria-selected="false"><span class="i">⧉</span>Şablonlar</button>
</nav>

<script>
(() => {
  // ---------- helpers ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lower = s => s.toLocaleLowerCase("tr");
  const capFirst = s => s ? s.charAt(0).toLocaleUpperCase("tr") + s.slice(1) : s;
  const DAY = 86400000;
  const lastV = n => { const m = lower(n).match(/[aeıioöuü](?=[^aeıioöuü]*$)/); return m ? m[0] : "e"; };
  const endsV = n => /[aeıioöuü]$/.test(lower(n));
  const dat = n => n + "'" + (endsV(n) ? "y" : "") + (/[aıou]/.test(lastV(n)) ? "a" : "e");
  const gen = n => { const v = lastV(n), h = /[aı]/.test(v) ? "ı" : /[ou]/.test(v) ? "u" : /[öü]/.test(v) ? "ü" : "i"; return n + "'" + (endsV(n) ? "n" : "") + h + "n"; };
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const DAYS_TR = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const MONTHS_TR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const pad = n => String(n).padStart(2, "0");
  const COLORS = ["#2f6fd6", "#c2410c", "#7c3aed", "#0f766e", "#be185d", "#4d7c0f", "#a16207"];

  function fmtDue(t) {
    if (!t.date) return "Tarih yok";
    const d = new Date(t.date), today = startOfDay(new Date()), diff = Math.round((startOfDay(d) - today) / DAY);
    let day = diff === 0 ? "Bugün" : diff === 1 ? "Yarın" : diff === -1 ? "Dün" :

  // ---------- Turkish sentence parser ----------
  const WEEKDAYS = { pazartesi: 1, salı: 2, çarşamba: 3, perşembe: 4, cuma: 5, cumartesi: 6, pazar: 0 };
  function parse(input) {
    let s = " " + input.trim().replace(/\s+/g, " ") + " ";
    let l = lower(s);
    let dayOffset = null, hour = null, minute = 0;
    const cut = re => { const m = l.match(re); if (m) { s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); l = lower(s); } return m; };

    if (cut(/\s(öbür ?gün|ertesi gün)\s/)) dayOffset = 2;
    else if (cut(/\syarın(?:a)?\s/)) dayOffset = 1;
    else if (cut(/\sbugün\s/)) dayOffset = 0;
    else if (cut(/\s(haftaya|gelecek hafta)\s/)) dayOffset = 7;
    else {
      const m = cut(/\s(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar)(?:'?(?:ya kadar|ye kadar|ya|ye)|\sgünü|\sgün)?\s/);
      if (m) { const want = WEEKDAYS[m[1]], now = new Date().getDay(); dayOffset = ((want - now + 7) % 7) || 7; }
    }
    let part = null;
    const pm = cut(/\s(sabah|öğlen|öğleden sonra|akşam|gece)(?:\s?leyin)?\s/);
    if (pm) part = pm[1];
    let m = cut(/\s(?:saat\s*)?(\d{1,2})[:.](\d{2})(?:'?\s?(?:de|da|te|ta))?\s/) || cut(/\ssaat\s*(\d{1,2})(?:'?\s?(?:de|da|te|ta))?\s/) || cut(/\s(\d{1,2})'?(?:de|da|te|ta)\s/);
    if (m) { hour = +m[1]; minute = m[2] ? +m[2] : 0; }
    if (hour != null) {
      if (part && /öğleden|akşam|gece/.test(part) && hour < 12) hour += 12;
      else if (!part && hour >= 1 && hour < 8) hour += 12;
    } else if (part) hour = { "sabah": 9, "öğlen": 12, "öğleden sonra": 15, "akşam": 19, "gece": 22 }[part];

    // person = first word if it looks like a name
    let words = s.trim().split(" ").filter(Boolean), who = null;
    if (words.length) {
      const raw = words[0], base = raw.replace(/['’](?:[a-zçğıöşü]+)$/i, "");
      const known = S.team.find(p => lower(p.name) === lower(base));
      if (known) { who = known.name; words.shift(); }
      else if (/^[A-ZÇĞİÖŞÜ]/.test(raw) && words.length > 1 && !/^(ben|bana|biz)$/i.test(base)) { who = capFirst(lower(base)); words.shift(); }
      else if (/^(ben|bana)$/i.test(base)) { who = S.me; words.shift(); }
    }
    words = words.filter(w => !/^(söyle|de|ki|lütfen)$/i.test(w));
    // "arasın" -> "ara", "gitsin" -> "git"
    if (words.length) {
      const last = words[words.length - 1];
      const stripped = last.replace(/(s[ıiuü]n|s[ıiuü]nlar)$/i, "");
      if (stripped !== last && stripped.length >= 2) words[words.length - 1] = stripped;
    }
    let text = capFirst(words.join(" ").replace(/\s+([,.!?])/g, "$1").replace(/^[,.\s]+|[,.\s]+$/g, ""));

    let date = null, hasTime = hour != null;
    if (dayOffset != null || hasTime) {
      let off = dayOffset ?? 0;
      const d = startOfDay(new Date()); d.setDate(d.getDate() + off);
      if (hasTime) { d.setHours(hour, minute); if (dayOffset == null && d < new Date()) d.setDate(d.getDate() + 1); }
      date = d.getTime();
    }
    return { who: who || S.me, text, date, hasTime };
  }

    $("#pWho").onchange = () => { const w = $("#pWho").value; $("#give").textContent = w === S.me ? "İşi ver" : `İşi ver ve ${dat(w)} gönder`; };
    $("#give").onclick = createFromForm;
  }
  function createFromForm() {
    const who = $("#pWho").value, text = $("#pText").value.trim();
    if (!text) { $("#pText").focus(); $("#pText").placeholder = "Yapılacak işi yaz"; return; }
    const dv = $("#pDate").value, tv = $("#pTime").value;
    let date = null, hasTime = false;
    if (dv) { const [y, mo, d] = dv.split("-").map(Number); const x = new Date(y, mo - 1, d); if (tv) { const [h, mi] = tv.split(":").map(Number); x.setHours(h, mi); hasTime = true; } date = x.getTime(); }
    else if (tv) { const [h, mi] = tv.split(":").map(Number); const x = new Date(); x.setHours(h, mi, 0, 0); date = x.getTime(); hasTime = true; }
    if (!S.team.some(p => p.name === who)) S.team.push({ name: who, color: COLORS[S.team.length % COLORS.length] });
    const t = { id: S.nextId++, who, text, date, hasTime, done: false, seen: false, code: code() };
    S.tasks.push(t); save(); filter = "all"; render();
    if (who === S.me) { close(); toast("📝", "İş listene eklendi", text); }
    else openShare(t);
  }

  function openShare(t) {

    sheet(`<div class="stack">
      <div><h2>${esc(dat(t.who))} gönder</h2><div class="sm">${esc(t.who)} uygulamayı indirmeden linkten görür ve “Yaptım” der.</div></div>

  function openGuest(id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    t.seen = true; save(); render();
    let photo = null;
    sheet(`<div class="stack">
      <div class="sm" style="text-align:center">📱 ${esc(gen(t.who))} telefonu</div>
      <div class="browser">
        <div class="url">🔒 halloldu.app/i/${esc(t.code)}</div>
        <div class="guest">
          <div class="from"><b>Kerem (Patron)</b> sana bir iş verdi</div>
          <div class="task">${esc(t.text)}</div>
          <div class="due">🕑 ${esc(fmtDue(t))} ${status(t) === "late" ? `<span class="pill late">Gecikti</span>` : ""}</div>
          <label class="upload" for="photo"><span id="upIco">📷</span><span id="upTxt">Fotoğraf ekle (isteğe bağlı)</span><input id="photo" type="file" accept="image/*"></label>
          <button class="btn block big-done" id="did">Yaptım ✅</button>
          <div class="install">Uygulamayı indirmen gerekmez · <u>Halloldu'yu indir</u></div>
        </div>
      </div>
    </div>`, () => {
      $("#photo").onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas"), sc = 160 / Math.max(img.width, img.height);
            c.width = img.width * sc; c.height = img.height * sc; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            photo = c.toDataURL("image/jpeg", .7);
            $("#upIco").innerHTML = `<img src="${photo}" alt="">`; $("#upTxt").textContent = "Fotoğraf eklendi";
          };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      };
      $("#did").onclick = () => {
        t.done = true; t.doneAt = Date.now(); if (photo) t.photo = photo; save();
        close();
        const moved = onTaskDone(t, true); render();
        if (!moved) setTimeout(() => toast("✅", `${t.who} işi halletti`, t.text + (photo ? " · fotoğraf ekledi" : "")), 250);
      };
    });
  }

  let toastT;
  function toast(ico, title, sub) {
    const old = document.querySelector(".toast"); if (old) old.remove();
    const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status");
    el.innerHTML = `<span style="font-size:1.4rem">${ico}</span><div style="min-width:0"><b>${esc(title)}</b><div class="sm">${esc(sub)}</div></div>`;
    document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3800);
  }

  // ---------- workflows ----------
  const flowById = id => S.flows.find(f => f.id === id);
  const jobById = id => S.jobs.find(j => j.id === id);
  const flowOf = jobId => { const j = jobById(jobId); if (!j) return ""; const f = flowById(j.flowId); return f ? `${f.name} · ${j.title}` : j.title; };
  const ownerLabel = n => { const p = S.team.find(x => x.name === n); return p && p.dept ? `${displayName(n)} · ${p.dept}` : displayName(n); };
  function dueBadge(j) {
    if (!j.due || j.done) return j.urgent && !j.done ? `<span class="pill late">Acil</span>` : "";
    const d = Math.round((j.due - startOfDay(new Date()).getTime()) / DAY);
    const txt = d < 0 ? `Termin ${-d} gün geçti` : d === 0 ? "Termin bugün" : `Termin ${d} gün`;
    const cls = d < 0 ? "late" : d <= 3 ? "today" : "seen";
    return `${j.urgent ? `<span class="pill late">Acil</span> ` : ""}<span class="pill ${cls}">${txt}</span>`;
  }
  const daysIn = j => Math.floor((Date.now() - j.stageAt) / DAY);
  const ago = d => d <= 0 ? "bugün" : d === 1 ? "1 gündür" : `${d} gündür`;

  function stageTask(j, idx) { return S.tasks.find(t => t.jobId === j.id && t.stageIdx === idx && !t.done); }
  function makeStageTask(j, idx, prefix = "") {
    const st = flowById(j.flowId).stages[idx];
    const t = { id: S.nextId++, who: st.owner, text: `${prefix}${j.title} · ${st.name}`, date: startOfDay(new Date()).getTime() + (st.type === "approval" ? 1 : 2) * DAY, hasTime: false,
      done: false, seen: st.owner === S.me, code: code(), jobId: j.id, stageIdx: idx };
    S.tasks.push(t); return t;
  }
  function advance(j, by) {
    const f = flowById(j.flowId), cur = f.stages[j.stage];
    const open = stageTask(j, j.stage); if (open) { open.done = true; open.doneAt = Date.now(); }
    j.history.push({ stage: j.stage, by: by || cur.owner, at: Date.now(), act: cur.type === "approval" ? "approved" : "done" });
    if (j.stage + 1 >= f.stages.length) {
      j.done = true; j.doneAt = Date.now(); save();
      toast("🏁", `${j.title} tamamlandı`, `${f.name} akışının tüm aşamaları bitti`);
      return;
    }
    j.stage++; j.stageAt = Date.now();
    const nx = f.stages[j.stage]; j.checks[j.stage] = nx.checklist.map(() => false);
    makeStageTask(j, j.stage); save();
    toast("⇢", `${nx.name} aşamasına geçti`, `${j.title} · ${nx.owner === S.me ? "sıra sende" : dat(nx.owner) + " iletildi"}${nx.type === "approval" ? " (onay bekliyor)" : ""}`);
  }
  function sendBack(j, note) {
    const f = flowById(j.flowId);
    const open = stageTask(j, j.stage); if (open) { open.done = true; open.doneAt = Date.now(); }
    j.history.push({ stage: j.stage, by: f.stages[j.stage].owner, at: Date.now(), act: "back", note });
    j.stage = Math.max(0, j.stage - 1); j.stageAt = Date.now();
    const pv = f.stages[j.stage]; j.checks[j.stage] = pv.checklist.map(() => false);
    const t = makeStageTask(j, j.stage, "Düzelt: "); if (note) t.text += ` (${note})`;
    save(); toast("↩", `${pv.name} aşamasına geri gönderildi`, `${dat(pv.owner)} bildirildi${note ? ": " + note : ""}`);
  }
  // When the stage owner marks the linked task done (in the app or from the WhatsApp link), the job moves on by itself.
  function onTaskDone(t) {
    if (!t.jobId) return false;
    const j = jobById(t.jobId); if (!j || j.done || j.stage !== t.stageIdx) return false;
    const st = flowById(j.flowId).stages[j.stage]; if (st.type !== "task") return false;
    j.checks[j.stage] = st.checklist.map(() => true);
    advance(j, t.who); return true;
  }

  function renderFlows() {
    if (!flowById(curFlow)) curFlow = S.flows[0].id;
    const f = flowById(curFlow), active = S.jobs.filter(j => j.flowId === f.id && !j.done), finished = S.jobs.filter(j => j.flowId === f.id && j.done);
    const chips = S.flows.map(x => `<button class="chip" data-flow="${x.id}" aria-pressed="${x.id === f.id}">${x.ico} ${esc(x.name)} <span class="n">${S.jobs.filter(j => j.flowId === x.id && !j.done).length}</span></button>`).join("");
    // bottleneck: stage whose jobs have waited longest in total
    let jam = -1, worst = 0;
    f.stages.forEach((st, i) => { const w = active.filter(j => j.stage === i).reduce((a, j) => a + daysIn(j), 0); if (w > worst) { worst = w; jam = i; } });
    const jamJobs = jam >= 0 ? active.filter(j => j.stage === jam) : [];
    const alert = jam >= 0 && worst >= 3
      ? `<div class="alert"><span>⚠️</span><div><b>Tıkanma: ${esc(f.stages[jam].name)}</b><br>${jamJobs.length} iş burada bekliyor, en eskisi ${Math.max(...jamJobs.map(daysIn))} gündür. Sorumlu: ${esc(displayName(f.stages[jam].owner))}.</div></div>`
      : `<div class="alert ok"><span>✅</span><div><b>Akış rahat</b><br>Hiçbir aşamada uzun bekleyen iş yok.</div></div>`;
    const cols = f.stages.map((st, i) => {
      const js = active.filter(j => j.stage === i).sort((a, b) => a.stageAt - b.stageAt);
      return `<div class="col${i === jam && worst >= 3 ? " jam" : ""}">
        <div class="col-h">${avatar(st.owner)}<b>${esc(st.name)}<small>${esc(ownerLabel(st.owner))}${st.type === "approval" ? ` · <span class="tag-appr">Onay</span>` : ""}</small></b><span class="num">${js.length}</span></div>
        ${js.length ? js.map(j => { const d = daysIn(j), ck = j.checks[i] || [], n = ck.filter(Boolean).length;
          return `<button class="job ${d >= 3 ? "slow" : d >= 2 ? "mid" : ""}" data-job="${j.id}"><b>${esc(j.title)}</b><span class="sm" style="display:block">${esc(j.customer || "")}</span>
            <span class="sm"><span>${ago(d)}</span>${ck.length ? `<span>☑ ${n}/${ck.length}</span>` : ""}</span>${dueBadge(j) ? `<span class="badges">${dueBadge(j)}</span>` : ""}</button>`; }).join("") : `<div class="col-empty">Bekleyen iş yok</div>`}
      </div>`;
    }).join("") + `<div class="col"><div class="col-h"><div class="av" style="background:var(--accent)">✓</div><b>Tamamlandı<small>${f.stages.length} aşama</small></b><span class="num">${finished.length}</span></div>
      ${finished.slice(-4).reverse().map(j => `<button class="job" data-job="${j.id}"><b>${esc(j.title)}</b><span class="sm" style="display:block">${esc(j.customer || "")}</span></button>`).join("") || `<div class="col-empty">Henüz yok</div>`}</div>`;
    $("#view").innerHTML = `<h2 class="section-title">İş akışları</h2>
      <p class="sm" style="margin:0">Her iş aşama aşama ilerler. Bir aşama bitince sıradaki kişiye otomatik iş düşer.</p>
      <div class="chips flow-chips">${chips}</div>
      ${alert}
      <div class="board-wrap" role="region" aria-label="${esc(f.name)} panosu" tabindex="0"><div class="board">${cols}</div></div>
      <button class="btn block" id="newJob">＋ Yeni iş aç · ${esc(f.name)}</button>
      <div class="btnrow"><button class="btn ghost" id="editFlow">✎ Bu akışı düzenle</button><button class="btn ghost" id="makeFlow">＋ Yeni akış oluştur</button></div>
      <h3 class="section-title" style="font-size:1.1rem;margin-top:8px">Sektöre göre hazır akışlar</h3>
      <div class="panel">${GALLERY.map((g, i) => { const has = S.flows.some(x => x.id === g.id);
        return `<div class="tpl"><div class="ico">${g.ico}</div><div style="min-width:0"><b>${esc(g.name)}</b><div class="sm">${g.stages.map(s => esc(s.name)).join(" → ")}</div></div>
        <button class="btn ghost" data-gallery="${i}"${has ? " disabled" : ""}>${has ? "Ekli" : "Ekle"}</button></div>`; }).join("")}</div>`;
  }

  const GALLERY = [
    { id: "servis", ico: "🔧", name: "Teknik servis", stages: [
      { name: "Cihaz kabul", type: "task", checklist: ["Seri no ve şikâyeti yaz", "Müşteriye fiş ver"] },
      { name: "Arıza tespiti", type: "task", checklist: ["Arızayı bul", "Parça ve ücreti hesapla"] },

  // ---------- flow editor ----------
  let draft = null;
  const ICONS = ["🏭", "🪚", "🚚", "🧱", "🔧", "📦", "🛒", "🧾", "🌴", "⭐"];
  function openEditor(id, still) {
    if (!still) {
      const src = id ? flowById(id) : null;
      draft = src ? JSON.parse(JSON.stringify(src)) : { id: null, ico: "⭐", name: "", stages: [
        { name: "Sipariş", owner: S.me, type: "task", checklist: [] }, { name: "Teslim", owner: S.me, type: "task", checklist: [] } ] };
    }

      <div class="ed-top"><span class="ed-n">${i + 1}</span>

      <div class="ed-bot">
        <select data-i="${i}" data-f="owner" aria-label="Sorumlu">${owners.map(n => `<option value="${esc(n)}"${n === st.owner ? " selected" : ""}>${esc(ownerLabel(n))}</option>`).join("")}</select>
        <select data-i="${i}" data-f="type" aria-label="Aşama tipi"><option value="task"${st.type === "task" ? " selected" : ""}>İş</option><option value="approval"${st.type === "approval" ? " selected" : ""}>Onay</option></select>
      </div>
      <input data-i="${i}" data-f="checklist" value="${esc(st.checklist.join(", "))}" placeholder="Kontrol listesi, virgülle ayır (isteğe bağlı)" aria-label="Kontrol listesi">
    </div>`).join("");
    sheet(`<div class="stack">
      <div><h2>${draft.id ? "Akışı düzenle" : "Yeni akış oluştur"}</h2><div class="sm">Aşamaları işletmenin gerçek sırasına göre diz. Her aşamaya bir sorumlu ata.</div></div>
      <div class="ed-name"><select id="edIco" aria-label="Simge">${ICONS.map(x => `<option${x === draft.ico ? " selected" : ""}>${x}</option>`).join("")}</select>

      <div class="sm" id="edMsg"></div>
      <div class="btnrow"><button class="btn ghost" id="edCancel">Vazgeç</button><button class="btn" id="edSave">Kaydet</button></div>
    </div>`, () => {
      layer.querySelectorAll("[data-f]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
        const st = draft.stages[+el.dataset.i], f = el.dataset.f;
        st[f] = f === "checklist" ? el.value.split(",").map(x => x.trim()).filter(Boolean) : el.value;
      }));
      $("#edIco").onchange = e => draft.ico = e.target.value;
      $("#edName").oninput = e => draft.name = e.target.value;
      layer.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
        const [i, d] = b.dataset.mv.split(":").map(Number); const a = draft.stages; [a[i], a[i + d]] = [a[i + d], a[i]]; openEditor(id, true); });
      layer.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { draft.stages.splice(+b.dataset.del, 1); openEditor(id, true); });
      $("#edAdd").onclick = () => { draft.stages.push({ name: "", owner: S.me, type: "task", checklist: [] }); openEditor(id, true);
        const ins = layer.querySelectorAll('[data-f="name"]'); ins[ins.length - 1].focus(); };
      $("#edCancel").onclick = close;
      $("#edSave").onclick = () => {
        draft.name = draft.name.trim();
        if (!draft.name) { $("#edMsg").textContent = "Akışa bir ad ver."; $("#edName").focus(); return; }
        if (draft.stages.some(x => !x.name.trim())) { $("#edMsg").textContent = "Her aşamanın bir adı olmalı."; return; }
        draft.stages.forEach(x => x.name = x.name.trim());
        if (draft.id) {
          const i = S.flows.findIndex(f => f.id === draft.id); S.flows[i] = draft;
          S.jobs.filter(j => j.flowId === draft.id && !j.done).forEach(j => { if (j.stage >= draft.stages.length) j.stage = draft.stages.length - 1;
            j.checks[j.stage] = draft.stages[j.stage].checklist.map((_, k) => !!(j.checks[j.stage] || [])[k]); });
        } else { draft.id = "f" + Date.now().toString(36); S.flows.push(draft); }
        curFlow = draft.id; save(); close(); render(); window.scrollTo(0, 0);
        toast(draft.ico, `${draft.name} kaydedildi`, `${draft.stages.length} aşama: ${draft.stages.map(x => x.name).join(" → ")}`);
      };
    }, still);
  }

  function openNewJob() {
    const f = flowById(curFlow);
    sheet(`<div class="newjob">
      <div><h2>Yeni iş aç</h2><div class="sm">İş, ilk aşama olan “${esc(f.stages[0].name)}” ile başlar ve ${esc(dat(displayName(f.stages[0].owner)))} düşer.</div></div>
      <label for="njFlow">Akış</label><select id="njFlow">${S.flows.map(x => `<option value="${x.id}"${x.id === f.id ? " selected" : ""}>${x.ico} ${esc(x.name)}</option>`).join("")}</select>
      <label for="njTitle">Ürün / iş</label><input id="njTitle" placeholder="Ör: Mutfak dolabı · 10 modül" autocomplete="off">
      <label for="njCust">Müşteri (isteğe bağlı)</label><input id="njCust" placeholder="Ör: Hakan Bey · Üsküdar" autocomplete="off">
      <label for="njDue">Teslim tarihi (termin)</label><input id="njDue" type="date">
      <label class="ck"><input type="checkbox" id="njUrgent"> Acil iş</label>
      <button class="btn block" id="njGo">Başlat</button>
    </div>`, () => {
      setTimeout(() => $("#njTitle").focus(), 50);
      $("#njGo").onclick = () => {
        const title = $("#njTitle").value.trim(); if (!title) { $("#njTitle").focus(); $("#njTitle").placeholder = "İşin adını yaz"; return; }
        const fl = flowById($("#njFlow").value);
        const j = { id: S.nextJob++, flowId: fl.id, title, customer: $("#njCust").value.trim(), stage: 0, stageAt: Date.now(), createdAt: Date.now(),
          checks: { 0: fl.stages[0].checklist.map(() => false) }, history: [], urgent: $("#njUrgent").checked };
        const dv = $("#njDue").value; if (dv) { const [y, m, d] = dv.split("-").map(Number); j.due = new Date(y, m - 1, d).getTime(); }
        S.jobs.push(j); const t0 = makeStageTask(j, 0); if (j.urgent) t0.text = "ACİL · " + t0.text; curFlow = fl.id; save(); close(); render();
        toast(fl.ico, `${title} başladı`, `${fl.stages[0].name} · ${fl.stages[0].owner === S.me ? "sıra sende" : dat(fl.stages[0].owner) + " iletildi"}`);
      };
    });
  }

  function openJob(id, still) {
    const j = jobById(id); if (!j) return;
    const f = flowById(j.flowId);
    const steps = f.stages.map((st, i) => {
      const h = [...j.history].reverse().find(x => x.stage === i && x.act !== "back");
      if (j.done || i < j.stage) return `<div class="step done"><div class="bul">✓</div><div><div class="step-h">${esc(st.name)}</div>
        <div class="sm">${esc(displayName(h ? h.by : st.owner))}${h ? ` · ${fmtDue({ date: h.at, hasTime: true })}` : ""}${h && h.act === "approved" ? " · onaylandı" : ""}</div></div></div>`;
      if (i > j.stage) return `<div class="step future"><div class="bul">${i + 1}</div><div><div class="step-h">${esc(st.name)}</div><div class="sm">${esc(displayName(st.owner))}${st.type === "approval" ? " · onay" : ""}</div></div></div>`;
      const ck = j.checks[i] || st.checklist.map(() => false), all = ck.every(Boolean);
      const nx = f.stages[i + 1];
      const actions = st.type === "approval"
        ? `<div class="btnrow"><button class="btn" id="jOk"${all ? "" : " disabled"}>Onayla ✓</button><button class="btn warn" id="jBack"${i === 0 ? " disabled" : ""}>Geri gönder</button></div>
           <input class="note-in" id="jNote" placeholder="Geri gönderirken not (ör: fiyatı tekrar hesapla)" autocomplete="off">`
        : `<button class="btn block" id="jOk"${all ? "" : " disabled"}>Aşamayı bitir${nx ? ` → ${esc(nx.name)}` : ""}</button>`;
      return `<div class="step cur"><div class="bul">${i + 1}</div><div style="min-width:0"><div class="step-h">${esc(st.name)} ${st.type === "approval" ? `<span class="tag-appr">Onay</span>` : ""}</div>
        <div class="sm">${esc(displayName(st.owner))} · ${ago(daysIn(j))} bu aşamada</div>
        <div class="curbox">${ck.map((v, k) => `<label class="ck"><input type="checkbox" data-ck="${k}"${v ? " checked" : ""}> ${esc(st.checklist[k])}</label>`).join("")}
        ${!all ? `<div class="sm">Kontrol listesi tamamlanınca ${st.type === "approval" ? "onaylanabilir" : "sonraki aşamaya geçer"}.</div>` : ""}
        ${actions}</div></div></div>`;
    }).join("");
    const backs = j.history.filter(h => h.act === "back");
    sheet(`<div class="stack">
      <div><div class="sm">${f.ico} ${esc(f.name)}</div><h2>${esc(j.title)}</h2><div class="sm">${esc(j.customer || "")}</div>${dueBadge(j) ? `<div class="badges">${dueBadge(j)}</div>` : ""}</div>
      ${j.done ? `<div class="alert ok"><span>🏁</span><div><b>Tamamlandı</b><br>${f.stages.length} aşamanın hepsi bitti.</div></div>` : ""}
      <div class="steps">${steps}</div>
      ${backs.length ? `<div class="hist">${backs.map(h => `<div>↩ ${esc(f.stages[h.stage].name)} aşamasından geri gönderildi${h.note ? `: “${esc(h.note)}”` : ""}</div>`).join("")}</div>` : ""}
      <button class="btn ghost block" id="jClose">Kapat</button>
    </div>`, () => {
      $("#jClose").onclick = close;
      layer.querySelectorAll("[data-ck]").forEach(cb => cb.onchange = () => {
        j.checks[j.stage] = j.checks[j.stage] || [];
        j.checks[j.stage][+cb.dataset.ck] = cb.checked; save(); render(); openJob(id, true);
      });
      const ok = $("#jOk"); if (ok) ok.onclick = () => { advance(j); render(); openJob(id, true); };
      const bk = $("#jBack"); if (bk) bk.onclick = () => { sendBack(j, $("#jNote").value.trim()); render(); openJob(id, true); };
    }, still);
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("button, a"); if (!el) return;
    if (el.dataset.tab) { tab = el.dataset.tab; render(); window.scrollTo(0, 0); }
    else if (el.dataset.filter) { filter = el.dataset.filter; render(); }
    else if (el.dataset.toggle) {
      const t = S.tasks.find(x => x.id === +el.dataset.toggle);
      t.done = !t.done; t.doneAt = t.done ? Date.now() : null; if (t.done) t.seen = true; save();
      if (t.done && !onTaskDone(t)) toast("✅", "Halloldu", t.text);
      render();
    }
    else if (el.dataset.guest) openGuest(+el.dataset.guest);
    else if (el.dataset.flow) { curFlow = el.dataset.flow; render(); }
    else if (el.dataset.job) openJob(+el.dataset.job);
    else if (el.dataset.gallery) addFromGallery(+el.dataset.gallery);
    else if (el.id === "newJob") openNewJob();
    else if (el.id === "editFlow") openEditor(curFlow);
    else if (el.id === "makeFlow") openEditor(null);
    else if (el.dataset.tpl) {
      const tp = TEMPLATES[+el.dataset.tpl];
      tp.items.forEach(text => S.tasks.push({ id: S.nextId++, who: S.me, text, date: at(0), hasTime: false, done: false, seen: true, code: code() }));
      save(); toast("⧉", `${tp.name} eklendi`, `${tp.items.length} iş bugünün listesinde`);
      tab = "isler"; filter = "today"; render();
    }
    else if (el.id === "fab") openCompose();
    else if (el.id === "reset") { S = seedJobs(SEED()); save(); filter = "all"; render(); toast("↺", "Örnek veriler geri yüklendi", "Prototip baştan başladı"); }
    else if (el.id === "invite") openCompose("");
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") close();
    if (e.key === "Enter" && e.target.id === "say" && $("#give")) $("#give").click();
  });

  render();
  setInterval(render, 60000);
})();
</script>
